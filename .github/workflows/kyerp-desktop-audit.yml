name: KY ERP Desktop Audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/kyerp-desktop-audit
    paths:
      - '.kyerp-audit/trigger.txt'
      - 'TOOLS/kyerp-browser-audit/**'
      - '.github/workflows/kyerp-desktop-audit.yml'

permissions:
  contents: read

concurrency:
  group: kyerp-desktop-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, kyerp-desktop]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Runner identity
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          whoami
          if (Test-Path 'C:\Program Files\Tailscale\tailscale.exe') {
            & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
          }
          node --version
          npm --version

      - name: Prepare browser audit runtime
        working-directory: TOOLS/kyerp-browser-audit
        run: |
          if (-not (Test-Path package.json)) {
            npm init -y | Out-Null
          }
          npm install --no-save playwright-core

      - name: Run public visual and API smoke
        env:
          KYERP_BASE_URL: https://kyerp.net
          KYERP_API_URL: https://api.kyerp.net/api
        run: node TOOLS/kyerp-browser-audit/audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyerp-desktop-audit-${{ github.run_id }}
          path: TOOLS/kyerp-browser-audit/results
          if-no-files-found: warn
          retention-days: 3

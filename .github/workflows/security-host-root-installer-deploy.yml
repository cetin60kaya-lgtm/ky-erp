name: KY Security Root Installer Deploy

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/security-host-root-installer-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-security-root-installer
  cancel-in-progress: false

jobs:
  deploy-security-host:
    name: Deploy security host root installer cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and Cloudflare auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          node --check APP/cloud/ky-erp-security-host/worker.js
          grep -q 'isFreshInstallHandoff' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'incoming.searchParams.get("install") === "1"' APP/cloud/ky-erp-security-host/worker.js

      - name: Deploy security host Worker only
        working-directory: APP/cloud/ky-erp-security-host
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 deploy --config wrangler.jsonc

      - name: Verify live fresh-install cutover and legacy launch compatibility
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            install_headers="$(curl -sS -D - -o /dev/null --max-time 15 "https://security.kyerp.net/ky-guvenlik/?install=1&platform=android&probe=${stamp}-${i}" || true)"
            install_location="$(printf '%s' "$install_headers" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}')"
            if printf '%s' "$install_headers" | grep -Eq '^HTTP/[^ ]+ 308' \
              && printf '%s' "$install_location" | grep -Eq '^https://security\.kyerp\.net/\?'; then
              legacy_code="$(curl -sS -o /tmp/legacy.html -w '%{http_code}' --max-time 15 "https://security.kyerp.net/ky-guvenlik/?probe=${stamp}-${i}")"
              root_code="$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 15 "https://security.kyerp.net/?probe=${stamp}-${i}")"
              test "$legacy_code" = "200"
              test "$root_code" = "200"
              grep -q 'KY ERP Güvenlik' /tmp/legacy.html
              grep -q 'KY ERP Güvenlik' /tmp/root.html
              echo "Fresh install cutover is live; legacy standalone launch remains compatible."
              exit 0
            fi
            sleep 5
          done
          echo "Live fresh-install cutover verification failed." >&2
          exit 1

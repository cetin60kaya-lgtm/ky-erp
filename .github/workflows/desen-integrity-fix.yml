name: KY ERP Desen Integrity Fix

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/desen-integrity-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic patch
        run: python3 tools/ci/desen_integrity_fix.py

      - name: Worker typecheck and dry build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend lint and production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify fixed contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'return apiUrl(url);' APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx
          grep -Fq 'totals: calculateTotals([operation])' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -Fq 'function filterModelRows' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -Fq 'totalModels: rows.length' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -Fq 'ERP eklenme:' APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx
          grep -Fq 'Tarih: Dosya Tarihi' APP/app/ky-erp-frontend/src/pages/desen/DesenRaporlari.jsx
          grep -Fq 'operation.totals?.activeChannelCount' APP/app/ky-erp-frontend/src/pages/desen/YerlesimKalipPage.jsx

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add \
            APP/cloud/ky-erp-api/src/desen-workflow.ts \
            APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/DesenRaporlari.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/YerlesimKalipPage.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/desenWorkflow.css \
            APP/app/ky-erp-frontend/src/pages/boyahane/workflow/QueueDesignModal.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: restore design images dates reports and placement"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

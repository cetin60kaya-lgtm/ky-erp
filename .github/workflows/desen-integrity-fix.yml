name: KY ERP Desen Integrity Fix

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/desen-integrity-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Desen integrity fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Global Desen image URL resolver: API_BASE already ends with /api.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import { API_BASE } from "../../utils/api";', 'import { apiUrl } from "../../utils/api";', 1)
          old = '''export function assetUrl(value) {\n  const url = String(value || "").trim();\n  if (!url) return "";\n  if (/^(blob:|data:|https?:\\/\\/)/i.test(url)) return url;\n  return `${API_BASE}${url.startsWith("/") ? url : `/${url}`}`;\n}'''
          new = '''export function assetUrl(value) {\n  const url = String(value || "").trim();\n  if (!url) return "";\n  if (/^(blob:|data:|https?:\\/\\/)/i.test(url)) return url;\n  return apiUrl(url);\n}'''
          if old not in s:
              raise SystemExit('assetUrl anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Backend: operation totals, source/original file date, shared filters and correct summaries.
          p = Path('APP/cloud/ky-erp-api/src/desen-workflow.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const operations = (Array.isArray(model.operations) ? model.operations : []).map(\n    normalizeOperation,\n  );'''
          new = '''  const operations = (Array.isArray(model.operations) ? model.operations : [])\n    .map(normalizeOperation)\n    .map((operation) => ({\n      ...operation,\n      totals: calculateTotals([operation]),\n    }));'''
          if old not in s:
              raise SystemExit('modelView operations anchor not found')
          s = s.replace(old, new, 1)
          old = '''  const mainImage =\n    files.find((file) => file.role === "MODEL_IMAGE") ||\n    files.find((file) => /image\\//i.test(text(file.contentType))) ||\n    model.mainImage ||\n    null;\n  return {'''
          new = '''  const mainImage =\n    files.find((file) => file.role === "MODEL_IMAGE") ||\n    files.find((file) => /image\\//i.test(text(file.contentType))) ||\n    model.mainImage ||\n    null;\n  const sourceModifiedAt = text(\n    model.sourceModifiedAt ||\n      mainImage?.sourceModifiedAt ||\n      mainImage?.metadata?.sourceModifiedAt ||\n      "",\n  );\n  return {'''
          if old not in s:
              raise SystemExit('modelView mainImage anchor not found')
          s = s.replace(old, new, 1)
          old = '''    mainImage,\n    totals: calculateTotals(operations),'''
          new = '''    mainImage,\n    sourceModifiedAt,\n    totals: calculateTotals(operations),'''
          if old not in s:
              raise SystemExit('modelView return anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('imageUrl: model.mainImage?.previewUrl || "",', 'imageUrl: model.mainImage?.thumbnailUrl || model.mainImage?.previewUrl || "",', 1)

          helper = r'''
function isoDateKey(value: unknown) {
  const raw = text(value);
  if (!raw) return "";
  const date = new Date(raw);
  return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0, 10);
}

function filterModelRows(c: Context<AppEnv>, rows: Row[]) {
  const q = normalize(c.req.query("q"));
  const companyId = text(c.req.query("companyId"));
  const status = text(c.req.query("status"));
  const printAreaCode = text(c.req.query("printAreaCode"));
  const placementStatus = text(c.req.query("placementStatus"));
  const dyehouseStatus = text(c.req.query("dyehouseStatus"));
  const dateField = text(c.req.query("dateField") || "createdAt");
  const dateFrom = text(c.req.query("dateFrom"));
  const dateTo = text(c.req.query("dateTo"));
  const sort = text(c.req.query("sort") || "created_desc");

  const filtered = rows
    .filter((row) => row.status !== "ARCHIVE" || status === "ARCHIVE")
    .filter(
      (row) =>
        !q ||
        normalize(
          `${row.modelName} ${row.modelCode} ${row.companyName} ${JSON.stringify(row.metadata)}`,
        ).includes(q),
    )
    .filter((row) => !companyId || row.companyId === companyId)
    .filter((row) => !status || row.status === status)
    .filter(
      (row) =>
        !printAreaCode ||
        row.operations.some((operation: Row) => operation.printAreaCode === printAreaCode),
    )
    .filter(
      (row) =>
        !placementStatus ||
        row.operations.some(
          (operation: Row) => operation.placementStatus === placementStatus,
        ),
    )
    .filter(
      (row) =>
        !dyehouseStatus ||
        row.operations.some(
          (operation: Row) => operation.dyehouseStatus === dyehouseStatus,
        ),
    )
    .filter((row) => {
      if (!dateFrom && !dateTo) return true;
      const value =
        dateField === "sourceModifiedAt"
          ? row.sourceModifiedAt
          : dateField === "updatedAt"
            ? row.updatedAt
            : row.createdAt;
      const key = isoDateKey(value);
      if (!key) return false;
      if (dateFrom && key < dateFrom) return false;
      if (dateTo && key > dateTo) return false;
      return true;
    });

  const byTime = (value: unknown) => {
    const ms = Date.parse(text(value));
    return Number.isFinite(ms) ? ms : 0;
  };
  filtered.sort((a, b) => {
    if (sort === "name_asc") return text(a.modelName).localeCompare(text(b.modelName), "tr");
    if (sort === "source_desc") return byTime(b.sourceModifiedAt) - byTime(a.sourceModifiedAt);
    if (sort === "updated_desc") return byTime(b.updatedAt) - byTime(a.updatedAt);
    return byTime(b.createdAt) - byTime(a.createdAt);
  });
  return filtered;
}

function designSummary(rows: Row[]) {
  const newArrival = rows.filter((row) => row.status === "NEW_ARRIVAL").length;
  const channelImageMissing = rows.filter((row) => row.status === "CHANNEL_IMAGE_MISSING").length;
  const channelReviewPending = rows.filter((row) => row.status === "CHANNEL_REVIEW_PENDING").length;
  const colorMatchMissing = rows.filter((row) => row.status === "COLOR_MATCH_MISSING").length;
  const placementWaiting = rows.filter((row) =>
    row.operations.some((operation: Row) => operation.placementStatus !== "READY"),
  ).length;
  const dyehouseReady = rows.filter((row) => row.status === "DYEHOUSE_READY").length;
  const productionReady = rows.filter((row) => row.status === "PRODUCTION_READY").length;
  const unresolvedColorCount = rows.reduce(
    (sum, row) => sum + num(row.totals.unresolvedColorCount),
    0,
  );
  return {
    totalModels: rows.length,
    modelCount: rows.length,
    newArrival,
    channelImageMissing,
    channelReviewPending,
    colorMatchMissing,
    placementWaiting,
    dyehouseReady,
    readyForDyehouse: dyehouseReady,
    productionReady,
    unresolvedColorCount,
  };
}

'''
          anchor = 'export function registerDesenWorkflowRoutes(app: Hono<AppEnv>) {'
          if anchor not in s:
              raise SystemExit('register route anchor not found')
          s = s.replace(anchor, helper + anchor, 1)

          model_route_pattern = re.compile(r'''  app\.get\("/api/desen/workflow/models", async \(c\) => \{.*?\n  \}\);\n\n  app\.get\("/api/desen/workflow/models/:id"''', re.S)
          model_route_new = '''  app.get("/api/desen/workflow/models", async (c) => {\n    const slug = slugOf(c);\n    const limit = Math.min(2000, Math.max(1, num(c.req.query("limit") || 1000)));\n    const allRows = filterModelRows(\n      c,\n      (await storeList(c, MODEL_SCOPE, slug)).map(modelView),\n    );\n    const rows = allRows.slice(0, limit);\n    return c.json({\n      ok: true,\n      success: true,\n      data: { rows, total: allRows.length, returned: rows.length },\n    });\n  });\n\n  app.get("/api/desen/workflow/models/:id"'''
          s, count = model_route_pattern.subn(model_route_new, s, count=1)
          if count != 1:
              raise SystemExit('models route replacement failed')

          report_pattern = re.compile(r'''  app\.get\("/api/desen/workflow/reports", async \(c\) => \{.*?\n  \}\);\n\n  app\.get\("/api/desen/workflow/reports/export"''', re.S)
          report_new = '''  app.get("/api/desen/workflow/reports", async (c) => {\n    const slug = slugOf(c);\n    const rows = filterModelRows(\n      c,\n      (await storeList(c, MODEL_SCOPE, slug)).map(modelView),\n    );\n    return c.json({\n      ok: true,\n      success: true,\n      data: { summary: designSummary(rows), rows },\n    });\n  });\n\n  app.get("/api/desen/workflow/reports/export"'''
          s, count = report_pattern.subn(report_new, s, count=1)
          if count != 1:
              raise SystemExit('reports route replacement failed')

          s = s.replace(
              'const rows = (await storeList(c, MODEL_SCOPE, slug)).map(modelView);\n    const escape',
              'const rows = filterModelRows(c, (await storeList(c, MODEL_SCOPE, slug)).map(modelView));\n    const escape',
              1,
          )
          old = '''        "Eksik Renk",\n        "Son Güncelleme",'''
          new = '''        "Eksik Renk",\n        "ERP Eklenme",\n        "Dosya Tarihi",\n        "Son Güncelleme",'''
          if old not in s:
              raise SystemExit('export header anchor not found')
          s = s.replace(old, new, 1)
          old = '''          row.totals.unresolvedColorCount,\n          row.updatedAt,'''
          new = '''          row.totals.unresolvedColorCount,\n          row.createdAt,\n          row.sourceModifiedAt,\n          row.updatedAt,'''
          if old not in s:
              raise SystemExit('export row date anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Desen Havuzu: date/filter/sort controls + useful dates + thumbnail.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'const [filters, setFilters] = useState({ q: "", companyId: "", status: "", printAreaCode: "", placementStatus: "" });',
              'const [filters, setFilters] = useState({ q: "", companyId: "", status: "", printAreaCode: "", placementStatus: "", dateField: "createdAt", dateFrom: "", dateTo: "", sort: "created_desc" });',
              1,
          )
          s = s.replace(
              'filters.printAreaCode, filters.placementStatus, load]);',
              'filters.printAreaCode, filters.placementStatus, filters.dateField, filters.dateFrom, filters.dateTo, filters.sort, load]);',
              1,
          )
          s = s.replace(
              'filters.printAreaCode, filters.placementStatus]);',
              'filters.printAreaCode, filters.placementStatus, filters.dateField, filters.dateFrom, filters.dateTo, filters.sort]);',
              1,
          )
          marker = '<div className="dsg-view-switch"><button className={view === "cards" ? "active" : ""}'
          controls = '''<select value={filters.dateField} onChange={(event) => setFilters((current) => ({ ...current, dateField: event.target.value }))}><option value="createdAt">Tarih: ERP'ye Eklenme</option><option value="sourceModifiedAt">Tarih: Dosya Tarihi</option><option value="updatedAt">Tarih: Son Güncelleme</option></select><input className="dsg-date-input" type="date" aria-label="Başlangıç tarihi" value={filters.dateFrom} onChange={(event) => setFilters((current) => ({ ...current, dateFrom: event.target.value }))} /><input className="dsg-date-input" type="date" aria-label="Bitiş tarihi" value={filters.dateTo} onChange={(event) => setFilters((current) => ({ ...current, dateTo: event.target.value }))} /><select value={filters.sort} onChange={(event) => setFilters((current) => ({ ...current, sort: event.target.value }))}><option value="created_desc">Yeni Eklenenler</option><option value="source_desc">Yeni Dosya Tarihi</option><option value="updated_desc">Son Güncellenenler</option><option value="name_asc">Model A-Z</option></select>'''
          if marker not in s:
              raise SystemExit('DesenModeller view switch anchor not found')
          s = s.replace(marker, controls + marker, 1)
          s = s.replace('<ScanLine size={16} /> Gelen Klasörü Tara</button>', '<ScanLine size={16} /> Gelen Desenler</button>', 1)
          s = s.replace('Gerçek Desen kayıtları · Son güncellenenler önce', 'Gerçek Desen kayıtları · ERP eklenme, dosya ve güncelleme tarihleriyle')
          old = '''<small>{analysis.analyzedAt ? `Akıllı tarama: ${formatDate(analysis.analyzedAt)}` : `Güncelleme: ${formatDate(model.updatedAt)}`}</small>'''
          new = '''<div className="dsg-date-meta"><small>ERP eklenme: {formatDate(model.createdAt)}</small><small>Dosya tarihi: {formatDate(model.sourceModifiedAt)}</small><small>{analysis.analyzedAt ? `Akıllı tarama: ${formatDate(analysis.analyzedAt)}` : `Güncelleme: ${formatDate(model.updatedAt)}`}</small></div>'''
          if old not in s:
              raise SystemExit('DesenModeller card date anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('<th>Durum</th><th>Son Güncelleme</th><th /></tr>', '<th>Durum</th><th>ERP Eklenme</th><th>Dosya Tarihi</th><th>Son Güncelleme</th><th /></tr>', 1)
          s = s.replace('<td><StatusBadge value={model.status} /></td><td>{formatDate(model.updatedAt)}</td><td><button', '<td><StatusBadge value={model.status} /></td><td>{formatDate(model.createdAt)}</td><td>{formatDate(model.sourceModifiedAt)}</td><td>{formatDate(model.updatedAt)}</td><td><button', 1)
          p.write_text(s, encoding='utf-8')

          # 4) Reports: same date filters, correct summary keys, thumbnail and dates.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenRaporlari.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'const [filters, setFilters] = useState({ q: "", companyId: "", status: "", printAreaCode: "", placementStatus: "", dyehouseStatus: "" });',
              'const [filters, setFilters] = useState({ q: "", companyId: "", status: "", printAreaCode: "", placementStatus: "", dyehouseStatus: "", dateField: "createdAt", dateFrom: "", dateTo: "", sort: "created_desc" });',
              1,
          )
          s = s.replace(
              'filters.printAreaCode, filters.placementStatus, filters.dyehouseStatus, load]);',
              'filters.printAreaCode, filters.placementStatus, filters.dyehouseStatus, filters.dateField, filters.dateFrom, filters.dateTo, filters.sort, load]);',
              1,
          )
          s = s.replace(
              'filters.printAreaCode, filters.placementStatus, filters.dyehouseStatus]);',
              'filters.printAreaCode, filters.placementStatus, filters.dyehouseStatus, filters.dateField, filters.dateFrom, filters.dateTo, filters.sort]);',
              1,
          )
          s = s.replace('["Toplam Model", report.summary.totalModels, FileImage, "blue"]', '["Toplam Model", report.summary.totalModels ?? report.summary.modelCount, FileImage, "blue"]', 1)
          marker = '<button className="dsg-btn" onClick={load}><RefreshCw size={16} /> Yenile</button>'
          controls = '''<select value={filters.dateField} onChange={(event) => setFilters((current) => ({ ...current, dateField: event.target.value }))}><option value="createdAt">Tarih: ERP'ye Eklenme</option><option value="sourceModifiedAt">Tarih: Dosya Tarihi</option><option value="updatedAt">Tarih: Son Güncelleme</option></select><input className="dsg-date-input" type="date" aria-label="Rapor başlangıç tarihi" value={filters.dateFrom} onChange={(event) => setFilters((current) => ({ ...current, dateFrom: event.target.value }))} /><input className="dsg-date-input" type="date" aria-label="Rapor bitiş tarihi" value={filters.dateTo} onChange={(event) => setFilters((current) => ({ ...current, dateTo: event.target.value }))} /><select value={filters.sort} onChange={(event) => setFilters((current) => ({ ...current, sort: event.target.value }))}><option value="created_desc">Yeni Eklenenler</option><option value="source_desc">Yeni Dosya Tarihi</option><option value="updated_desc">Son Güncellenenler</option><option value="name_asc">Model A-Z</option></select>'''
          if marker not in s:
              raise SystemExit('reports filter anchor not found')
          s = s.replace(marker, controls + marker, 1)
          s = s.replace('assetUrl(model.mainImage.previewUrl)', 'assetUrl(model.mainImage.thumbnailUrl || model.mainImage.previewUrl)')
          s = s.replace('<th>Durum</th><th>Son İşlem</th></tr>', '<th>Durum</th><th>ERP Eklenme</th><th>Dosya Tarihi</th><th>Son İşlem</th></tr>', 1)
          s = s.replace('<td><StatusBadge value={model.status} /></td><td>{formatDate(model.updatedAt)}</td></tr>', '<td><StatusBadge value={model.status} /></td><td>{formatDate(model.createdAt)}</td><td>{formatDate(model.sourceModifiedAt)}</td><td>{formatDate(model.updatedAt)}</td></tr>', 1)
          p.write_text(s, encoding='utf-8')

          # 5) Placement screen: prevent totals crash and use thumbnail where possible.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/YerlesimKalipPage.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'models.flatMap((model) => model.operations.map((operation) => ({ model, operation })))',
              'models.flatMap((model) => (Array.isArray(model.operations) ? model.operations : []).map((operation) => ({ model, operation })))',
              1,
          )
          s = s.replace('assetUrl(model.mainImage.previewUrl)', 'assetUrl(model.mainImage.thumbnailUrl || model.mainImage.previewUrl)')
          s = s.replace('operation.totals.activeChannelCount', '(operation.totals?.activeChannelCount || 0)')
          s = s.replace('operation.totals.totalMoldCount', '(operation.totals?.totalMoldCount || 0)')
          s = s.replace('operation.totals.uniqueColorCount', '(operation.totals?.uniqueColorCount || 0)')
          p.write_text(s, encoding='utf-8')

          # 6) Boyahane design picker uses tiny thumbnail first.
          p = Path('APP/app/ky-erp-frontend/src/pages/boyahane/workflow/QueueDesignModal.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src={model.mainImage?.previewUrl}', 'src={model.mainImage?.thumbnailUrl || model.mainImage?.previewUrl}')
          p.write_text(s, encoding='utf-8')

          # 7) Small responsive date styling.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/desenWorkflow.css')
          s = p.read_text(encoding='utf-8')
          anchor = '.dsg-scan-tools select, .dsg-filter-grid select { padding: 6px 9px; }'
          addition = '''.dsg-scan-tools select, .dsg-filter-grid select { padding: 6px 9px; }\n.dsg-filter-grid .dsg-date-input { min-height: 34px; min-width: 132px; padding: 6px 8px; border: 1px solid #c8d8e8; border-radius: 8px; background: #fff; color: var(--dsg-ink); font: inherit; font-size: 12px; }\n.dsg-date-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--dsg-muted); }\n.dsg-date-meta small { white-space: nowrap; }'''
          if anchor not in s:
              raise SystemExit('css filter anchor not found')
          s = s.replace(anchor, addition, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Worker typecheck and dry build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend lint and production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify fixed contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'return apiUrl(url);' APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx
          grep -q 'totals: calculateTotals(\[operation\])' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -q 'function filterModelRows' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -q 'totalModels: rows.length' APP/cloud/ky-erp-api/src/desen-workflow.ts
          grep -q 'ERP eklenme:' APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx
          grep -q 'Tarih: Dosya Tarihi' APP/app/ky-erp-frontend/src/pages/desen/DesenRaporlari.jsx
          grep -q 'operation.totals?.activeChannelCount' APP/app/ky-erp-frontend/src/pages/desen/YerlesimKalipPage.jsx

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add APP/cloud/ky-erp-api/src/desen-workflow.ts \
                  APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx \
                  APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx \
                  APP/app/ky-erp-frontend/src/pages/desen/DesenRaporlari.jsx \
                  APP/app/ky-erp-frontend/src/pages/desen/YerlesimKalipPage.jsx \
                  APP/app/ky-erp-frontend/src/pages/desen/desenWorkflow.css \
                  APP/app/ky-erp-frontend/src/pages/boyahane/workflow/QueueDesignModal.jsx
          git commit -m "fix: restore design images dates reports and placement"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

name: IK final payment deploy

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-final-payment-trigger.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uretim-tek-merkez
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final IK patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:tools/ik-final-payment-patch.py > /tmp/ik-final-payment-patch.py
          python /tmp/ik-final-payment-patch.py
          git diff --check
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx APP/cloud/ky-erp-api/src/ik-relational-cloud.ts APP/cloud/ky-erp-api/migrations/0007_hr_base_employee_legal_deduction.sql
          git commit -m "feat: finalize IK payment slips and legal deductions"
          git push origin HEAD:agent/uretim-tek-merkez
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          database_id='b504b712-6927-499d-815d-0b954c8ee246'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          for account_id in $(jq -r '.result[]?.id' <<<"$accounts"); do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Install and check Worker
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Install and build frontend
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
          VITE_API_BASE_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run build
      - name: Apply D1 migration
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler d1 migrations apply ky-erp-db --remote --config wrangler.jsonc
      - name: Deploy Worker
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx wrangler pages deploy dist --project-name ky-erp-frontend --branch agent/uretim-tek-merkez
      - name: Verify live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.kyerp.net/api/health >/tmp/health.json
          cat /tmp/health.json
          curl --fail --silent --show-error "https://api.kyerp.net/api/ik/advanced/month?mainCompanyId=mecit-hakan&year=2026&month=8" >/tmp/ik.json
          jq -e '.ok == true and (.data.employees | type == "array")' /tmp/ik.json >/dev/null
          curl --fail --silent --show-error https://app.kyerp.net/ >/tmp/app.html
          grep -qi '<div id="root"' /tmp/app.html

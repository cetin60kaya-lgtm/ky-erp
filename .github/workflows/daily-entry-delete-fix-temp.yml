# trigger: 2026-09-30T11:50+03:00
name: Daily Entry Delete Fix Temp

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-entry-delete-fix-temp.yml

permissions:
  contents: write

concurrency:
  group: daily-entry-delete-fix-temp
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/model-uretim-kontrol-merkezi-final

      - name: Patch immediate shift delete and safe roster prune
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx')
          text = path.read_text(encoding='utf-8')

          roster_anchor = '''  const removeRosterPerson = (personId) => {
            setRosterIds((current) => { const next = new Set(current); next.delete(personId); return next; });
            setSelectedIds((current) => { const next = new Set(current); next.delete(personId); return next; });
            setCheckedIds((current) => { const next = new Set(current); next.delete(personId); return next; });
            setRosterSaved(false);
          };
          '''

          handler = '''  const deleteShiftAndCleanupRoster = async (person) => {
            if (!person?.id || busy || periodLocked) return;
            const currentRecord = recordByEmployee.get(person.id) || {};
            setBusy(true); setError(\"\"); setNotice(\"\");
            try {
              await saveDailyFocusedRecords({
                mainCompanyId: companyId,
                date: selectedDate,
                shift,
                personnelEntries: [{
                  personelId: person.id,
                  status: \"REMOVE\",
                  checked: false,
                  expectedUpdatedAt: currentRecord.updatedAt || currentRecord.attendanceUpdatedAt || \"\",
                  note: \"\",
                }],
              });

              const requestedRosterIds = [...rosterIds].filter((id) => id !== person.id);
              const savedRoster = await saveDailyRoster({
                mainCompanyId: companyId,
                startDate: range.start,
                endDate: range.end,
                employeeIds: requestedRosterIds,
              });
              const finalRosterIds = new Set(
                Array.isArray(savedRoster?.employeeIds)
                  ? savedRoster.employeeIds.map(String)
                  : requestedRosterIds,
              );
              const keptForOtherWork = finalRosterIds.has(person.id);

              setRosterIds(finalRosterIds);
              setRosterSaved(true);
              setSelectedIds((current) => { const next = new Set(current); next.delete(person.id); return next; });
              setCheckedIds((current) => { const next = new Set(current); next.delete(person.id); return next; });
              setNotes((current) => { const next = { ...current }; delete next[person.id]; return next; });

              await Promise.all([loadFocused(), loadRangeData()]);
              setNotice(
                keptForOtherWork
                  ? `${person.name} ${shift === \"day\" ? \"gündüz\" : \"gece\"} kaydı silindi. Tarih aralığında başka kaydı olduğu için havuzda kaldı.`
                  : `${person.name} ${shift === \"day\" ? \"gündüz\" : \"gece\"} kaydı silindi; tarih aralığında başka kaydı olmadığı için havuzdan da çıkarıldı.`,
              );
            } catch (e) {
              setError(e?.message || \"Vardiya kaydı silinemedi. Ekranı yenileyip tekrar deneyin.\");
            } finally {
              setBusy(false);
            }
          };
          '''

          if 'const deleteShiftAndCleanupRoster = async (person)' not in text:
              if roster_anchor not in text:
                  raise SystemExit('removeRosterPerson anchor not found')
              text = text.replace(roster_anchor, roster_anchor + handler, 1)

          old_button = '''<button type=\"button\" title=\"Bu vardiyadan kaldır\" disabled={!selected || periodLocked} onClick={() => { setSelectedIds((current) => { const next = new Set(current); next.delete(person.id); return next; }); setCheckedIds((current) => { const next = new Set(current); next.delete(person.id); return next; }); }}><Trash2 size={14}/></button>'''
          new_button = '''<button type=\"button\" title=\"Bu vardiya kaydını sil\" disabled={!selected || periodLocked || busy} onClick={() => deleteShiftAndCleanupRoster(person)}><Trash2 size={14}/></button>'''
          if old_button in text:
              text = text.replace(old_button, new_button, 1)
          elif new_button not in text:
              raise SystemExit('trash button anchor not found')

          if text.count('const deleteShiftAndCleanupRoster = async (person)') != 1:
              raise SystemExit('handler count invalid')
          if text.count('onClick={() => deleteShiftAndCleanupRoster(person)}') != 1:
              raise SystemExit('trash handler binding count invalid')
          if 'title=\"Bu vardiyadan kaldır\"' in text:
              raise SystemExit('old local-only trash action still present')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Lint test build
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          if git diff --cached --quiet; then
            echo 'No app change required.'
          else
            git commit -m 'fix(daily): delete shift immediately and prune empty roster'
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

      - name: Verify Cloudflare credentials
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.118.0 whoami

      - name: Deploy Pages production
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 pages deploy dist \
            --project-name ky-erp-frontend \
            --branch codex/model-uretim-kontrol-merkezi-final \
            --commit-hash "$(git rev-parse HEAD)"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-payments; do
            ok=0
            for i in {1..12}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = 1
            echo "$path live: OK"
          done

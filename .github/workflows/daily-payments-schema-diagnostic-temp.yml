name: KYERP Daily Payments Schema Diagnostic TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payments-schema-diagnostic-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect production D1 schema
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.github/daily-payments-schema-diagnostic.txt"
          {
            echo '=== hr_daily_payments ==='
            npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "PRAGMA table_info(hr_daily_payments);"
            echo '=== hr_daily_payment_items ==='
            npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "PRAGMA table_info(hr_daily_payment_items);"
            echo '=== indexes ==='
            npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND name LIKE 'idx_daily_payment%';"
            echo '=== triggers ==='
            npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name LIKE 'trg_daily_sync_payment%';"
          } > "$OUT" 2>&1
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add .github/daily-payments-schema-diagnostic.txt
          git commit -m "chore: capture production daily payment schema"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

# transformer v3 frontend-diagnostic
name: KYERP Daily Payments Ledger Final TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payments-ledger-final-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyerp-daily-payments-ledger-final
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply payment ledger final
        shell: bash
        run: |
          set -uo pipefail
          if ! python3 .github/scripts/daily_payments_ledger_diag.py; then
            git config user.name "kyerp-production-bot"
            git config user.email "kyerp-production-bot@users.noreply.github.com"
            git add .github/payment_patch_error.txt
            git commit -m "chore: capture payments patch diagnostic" || true
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
            exit 1
          fi
          set -e
          git diff --check
          grep -q 'CREATE TABLE IF NOT EXISTS hr_daily_payments' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'idx_daily_payment_item_active' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'Yapılan Ödemeler' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'getDailyPaymentHistory' APP/app/ky-erp-frontend/src/services/dailyOpsApi.js

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! npm run lint >/tmp/payment-frontend.log 2>&1; then
            cd ../../..
            tail -n 220 /tmp/payment-frontend.log > .github/payment_frontend_error.txt
            git config user.name "kyerp-production-bot"
            git config user.email "kyerp-production-bot@users.noreply.github.com"
            git add .github/payment_frontend_error.txt
            git commit -m "chore: capture payments frontend diagnostic" || true
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
            exit 1
          fi
          npm test
          npm run build

      - name: API typecheck test build
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build

      - name: Commit application fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts APP/app/ky-erp-frontend/src/services/dailyOpsApi.js APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          if ! git diff --cached --quiet; then
            git commit -m "feat(daily): add auditable payment ledger and history"
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

      - name: Deploy API Worker
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy

      - name: Deploy frontend Pages
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist \
            --project-name ky-erp-frontend \
            --branch codex/model-uretim-kontrol-merkezi-final \
            --commit-hash "$(git rev-parse HEAD)"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          api_ok=0
          for i in {1..12}; do
            code="$(curl -sS -o /tmp/api.html -w '%{http_code}' https://api.kyerp.net/api/gunluk-operasyon/payments/pool || true)"
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "400" ] || [ "$code" = "200" ]; then api_ok=1; break; fi
            sleep 5
          done
          test "$api_ok" = 1
          for path in /gunluk-operasyon/daily-payments /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-weekly; do
            ok=0
            for i in {1..12}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
            echo "$path live: OK"
          done

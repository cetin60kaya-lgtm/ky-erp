name: IK Annual Leave Finalize

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/ik-leave-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0

      - name: Fetch latest IK source branch
        run: git fetch origin agent/uretim-tek-merkez:refs/remotes/origin/agent/uretim-tek-merkez

      - name: Apply complete annual leave cleanup
        run: |
          python3 .github/ik_leave_final_patch.py
          python3 .github/ik_leave_toolchain_patch.py
          python3 .github/ik_leave_lint_fix.py

      - name: Validate patch markers and diff
        run: |
          sed -i 's/[[:space:]]\+$//' APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx
          git diff --check
          grep -q 'calculateAnnualLeaveRange' APP/cloud/ky-erp-api/src/ik-relational-cloud.ts
          grep -q 'advanced/leave/preview' APP/cloud/ky-erp-api/src/ik-relational-cloud.ts
          grep -q 'Ise donus tarihi' APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx
          grep -q 'IK_LEAVE_FINAL_V2' APP/app/ky-erp-frontend/src/pages/modules/ik.advanced.css
          test -f APP/cloud/ky-erp-api/migrations/0009_hr_leave_engine.sql

      - name: Worker install and tests
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Frontend install lint and production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_BASE_URL: https://api.kyerp.net
          VITE_BUILD_LABEL: ik-leave-final-preflight
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit final IK leave implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx \
            APP/app/ky-erp-frontend/src/pages/modules/ik.advanced.css \
            APP/app/ky-erp-frontend/src/services/ikApi.js \
            APP/cloud/ky-erp-api/package.json \
            APP/cloud/ky-erp-api/package-lock.json \
            APP/cloud/ky-erp-api/tsconfig.json \
            APP/cloud/ky-erp-api/worker-configuration.d.ts \
            APP/cloud/ky-erp-api/src/ik-relational-cloud.ts \
            APP/cloud/ky-erp-api/src/ik-relational-cloud.test.ts \
            APP/cloud/ky-erp-api/migrations/0009_hr_leave_engine.sql
          git diff --cached --quiet && { echo 'No code changes to commit'; exit 0; }
          git commit -m 'fix: finalize annual leave engine and clean IK leave UI'
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

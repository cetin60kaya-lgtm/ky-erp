name: Fix İşNet CI and Verify

on:
  push:
    branches:
      - tasarim-final-v1
    paths:
      - ".github/workflows/fix-isnet-ci-and-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./ci-isnet.db
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tasarim-final-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply safe TypeScript fixes
        shell: pwsh
        run: |
          $dispatchPath = "APP/app/ky-erp-backend/src/muhasebe/isnet-dispatch-flow-coordinator.service.ts"
          $dispatch = Get-Content $dispatchPath -Raw
          foreach ($sourceId in @("TEST_NUMUNESI", "BASKI_SAKATI", "KUMAS_SAKATI")) {
            $needle = "          sourceLineId: `"$sourceId`","
            $start = $dispatch.IndexOf($needle)
            if ($start -lt 0) { throw "Kalem bulunamadı: $sourceId" }
            $end = $dispatch.IndexOf("        },", $start)
            if ($end -lt 0) { throw "Kalem sonu bulunamadı: $sourceId" }
            $block = $dispatch.Substring($start, $end - $start)
            if (-not $block.Contains("sourceQuantity:")) {
              $block = $block.Replace("          unitPrice: 0,", "          unitPrice: 0,`r`n          sourceQuantity: 0,`r`n          lockedDescription: true,")
              $dispatch = $dispatch.Substring(0, $start) + $block + $dispatch.Substring($end)
            }
          }
          Set-Content -Path $dispatchPath -Value $dispatch -Encoding utf8

          $matchPath = "APP/app/ky-erp-backend/src/muhasebe/muhasebe-smart-match.service.ts"
          $match = Get-Content $matchPath -Raw
          $match = $match.Replace(
            'const productMap = new Map(products.map((row: any) => [row.id, row]));',
            'const productMap = new Map<string, any>(products.map((row: any) => [String(row.id), row]));'
          )
          $match = $match.Replace(
            'const documentMap = new Map(`r`n      supplierDocuments.map((row: any) => [row.id, row]),`r`n    );',
            'const documentMap = new Map<string, any>(`r`n      supplierDocuments.map((row: any) => [String(row.id), row]),`r`n    );'
          )
          $match = $match.Replace('documentMap.get(item.documentId)', 'documentMap.get(String(item.documentId))')
          $match = $match.Replace('productMap.get(item.productId)', 'productMap.get(String(item.productId))')
          Set-Content -Path $matchPath -Value $match -Encoding utf8

          if (-not (Select-String -Path $dispatchPath -Pattern 'sourceQuantity: 0' -Quiet)) { throw "Özel kalem tipi yaması uygulanmadı." }
          if (-not (Select-String -Path $matchPath -Pattern 'Map<string, any>' -Quiet)) { throw "Muhasebe map tipi yaması uygulanmadı." }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/app/ky-erp-backend/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Backend install
        working-directory: APP/app/ky-erp-backend
        run: npm ci

      - name: Prisma generate
        working-directory: APP/app/ky-erp-backend
        run: npm run db:generate

      - name: Backend build
        working-directory: APP/app/ky-erp-backend
        run: npm run build

      - name: İşNet tests
        working-directory: APP/app/ky-erp-backend
        run: npm run test:isnet

      - name: Extended preparation tests
        working-directory: APP/app/ky-erp-backend
        run: npx jest --runInBand src/muhasebe/isnet-dispatch-preparation.service.spec.ts src/muhasebe/isnet-invoice-preparation.service.spec.ts src/muhasebe/muhasebe-smart-match.service.spec.ts

      - name: Frontend install
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Frontend build
        working-directory: APP/app/ky-erp-frontend
        run: npm run build

      - name: Commit verified fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/fix-isnet-ci-and-verify.yml"
          git add "APP/app/ky-erp-backend/src/muhasebe/isnet-dispatch-flow-coordinator.service.ts"
          git add "APP/app/ky-erp-backend/src/muhasebe/muhasebe-smart-match.service.ts"
          if (git diff --cached --quiet) { throw "Commit edilecek doğrulanmış düzeltme oluşmadı." }
          git commit -m "İşNet ve muhasebe backend tip hatalarını düzelt"
          git push origin HEAD:tasarim-final-v1

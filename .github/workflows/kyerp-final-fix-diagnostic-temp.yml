name: KYERP Final Fix Diagnostic TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
      - name: Verify daily operations source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const DailyHrWorkspace' APP/app/ky-erp-frontend/src/AppV3.jsx
          grep -q 'activeModule?.key === "gunluk-operasyon"' APP/app/ky-erp-frontend/src/AppV3.jsx
          grep -q '"gunluk-operasyon": () => import("./pages/modules/ik/DailyHrWorkspace")' APP/app/ky-erp-frontend/src/AppV3.jsx
          echo 'SOURCE_DAILY_ROUTE=OK'
      - name: Inspect live domains and bundles
        shell: bash
        run: |
          set -euo pipefail
          for host in kyerp.net app.kyerp.net; do
            echo "=== $host HEADERS ==="
            curl -sSI "https://$host/gunluk-operasyon/daily-entry" | sed -n '1,30p'
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "https://$host/gunluk-operasyon/daily-entry?diag=${GITHUB_SHA}")"
            asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -n1)"
            echo "HOST=$host ASSET=$asset"
            test -n "$asset"
            curl -fsSL -H 'Cache-Control: no-cache' "https://$host${asset}?diag=${GITHUB_SHA}" -o "/tmp/${host}.js"
            echo "SIZE=$(wc -c < /tmp/${host}.js)"
            if grep -q 'daily-hr-workspace-v1' "/tmp/${host}.js"; then
              echo 'LIVE_DAILY_ROUTE_MARKER=YES'
            else
              echo 'LIVE_DAILY_ROUTE_MARKER=NO'
            fi
            if grep -q 'Ekran bulunamadı' "/tmp/${host}.js"; then
              echo 'LIVE_FALLBACK_MARKER=YES'
            fi
          done

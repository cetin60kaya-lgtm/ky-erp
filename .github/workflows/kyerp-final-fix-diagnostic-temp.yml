name: KYERP Final Fix Diagnostic TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - name: Verify source and build chunk
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          grep -q 'const DailyHrWorkspace' src/AppV3.jsx
          grep -q 'activeModule?.key === "gunluk-operasyon"' src/AppV3.jsx
          npm ci >/dev/null
          npm run build >/dev/null
          marker_file="$(grep -R -l --include='*.js' 'daily-hr-workspace-v1' dist/assets | head -n1)"
          test -n "$marker_file"
          echo "LOCAL_MARKER_FILE=$marker_file"
          echo "LOCAL_MARKER_SHA256=$(sha256sum "$marker_file" | awk '{print $1}')"
          basename "$marker_file" > /tmp/daily-marker-file.txt
      - name: Compare live production chunk
        shell: bash
        run: |
          set -euo pipefail
          file="$(cat /tmp/daily-marker-file.txt)"
          echo "CHECK_FILE=$file"
          echo '=== LIVE HTML HEADERS ==='
          curl -sSI 'https://kyerp.net/gunluk-operasyon/daily-entry' | sed -n '1,30p'
          code="$(curl -sS -o /tmp/live-marker.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://kyerp.net/assets/$file?diag=${GITHUB_SHA}")"
          echo "LIVE_MARKER_HTTP=$code"
          if [ "$code" = "200" ]; then
            echo "LIVE_MARKER_SHA256=$(sha256sum /tmp/live-marker.js | awk '{print $1}')"
            if grep -q 'daily-hr-workspace-v1' /tmp/live-marker.js; then echo 'LIVE_MARKER=YES'; else echo 'LIVE_MARKER=NO'; fi
          fi
          html="$(curl -fsSL -H 'Cache-Control: no-cache' "https://kyerp.net/gunluk-operasyon/daily-entry?diag=${GITHUB_SHA}")"
          entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -n1)"
          echo "LIVE_ENTRY=$entry"

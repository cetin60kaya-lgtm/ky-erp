name: KYERP Final Fix Diagnostic TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
      - name: Inspect daily view mappings
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DailyHrWorkspace ==='
          grep -n -E 'VIEWS|IkPage activeTab|daily-entry|daily-cards|daily-weekly|daily-payments' src/pages/modules/ik/DailyHrWorkspace.jsx || true
          echo '=== IkPage mappings ==='
          grep -n -E 'daily-entry|daily-cards|daily-weekly|daily-payments|gunluk-personel|gunluk-personel-kartlari|gunluk-odeme-fisleri|ik-raporlari' src/pages/modules/IkPage.jsx | head -n 120 || true
          echo '=== IkPage fallback/render tail ==='
          grep -n -E 'Ekran bulunamadı|activeTab ===|normalizedTab|viewKey|tabKey' src/pages/modules/IkPage.jsx | tail -n 120 || true

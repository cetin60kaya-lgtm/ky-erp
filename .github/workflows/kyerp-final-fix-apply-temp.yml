name: KYERP Final Fix Apply TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/kyerp-final-fix-apply-temp.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final fixes
        run: |
          python3 .github/scripts/kyerp_final_fix.py
          python3 .github/scripts/kyerp_final_fix_contract.py

      - name: Diff check
        run: git diff --check

      - name: Backend gates
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Frontend gates
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit canonical fixes
        run: |
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/main.ts APP/cloud/ky-erp-api/src/accounting-workspace-core.ts APP/cloud/ky-erp-api/src/accounting-finance-core.ts APP/cloud/ky-erp-api/src/accounting-operations.ts APP/cloud/ky-erp-api/src/ik-pdks-modern.ts APP/cloud/ky-erp-api/src/desen-storage.ts APP/app/ky-erp-frontend/src/services/pdksApi.js APP/app/ky-erp-frontend/src/services/ik/personnelApi.js
          git commit -m "fix: close accounting hr design and gmail production errors"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

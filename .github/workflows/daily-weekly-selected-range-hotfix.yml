name: Daily Weekly Selected Range Hotfix

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-weekly-selected-range-hotfix.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      FRONTEND_DIR: APP/app/ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Apply selected range print hotfix
        run: python .github/scripts/daily_weekly_selected_range_hotfix.py

      - name: Selected range guardrails
        shell: bash
        run: |
          set -euo pipefail
          file="APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx"
          grep -q 'const rangeBoundDays = Array.isArray(days)' "$file"
          grep -q 'const printEnd = range?.end' "$file"
          if grep -A8 'function printWeeklyControlList' "$file" | grep -q 'Array.from({ length: 7 }'; then
            echo "Selected range is still being forced to seven days" >&2
            exit 1
          fi

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit selected range print fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          if ! git diff --cached --quiet; then
            git commit -m "fix(daily): keep weekly print inside selected range"
            git push origin HEAD:"$PROD_BRANCH"
          fi

      - name: Deploy frontend Pages production
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name ky-erp-frontend
          --branch codex/model-uretim-kontrol-merkezi-final

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://kyerp.net/gunluk-operasyon/daily-payments >/tmp/kyerp_daily_payments.html
          test -s /tmp/kyerp_daily_payments.html

name: KY ERP Boyahane Temiz Renk Katalogu Aktarimi

on:
  # KY ERP production/PR otomasyonu Cloudflare Git Integration uzerindedir.
  # GitHub Actions yalniz acik manuel tanilama/test isteginde calistirilir.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kyerp-boyahane-color-catalog-import
  cancel-in-progress: false

jobs:
  import-colors:
    name: D1 yedek ve 908 temiz Pantone renk karti aktarimi
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Aktarim kaydini dogrula
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .approved == true and
            .target == "production-d1" and
            .scope == "BOYAHANE_REGISTERED_COLOR" and
            .cleanRows == 908 and
            .uniquePantones == 893 and
            .companySlug == "mecit-hakan"
          ' RELEASES/boyahane-clean-color-catalog-import.json >/dev/null

      - name: Cloudflare hesabini ve D1 veritabanini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN eksik." >&2; exit 1; }
          database_id="b504b712-6927-499d-815d-0b954c8ee246"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts_json="$(curl --fail --silent --show-error -H "$auth_header" https://api.cloudflare.com/client/v4/accounts)"
          mapfile -t account_ids < <(jq -r '.result[]?.id' <<<"$accounts_json")
          test "${#account_ids[@]}" -gt 0
          resolved_account_id=""
          for account_id in "${account_ids[@]}"; do
            databases_json="$(curl --fail --silent --show-error -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg database_id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $database_id))' <<<"$databases_json" >/dev/null; then
              resolved_account_id="$account_id"
              break
            fi
          done
          test -n "$resolved_account_id" || { echo "ky-erp-db bulunamadi." >&2; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$resolved_account_id" >> "$GITHUB_ENV"

      - name: Worker araclarini kur
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Canli D1 tam yedegini al
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-before-color-catalog-${stamp}.sql"
          success=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$output"
            if npx wrangler d1 export ky-erp-db --remote --config wrangler.jsonc --skip-confirmation --output "$output"; then
              success=1
              break
            fi
            sleep $((attempt * 20))
          done
          test "$success" -eq 1 || { echo "D1 yedegi alinamadi; aktarim durduruldu." >&2; exit 1; }

      - name: D1 yedegini sakla
        uses: actions/upload-artifact@v4
        with:
          name: ky-erp-before-clean-color-catalog-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 30

      - name: Temiz katalog SQL dosyasini olustur ve dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-clean-color-catalog.mjs /tmp/kyerp-color-catalog.sql /tmp/kyerp-color-catalog-audit.json
          jq -e '.ok == true and .rows == 908 and .uniquePantones == 893 and .uniquePantonePaintTypeKeys == 908' /tmp/kyerp-color-catalog-audit.json >/dev/null
          test -s /tmp/kyerp-color-catalog.sql
          wc -c /tmp/kyerp-color-catalog.sql
          cat /tmp/kyerp-color-catalog-audit.json

      - name: 908 temiz renk kartini canli D1e aktar
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --file /tmp/kyerp-color-catalog.sql

      - name: Canli D1 renk katalogunu dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          source_name="RENK_KAYIT_XLSM_CLEAN_2026_08_25"
          slug="mecit-hakan"
          scope="BOYAHANE_REGISTERED_COLOR"

          scalar() {
            local query="$1"
            npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --json --command "$query" \
              | jq -er '.[0].results[0].value | tonumber'
          }

          imported="$(scalar "SELECT COUNT(*) AS value FROM json_store WHERE scope='${scope}' AND main_company_slug='${slug}' AND json_valid(data)=1 AND json_extract(data,'$.source')='${source_name}';")"
          unique_pantones="$(scalar "SELECT COUNT(DISTINCT json_extract(data,'$.pantone')) AS value FROM json_store WHERE scope='${scope}' AND main_company_slug='${slug}' AND json_valid(data)=1 AND json_extract(data,'$.source')='${source_name}';")"
          invalid="$(scalar "SELECT COUNT(*) AS value FROM json_store WHERE scope='${scope}' AND main_company_slug='${slug}' AND json_valid(data)=1 AND json_extract(data,'$.source')='${source_name}' AND (COALESCE(json_extract(data,'$.pantone'),'')='' OR COALESCE(json_extract(data,'$.colorHex'),'') NOT GLOB '#[0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f]' OR COALESCE(json_extract(data,'$.paintType'),'')='' OR COALESCE(json_extract(data,'$.colorName'),'')='' OR COALESCE(json_extract(data,'$.status'),'')!='ACTIVE');")"
          name_conflicts="$(scalar "SELECT COUNT(*) AS value FROM (SELECT json_extract(data,'$.pantone') AS pantone FROM json_store WHERE scope='${scope}' AND main_company_slug='${slug}' AND json_valid(data)=1 AND json_extract(data,'$.source')='${source_name}' GROUP BY json_extract(data,'$.pantone') HAVING COUNT(DISTINCT json_extract(data,'$.colorName')) > 1);")"

          echo "Imported: $imported"
          echo "Unique Pantones: $unique_pantones"
          echo "Invalid: $invalid"
          echo "Name conflicts: $name_conflicts"
          test "$imported" -eq 908
          test "$unique_pantones" -eq 893
          test "$invalid" -eq 0
          test "$name_conflicts" -eq 0

          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT json_extract(data,'$.paintType') AS paint_type, COUNT(*) AS adet FROM json_store WHERE scope='${scope}' AND main_company_slug='${slug}' AND json_valid(data)=1 AND json_extract(data,'$.source')='${source_name}' GROUP BY json_extract(data,'$.paintType') ORDER BY adet DESC;"

      - name: Uygulama ve API sagligini koru
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.kyerp.net/api/health | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error https://kyerp.net/ >/dev/null
          curl --fail --silent --show-error https://app.kyerp.net/boyahane/kayitli-renkler >/dev/null

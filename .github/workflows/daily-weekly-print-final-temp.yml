name: Daily Weekly Print Final

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-weekly-print-final-temp.yml

permissions:
  contents: write

concurrency:
  group: daily-weekly-print-final
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Apply weekly print patch
        run: |
          set -euo pipefail
          python .github/scripts/daily_weekly_print_final.py
          git diff --check

      - name: Print contract guardrails
        run: |
          set -euo pipefail
          file='APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx'
          grep -q 'Array.from({ length: 7 }' "$file"
          grep -q 'Toplam Tutar' "$file"
          grep -q 'TOPLAM GÜN' "$file"
          grep -q 'day-on' "$file"
          grep -q 'night-on' "$file"
          grep -q 'print-color-adjust:exact' "$file"

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit weekly print implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m "fix(daily): finalize seven day weekly print layout"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy frontend Pages production
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 pages deploy dist \
            --project-name ky-erp-frontend \
            --branch codex/model-uretim-kontrol-merkezi-final \
            --commit-hash "${DEPLOY_SHA}"

      - name: Production smoke
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://kyerp.net/gunluk-operasyon/daily-payments >/tmp/ky-payments.html
          test -s /tmp/ky-payments.html
          echo 'Production smoke OK'

name: Üretim Merkezi Worker Tip Düzeltmesi

on:
  pull_request:
    paths:
      - ".github/workflows/production-center-typefix.yml"
      - "APP/cloud/ky-erp-api/src/production-center.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: production-center-typefix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Üretim dalını al
        uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0

      - name: Worker yazma ve tip akışlarını düzelt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("APP/cloud/ky-erp-api/src/production-center.ts")
          text = path.read_text(encoding="utf-8")

          old_type = '''  expectedQty: number;
            printRegions: Array<{ id?: string; regionName: string; regionCode?: string; sortOrder?: number }>;
            isVirtual: boolean;
            raw: Row;'''.replace("          ", "")
          new_type = '''  expectedQty: number;
            modelCode?: string;
            groundColor?: string;
            status?: string;
            imageUrl?: string;
            createdAt?: string;
            updatedAt?: string;
            printRegions: Array<{ id?: string; regionName: string; regionCode?: string; sortOrder?: number }>;
            isVirtual: boolean;
            raw: Row;'''.replace("          ", "")
          if old_type in text:
            text = text.replace(old_type, new_type, 1)
          elif new_type not in text:
            raise SystemExit("CenterModel tip bloğu bulunamadı.")

          old_signature = '''async function buildCenter(c: Context<AppEnv>) {
            const slug = companySlug(c);'''.replace("          ", "")
          new_signature = '''async function buildCenter(
            c: Context<AppEnv>,
            forcedSlug = companySlug(c),
          ) {
            const slug = forcedSlug;'''.replace("          ", "")
          if old_signature in text:
            text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
            raise SystemExit("buildCenter imzası bulunamadı.")

          save_start = text.index("async function saveProductionBatch")
          save_end = text.index("async function createModel", save_start)
          save_block = text[save_start:save_end]
          save_block = save_block.replace(
            "const center = await buildCenter(c);",
            "const center = await buildCenter(c, slug);",
            1,
          )
          text = text[:save_start] + save_block + text[save_end:]

          model_start = text.index("async function createModel")
          model_end = text.index("async function saveMachine", model_start)
          model_block = text[model_start:model_end]
          model_block = model_block.replace(
            "const center = await buildCenter(c);",
            "const center = await buildCenter(c, slug);",
            1,
          )
          model_block = model_block.replace(
            "const company = center.companies.find((row: Row) => row.id === companyId) || {};",
            "const company: Row = center.companies.find((row: Row) => row.id === companyId) || {};",
            1,
          )
          text = text[:model_start] + model_block + text[model_end:]

          text = text.replace(
            "result.duplicate ? 200 : 201",
            '"duplicate" in result && result.duplicate ? 200 : 201',
            1,
          )

          route_start = text.index('app.post("/api/imalat/kayitlar", async (c) => {')
          route_end = text.index('\n\n  app.get("/api/uretim/seri/summary"', route_start)
          route = r'''app.post("/api/imalat/kayitlar", async (c) => {
            const body = await requestBody(c);
            const mappedEntry = {
              ...body,
              modelId: first(body.modelId, body.modelKaydiId),
              quantity: first(body.quantity, body.adet, body.uretimAdedi),
              printRegion: first(body.printRegion, body.baskiBolgesi),
              machineId: first(body.machineId, body.makineNo, body.makina),
              machineName: first(
                body.machineName,
                body.makineAdi,
                body.makinaAdi,
                body.makineNo,
                body.makina,
              ),
              operatorName: first(
                body.operatorName,
                body.makinaci,
                body.sorumluPersonel,
              ),
              date: first(body.date, body.tarih),
              shift: first(body.shift, body.vardiya),
              dispatchNo: first(
                body.dispatchNo,
                body.irsaliyeNo,
                body.musteriIrsaliyeNo,
              ),
              orderNo: first(body.orderNo, body.siparisNo),
              batchNo: first(body.batchNo, body.partiNo),
              printDefectQty: first(
                body.printDefectQty,
                body.baskiHatasiAdet,
              ),
              fabricDefectQty: first(
                body.fabricDefectQty,
                body.kumasHatasiAdet,
              ),
              testQty: first(body.testQty, body.testAdedi),
            };
            const result = await saveProductionBatch(c, {
              ...body,
              entries: [mappedEntry],
              requestId: text(body.requestId) || crypto.randomUUID(),
            });
            return result.failedCount
              ? c.json(
                  jsonError(
                    "PRODUCTION_ENTRY_REJECTED",
                    text(result.failed[0]?.error),
                    result,
                  ),
                  409,
                )
              : c.json(
                  { ok: true, success: true, data: result.success[0] },
                  201,
                );
          });'''.replace("          ", "", 1)
          text = text[:route_start] + route + text[route_end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Worker paketleri
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Worker typecheck
        working-directory: APP/cloud/ky-erp-api
        run: npm run typecheck

      - name: Worker dry-run build
        working-directory: APP/cloud/ky-erp-api
        run: npm run build

      - name: Frontend paketleri
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Frontend lint
        working-directory: APP/app/ky-erp-frontend
        run: npm run lint

      - name: Frontend production build
        working-directory: APP/app/ky-erp-frontend
        run: npm run build

      - name: Veri güvenliği ve kaynak kontrolü
        run: |
          git diff --check
          ! git diff --name-only | grep -E '(^|/)(DATA|STORAGE)(/|$)|(^|/)\.env($|\.)|\.(db|sqlite|sqlite3)$'
          grep -q 'buildCenter(c, slug)' APP/cloud/ky-erp-api/src/production-center.ts
          grep -q 'const mappedEntry' APP/cloud/ky-erp-api/src/production-center.ts
          grep -q 'ProductionControlCenterPage' APP/app/ky-erp-frontend/src/pages/modules/UretimPage.jsx

      - name: Düzeltmeyi kaydet ve geçici akışları kaldır
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/production-center.ts
          git rm -f .github/workflows/production-center-finalize.yml .github/workflows/production-center-typefix.yml docs/trigger-production-center-finalize.txt
          git diff --cached --check
          git commit -m "fix(uretim): Worker tiplerini ve tek merkez yazma akışını tamamla"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

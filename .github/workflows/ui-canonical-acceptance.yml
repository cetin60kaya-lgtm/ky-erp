name: KY ERP Canonical UI Acceptance

on:
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
      - main
    paths:
      - 'APP/app/ky-erp-frontend/**'
      - 'APP/cloud/ky-erp-api/**'
      - '.github/workflows/ui-canonical-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint test build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build complete KY ERP PRO inside canonical security PWA scope
        run: KYERP_SECURITY_PRO_BUILD=1 npm run build
      - name: Verify bundled unified ERP entry and code splitting
        run: |
          test -f dist-security-pro/pro.html
          test -d dist-security-pro/assets
          grep -q '/guvenlik/pro/assets/' dist-security-pro/pro.html

  worker:
    name: Worker typecheck test build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Isolated personnel D1 migration and integrity smoke
        run: python3 scripts/employee-portal-sandbox-smoke.py
      - run: npm run build

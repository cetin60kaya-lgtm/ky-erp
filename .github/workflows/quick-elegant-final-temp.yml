name: KYERP Quick Elegant Final TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/quick-elegant-final-temp.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
  VITE_API_URL: https://api.kyerp.net

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - name: Apply elegant quick entry layout
        run: |
          set -euo pipefail
          python3 .github/scripts/quick_elegant_final_temp.py
          git diff --check
          grep -q 'quick-safety-chip' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          ! grep -q '<div className="quick-warning">' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'QUICK-ENTRY-ELEGANT-GRID-FINAL-2026-09-30' APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend validate
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit final source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          git commit -m "fix(daily): polish quick entry alignment and review control"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git -C ../../.. rev-parse HEAD)"
      - name: Production smoke
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' 'https://kyerp.net/gunluk-operasyon/daily-entry' || true)"
            if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
      - name: Remove deployment helpers
        if: success()
        run: |
          set -euo pipefail
          git pull --rebase origin codex/model-uretim-kontrol-merkezi-final
          rm -f .github/workflows/quick-elegant-final-temp.yml .github/scripts/quick_elegant_final_temp.py
          git add -A
          git commit -m "chore: remove quick elegant deployment helpers"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

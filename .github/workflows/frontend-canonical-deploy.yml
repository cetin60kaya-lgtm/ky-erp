name: KY ERP Frontend Canonical Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - '.github/deploy/frontend-trigger'

permissions:
  contents: read

concurrency:
  group: kyerp-frontend-canonical-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Frontend test build deploy verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      FRONTEND_DIR: APP/app/ky-erp-frontend
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Align Cloudflare Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          project="$(curl --fail --silent --show-error -H "$auth" "$base")"
          current="$(jq -r '.result.production_branch // empty' <<<"$project")"
          echo "Pages production branch: ${current:-<empty>}"
          if [ "$current" != "$PROD_BRANCH" ]; then
            updated="$(curl --fail --silent --show-error -X PATCH -H "$auth" -H 'Content-Type: application/json' --data "{"production_branch":"$PROD_BRANCH"}" "$base")"
            jq -e --arg b "$PROD_BRANCH" '.success == true and .result.production_branch == $b' <<<"$updated" >/dev/null
            echo "Pages production branch canonical branch'e alindi."
          fi

      - name: Deploy Cloudflare Pages production
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PROD_BRANCH"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.118.0 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$PROD_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "KY ERP frontend canonical $GITHUB_SHA"
      - name: Verify live canonical bundle
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          project="$(curl --fail --silent --show-error -H "$auth" "$base")"
          jq -e --arg b "$PROD_BRANCH" '.success == true and .result.production_branch == $b' <<<"$project" >/dev/null
          echo "Canonical deployment URL: $(jq -r '.result.canonical_deployment.url // empty' <<<"$project")"
          marker_file="$(grep -R -l --include='*.js' 'KY ERP Yönetim Merkezi' APP/app/ky-erp-frontend/dist/assets | head -1 || true)"
          test -n "$marker_file" || { echo "Platform Yönetimi marker chunk build içinde bulunamadı." >&2; exit 1; }
          marker_asset="/assets/$(basename "$marker_file")"
          marker_sha="$(sha256sum "$marker_file" | awk '{print $1}')"
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error -o /tmp/kyerp-live-admin.js -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://kyerp.net${marker_asset}?release=${GITHUB_SHA}-${attempt}" || true)"
            live_sha=""
            if [ "$code" = "200" ]; then
              live_sha="$(sha256sum /tmp/kyerp-live-admin.js | awk '{print $1}')"
              if [ "$live_sha" = "$marker_sha" ] && grep -q 'KY ERP Yönetim Merkezi' /tmp/kyerp-live-admin.js; then
                ready=1
                echo "Canlı Platform Yönetimi chunk doğrulandı: $marker_asset sha=$live_sha"
                break
              fi
            fi
            echo "Canlı chunk bekleniyor $attempt/30: $marker_asset http=$code live_sha=$live_sha"
            sleep 2
          done
          test "$ready" -eq 1
      - name: Verify real Chrome production mobile routes and auth boundary
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-browser-acceptance.mjs
      - name: Keep live Chrome smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyerp-live-browser-acceptance-${{ github.run_id }}
          path: APP/app/ky-erp-frontend/live-acceptance-evidence/
          if-no-files-found: warn
          retention-days: 3

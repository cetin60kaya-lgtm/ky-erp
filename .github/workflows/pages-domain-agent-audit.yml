name: KY ERP Production Pages Alan Adı Denetimi

on:
  push:
    branches:
      - agent/uretim-tek-merkez
    paths:
      - "RELEASES/pages-domain-agent-audit.json"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4

      - name: Production Pages bağlantısını denetle
        shell: bash
        run: |
          set -u
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          mkdir -p pages-audit

          curl --silent --show-error -H "$auth" "${api}/ky-erp-frontend" > pages-audit/project.json || echo '{"success":false,"result":{}}' > pages-audit/project.json
          curl --silent --show-error -H "$auth" "${api}/ky-erp-frontend/domains" > pages-audit/domains.json || echo '{"success":false,"result":[]}' > pages-audit/domains.json
          curl --silent --show-error -H "$auth" "${api}/ky-erp-frontend/deployments?env=production&per_page=10" > pages-audit/deployments.json || echo '{"success":false,"result":[]}' > pages-audit/deployments.json
          curl --silent --show-error -H "$auth" "${api}?per_page=100" > pages-audit/projects.json || echo '{"success":false,"result":[]}' > pages-audit/projects.json

          echo '[]' > pages-audit/owners.json
          jq -r '.result[]?.name // empty' pages-audit/projects.json | while IFS= read -r project; do
            safe="$(jq -rn --arg v "$project" '$v|@uri')"
            curl --silent --show-error -H "$auth" "${api}/${safe}/domains" > /tmp/domains.json || echo '{"success":false,"result":[]}' > /tmp/domains.json
            jq --arg project "$project" '[.result[]? | {project:$project,name,status}]' /tmp/domains.json > /tmp/owner.json 2>/dev/null || echo '[]' > /tmp/owner.json
            jq -s '.[0] + .[1]' pages-audit/owners.json /tmp/owner.json > /tmp/owners-next.json
            mv /tmp/owners-next.json pages-audit/owners.json
          done

          latest_url="$(jq -r '.result[0].url // empty' pages-audit/deployments.json 2>/dev/null)"
          curl --location --silent --show-error https://kyerp.net/ > pages-audit/live.html || true
          if [ -n "$latest_url" ]; then
            curl --location --silent --show-error "$latest_url/" > pages-audit/latest.html || true
          else
            : > pages-audit/latest.html
          fi

          zone="$(curl --silent --show-error -H "$auth" 'https://api.cloudflare.com/client/v4/zones?name=kyerp.net' || echo '{"success":false,"result":[]}')"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone" 2>/dev/null)"
          if [ -n "$zone_id" ]; then
            dns="$(curl --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=kyerp.net" || echo '{"success":false,"result":[]}')"
          else
            dns='{"success":false,"result":[]}'
          fi

          live_title="$(grep -oE '<title>[^<]*</title>' pages-audit/live.html | head -1 | sed 's/<[^>]*>//g' || true)"
          latest_title="$(grep -oE '<title>[^<]*</title>' pages-audit/latest.html | head -1 | sed 's/<[^>]*>//g' || true)"
          live_script="$(grep -oE '<script[^>]+src="[^"]+"' pages-audit/live.html | head -1 | sed -n 's/.*src="\([^"]*\)"/\1/p' || true)"
          latest_script="$(grep -oE '<script[^>]+src="[^"]+"' pages-audit/latest.html | head -1 | sed -n 's/.*src="\([^"]*\)"/\1/p' || true)"

          jq -n \
            --arg productionBranch "$(jq -r '.result.production_branch // empty' pages-audit/project.json 2>/dev/null)" \
            --arg latestId "$(jq -r '.result[0].id // empty' pages-audit/deployments.json 2>/dev/null)" \
            --arg latestUrl "$latest_url" \
            --arg latestBranch "$(jq -r '.result[0].deployment_trigger.metadata.branch // empty' pages-audit/deployments.json 2>/dev/null)" \
            --arg latestEnvironment "$(jq -r '.result[0].environment // empty' pages-audit/deployments.json 2>/dev/null)" \
            --argjson aliases "$(jq -c '.result[0].aliases // []' pages-audit/deployments.json 2>/dev/null || echo '[]')" \
            --argjson domains "$(jq -c '[.result[]? | {name,status}]' pages-audit/domains.json 2>/dev/null || echo '[]')" \
            --argjson owners "$(jq -c '[.[] | select(.name == "kyerp.net")]' pages-audit/owners.json 2>/dev/null || echo '[]')" \
            --arg liveTitle "$live_title" --arg latestTitle "$latest_title" \
            --arg liveScript "$live_script" --arg latestScript "$latest_script" \
            --argjson dns "$(jq -c '[.result[]? | {id,type,name,content,proxied}]' <<<"$dns" 2>/dev/null || echo '[]')" \
            '{productionBranch,latest:{id:$latestId,url:$latestUrl,branch:$latestBranch,environment:$latestEnvironment,aliases:$aliases},targetDomains:$domains,kyerpDomainOwners:$owners,html:{liveTitle:$liveTitle,latestTitle:$latestTitle,liveScript:$liveScript,latestScript:$latestScript},dns:$dns}' > pages-audit/summary.json
          cat pages-audit/summary.json

      - name: Sonucu PR kaydına yaz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          compact="$(jq -c . pages-audit/summary.json)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/17/comments" -f body="## KY ERP production Pages alan adı denetimi\n\n- Commit: ${GITHUB_SHA}\n- Run: ${GITHUB_RUN_ID}\n\n\`\`\`json\n${compact}\n\`\`\`"

      - name: Denetim çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: pages-production-domain-audit-${{ github.run_id }}
          path: pages-audit
          if-no-files-found: error
          retention-days: 7

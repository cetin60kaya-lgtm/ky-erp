name: Worker Tip Düzeltme

on:
  push:
    branches:
      - codex/muhasebe-tam-yeniden-tasarim
    paths:
      - ".github/workflows/patch-worker-types.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Dalı al
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-tam-yeniden-tasarim

      - name: Worker tiplerini düzelt
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("APP/cloud/ky-erp-api/src/index.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "type DatabaseRow = Record<string, unknown>;": "type DatabaseRow = Record<string, any>;",
              "async function accountingDocumentDetail(c: Context<AppEnv>, id: string) {": "async function accountingDocumentDetail(\n  c: Context<AppEnv>,\n  id: string,\n): Promise<DatabaseRow | null> {",
              "  const upcomingCheques = cheques\n": "  const upcomingCheques: DatabaseRow[] = cheques\n",
              "    const state = trackingMap.get(databaseText(company.id)) || {};": "    const state: DatabaseRow =\n      trackingMap.get(databaseText(company.id)) || {};",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Beklenen metin bulunamadı: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Değişikliği kaydet
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/index.ts
          git diff --cached --check
          git commit -m "fix(worker): muhasebe tip hatalarını gider"
          git push origin HEAD:codex/muhasebe-tam-yeniden-tasarim

name: KY ERP Desen AI Finalize

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/desen-ai-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire automatic OCR and fullscreen fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Cloudflare Workers AI binding.
          p = Path('APP/cloud/ky-erp-api/wrangler.jsonc')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['ai'] = {'binding': 'AI'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Real AI OCR/vision integration in Desen workflow.
          p = Path('APP/cloud/ky-erp-api/src/desen-workflow.ts')
          s = p.read_text(encoding='utf-8')
          ai_import = 'import { analyzeDesignWithAi, needsAiAnalysis } from "./desen-ai";\n'
          if ai_import not in s:
              s = s.replace('import type { Context, Hono } from "hono";\n', 'import type { Context, Hono } from "hono";\n' + ai_import, 1)

          helper_anchor = '\nasync function syncDyehouse(c: Context<AppEnv>, model: Row, slug: string) {'
          helper = '''\nasync function analyzeAndSave(c: Context<AppEnv>, model: Row, slug: string) {\n  const view = modelView(model);\n  const analysis = await analyzeDesignWithAi(c, view);\n  return saveModel(\n    c,\n    view.id,\n    {\n      ...view,\n      metadata: { ...view.metadata, analysis },\n    },\n    slug,\n  );\n}\n'''
          if 'async function analyzeAndSave(' not in s:
              if helper_anchor not in s:
                  raise SystemExit('analyze helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          # Inbox processing: model becomes searchable immediately after creation.
          old = '''  return saveModel(\n    c,\n    id,\n    {\n      ...body,\n      id,\n      modelName,\n      modelCode: text(body.modelCode || modelName),\n      status: text(body.status || "CHANNEL_REVIEW_PENDING"),\n      sourceType: text(body.sourceType || "FOLDER_SCAN"),\n      files,\n      createdAt: nowIso(),\n    },\n    slug,\n  );\n}\n\nfunction analysisFromModel'''
          new = '''  const saved = await saveModel(\n    c,\n    id,\n    {\n      ...body,\n      id,\n      modelName,\n      modelCode: text(body.modelCode || modelName),\n      status: text(body.status || "CHANNEL_REVIEW_PENDING"),\n      sourceType: text(body.sourceType || "FOLDER_SCAN"),\n      files,\n      createdAt: nowIso(),\n    },\n    slug,\n  );\n  return analyzeAndSave(c, saved, slug);\n}\n\nfunction analysisFromModel'''
          if old not in s:
              raise SystemExit('processInboxModel anchor not found')
          s = s.replace(old, new, 1)

          # Uploaded model image: analyze immediately after file save.
          old = '''    const saved = await saveModel(c, model.id, { ...model, files: [...model.files, row] }, slug);\n    return c.json({ ok: true, success: true, data: { file: row, model: saved } }, 201);'''
          new = '''    const saved = await saveModel(c, model.id, { ...model, files: [...model.files, row] }, slug);\n    const analyzed = await analyzeAndSave(c, saved, slug);\n    return c.json({ ok: true, success: true, data: { file: row, model: analyzed } }, 201);'''
          if old not in s:
              raise SystemExit('file upload analysis anchor not found')
          s = s.replace(old, new, 1)

          # Status now represents real AI OCR, not metadata-only scan.
          old = '''        analyzed: rows.filter((row) => row.metadata?.analysis?.analyzedAt).length,\n        pending: rows.filter((row) => !row.metadata?.analysis?.analyzedAt).length,\n        mode: "METADATA_INDEX",'''
          new = '''        analyzed: rows.filter((row) => !needsAiAnalysis(row) && row.metadata?.analysis?.visionStatus === "COMPLETED").length,\n        pending: rows.filter((row) => needsAiAnalysis(row)).length,\n        failed: rows.filter((row) => row.metadata?.analysis?.visionStatus === "FAILED").length,\n        mode: "CLOUDFLARE_AI_VISION_OCR",'''
          if old not in s:
              raise SystemExit('analysis status anchor not found')
          s = s.replace(old, new, 1)

          # Bulk re-index for legacy models, four at a time.
          old = '''    const targets = ids.length ? models.filter((row) => ids.includes(row.id)) : models;\n    for (const model of targets) {\n      await saveModel(c, model.id, {\n        ...model,\n        metadata: { ...model.metadata, analysis: analysisFromModel(model) },\n      }, slug);\n    }\n    return c.json({\n      ok: true,\n      success: true,\n      data: { analyzed: targets.length, errors: 0, mode: "METADATA_INDEX" },\n    });'''
          new = '''    const targets = ids.length ? models.filter((row) => ids.includes(row.id)) : models;\n    let analyzed = 0;\n    let errors = 0;\n    for (let index = 0; index < targets.length; index += 4) {\n      const batch = targets.slice(index, index + 4);\n      const results = await Promise.all(\n        batch.map(async (model) => {\n          try {\n            const saved = await analyzeAndSave(c, model, slug);\n            return saved.metadata?.analysis?.visionStatus === "COMPLETED";\n          } catch {\n            return false;\n          }\n        }),\n      );\n      analyzed += results.filter(Boolean).length;\n      errors += results.filter((value) => !value).length;\n    }\n    return c.json({\n      ok: true,\n      success: true,\n      data: { analyzed, errors, mode: "CLOUDFLARE_AI_VISION_OCR" },\n    });'''
          if old not in s:
              raise SystemExit('bulk analyze anchor not found')
          s = s.replace(old, new, 1)

          # Single model re-index.
          old = '''    const saved = await saveModel(c, model.id, {\n      ...model,\n      metadata: { ...model.metadata, analysis: analysisFromModel(model) },\n    }, slug);\n    return c.json({ ok: true, success: true, data: saved });'''
          new = '''    const saved = await analyzeAndSave(c, model, slug);\n    return c.json({ ok: true, success: true, data: saved });'''
          if old not in s:
              raise SystemExit('single analyze anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # UXP/OneDrive bridge: every newly ingested preview is OCR indexed automatically.
          p = Path('APP/cloud/ky-erp-api/src/desen-bridge.ts')
          s = p.read_text(encoding='utf-8')
          ai_import = 'import { analyzeDesignWithAi } from "./desen-ai";\n'
          if ai_import not in s:
              s = s.replace('import { getAuthenticatedUser } from "./auth-cloud";\n', 'import { getAuthenticatedUser } from "./auth-cloud";\n' + ai_import, 1)
          anchor = '    await Promise.all(dropped.map((row: Row) => deleteR2File(c, row)));\n'
          auto = '''    try {\n      const analysis = await analyzeDesignWithAi(c, saved);\n      await saveModel(c, slug, {\n        ...saved,\n        metadata: { ...objectOf(saved.metadata), analysis },\n      });\n    } catch (error) {\n      console.error("DESEN_AUTO_AI_FAILED", error);\n    }\n\n'''
          if 'DESEN_AUTO_AI_FAILED' not in s:
              if anchor not in s:
                  raise SystemExit('bridge auto analysis anchor not found')
              s = s.replace(anchor, auto + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # Fullscreen preview UX: Escape exits preview first; X is explicit in fullscreen.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''  const [rotation, setRotation] = useState(0);\n  const [fullscreen, setFullscreen] = useState(false);\n  if (!src)'''
          new = '''  const [rotation, setRotation] = useState(0);\n  const [fullscreen, setFullscreen] = useState(false);\n  useEffect(() => {\n    if (!fullscreen) return undefined;\n    const handleFullscreenKey = (event) => {\n      if (event.key !== "Escape") return;\n      event.preventDefault();\n      event.stopImmediatePropagation();\n      setFullscreen(false);\n    };\n    window.addEventListener("keydown", handleFullscreenKey, true);\n    return () => window.removeEventListener("keydown", handleFullscreenKey, true);\n  }, [fullscreen]);\n  if (!src)'''
          if old not in s:
              raise SystemExit('fullscreen hook anchor not found')
          s = s.replace(old, new, 1)
          old = '''        <button type="button" onClick={() => setFullscreen((value) => !value)}>\n          <Maximize2 size={16} />\n        </button>'''
          new = '''        <button\n          type="button"\n          onClick={() => setFullscreen((value) => !value)}\n          aria-label={fullscreen ? "Tam ekrandan çık" : "Tam ekran"}\n          title={fullscreen ? "Tam ekrandan çık (Esc)" : "Tam ekran"}\n        >\n          {fullscreen ? <X size={16} /> : <Maximize2 size={16} />}\n        </button>'''
          if old not in s:
              raise SystemExit('fullscreen button anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Load the fullscreen overrides last.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenPage.jsx')
          s = p.read_text(encoding='utf-8')
          css_import = 'import "./desenFullscreenFix.css";\n'
          if css_import not in s:
              s = s.replace('import "./desenCloud.css";\n', 'import "./desenCloud.css";\n' + css_import, 1)
          p.write_text(s, encoding='utf-8')

          # Search copy tells the user that semantic figure/description search is live.
          p = Path('APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('placeholder="Model, Pantone 13-0530, yazı veya tema ara"', 'placeholder="Model, Pantone, yazı, figür, karakter veya desen tarifi ara"')
          s = s.replace('desen OCR, Pantone ve tema için taranıyor…', 'desen OCR, Pantone, figür ve desen tarifi için taranıyor…')
          s = s.replace('Pantone, yazı ve tema araması hazır.', 'Pantone, yazı, figür, karakter ve desen tarifi araması hazır.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Worker typecheck and dry build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend lint and production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify design AI policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"binding": "AI"' APP/cloud/ky-erp-api/wrangler.jsonc
          grep -q 'CLOUDFLARE_AI_VISION_OCR' APP/cloud/ky-erp-api/src/desen-ai.ts
          grep -q 'descriptionLanguage: "tr"' APP/cloud/ky-erp-api/src/desen-ai.ts
          grep -q 'DESEN_AUTO_AI_FAILED' APP/cloud/ky-erp-api/src/desen-bridge.ts
          grep -q 'figür, karakter veya desen tarifi' APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx
          grep -q 'desenFullscreenFix.css' APP/app/ky-erp-frontend/src/pages/desen/DesenPage.jsx
          grep -q 'Tam ekrandan çık (Esc)' APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx

      - name: Commit completed design AI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add \
            APP/cloud/ky-erp-api/wrangler.jsonc \
            APP/cloud/ky-erp-api/src/desen-ai.ts \
            APP/cloud/ky-erp-api/src/desen-workflow.ts \
            APP/cloud/ky-erp-api/src/desen-bridge.ts \
            APP/app/ky-erp-frontend/src/pages/desen/DesenWorkflowShared.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/DesenPage.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx \
            APP/app/ky-erp-frontend/src/pages/desen/desenFullscreenFix.css
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "feat: automate design OCR and semantic search"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

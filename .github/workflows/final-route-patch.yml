name: Nihai İşNet İş Akışını Bağla

on:
  push:
    branches: [tasarim-final-v1]
    paths: [.github/workflows/final-route-patch.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: tasarim-final-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Nihai İşNet sayfasını rotaya bağla
        shell: pwsh
        run: |
          $appPath = 'APP/app/ky-erp-frontend/src/AppV3.jsx'
          $content = Get-Content $appPath -Raw
          $content = $content.Replace('const IsnetAutomationWorkflowPage = lazyWithRetry(', 'const IsnetWorkflowFinalPage = lazyWithRetry(')
          $content = $content.Replace('() => import("./pages/modules/isnet/IsnetAutomationWorkflowPage"),', '() => import("./pages/modules/isnet/IsnetWorkflowFinalPage"),')
          $content = $content.Replace('"isnet-automation-workflow-v1",', '"isnet-workflow-final-v1",')
          $content = $content.Replace('import("./pages/modules/isnet/IsnetAutomationWorkflowPage"),', 'import("./pages/modules/isnet/IsnetWorkflowFinalPage"),')
          $content = $content.Replace('<IsnetAutomationWorkflowPage {...sharedProps} />', '<IsnetWorkflowFinalPage {...sharedProps} />')
          Set-Content -Path $appPath -Value $content -Encoding utf8

          $auditPath = 'APP/app/ky-erp-frontend/scripts/audit-core-tabs.mjs'
          $audit = Get-Content $auditPath -Raw
          $audit = $audit.Replace('"is-akisi": "IsnetAutomationWorkflowPage"', '"is-akisi": "IsnetWorkflowFinalPage"')
          Set-Content -Path $auditPath -Value $audit -Encoding utf8

          if (-not $content.Contains('IsnetWorkflowFinalPage')) { throw 'Nihai İşNet sayfası AppV3 rotasına bağlanamadı.' }
          if ($content.Contains('<IsnetAutomationWorkflowPage')) { throw 'Eski İşNet iş akışı render bağlantısı kaldı.' }

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Frontend bağımlılıklarını kur
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Frontend build
        working-directory: APP/app/ky-erp-frontend
        run: npm run build

      - name: Nihai ekran lint
        working-directory: APP/app/ky-erp-frontend
        run: npx eslint src/AppV3.jsx src/pages/modules/isnet/IsnetWorkflowFinalPage.jsx scripts/audit-core-tabs.mjs --max-warnings=0

      - name: Üç modül sekme denetimi
        working-directory: APP/app/ky-erp-frontend
        run: node scripts/audit-core-tabs.mjs

      - name: Doğrulanmış rota değişikliğini commit et
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm '.github/workflows/final-route-patch.yml'
          git add 'APP/app/ky-erp-frontend/src/AppV3.jsx'
          git add 'APP/app/ky-erp-frontend/scripts/audit-core-tabs.mjs'
          git commit -m "İşNet nihai iş akışını doğrulayarak rotaya bağla"
          git push origin HEAD:tasarim-final-v1

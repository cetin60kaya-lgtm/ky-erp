name: KY ERP Kök Alan Adı Yönlendirme Yayını

on:
  push:
    branches:
      - agent/uretim-tek-merkez
    paths:
      - "APP/cloud/ky-erp-root-redirect/**"
      - "RELEASES/root-domain-redirect.json"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cloudflare bilgilerini doğrula
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "ab49b099fee10183fa65951e5077d14a"

      - name: Kök yönlendirme Workerını dağıt
        working-directory: APP/cloud/ky-erp-root-redirect
        run: npx --yes wrangler@4.110.0 deploy --config wrangler.jsonc

      - name: Kök adres yönlendirmesini doğrula
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            headers="$(curl --silent --show-error --max-time 20 --dump-header - --output /dev/null https://kyerp.net/boyahane/is-akisi || true)"
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' <<<"$headers")"
            echo "Deneme ${attempt}: status=${status:-yok} location=${location:-yok}"
            if [ "$status" = "308" ] && [ "$location" = "https://app.kyerp.net/boyahane/is-akisi" ]; then
              printf '%s' "$status" > /tmp/root-status.txt
              printf '%s' "$location" > /tmp/root-location.txt
              exit 0
            fi
            sleep 5
          done
          echo "kyerp.net beklenen 308 yönlendirmesini vermedi." >&2
          exit 1

      - name: Sonucu repo dosyasına yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status_code="$(cat /tmp/root-status.txt 2>/dev/null || true)"
          location="$(cat /tmp/root-location.txt 2>/dev/null || true)"
          result="$(jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg result "$JOB_STATUS" \
            --arg statusCode "$status_code" \
            --arg location "$location" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{runId:$runId,commit:$commit,result:$result,statusCode:$statusCode,location:$location,checkedAt:$checkedAt}')"

          path='RELEASES/root-domain-redirect-result.json'
          content="$(printf '%s\n' "$result" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=agent/uretim-tek-merkez" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='status(domain): kyerp.net yönlendirme sonucunu kaydet' -f content="$content" -f branch='agent/uretim-tek-merkez')
          if [ -n "$existing_sha" ]; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}"

name: KY ERP Desen Live Readonly Audit

on:
  push:
    branches:
      - audit-desen-live-20261011
    paths:
      - '.github/workflows/desen-live-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: APP/cloud/ky-erp-api
        run: npm ci
      - name: Read-only Desen production aggregate audit
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          sql="
          SELECT 'model_records' metric, COUNT(*) value
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND COALESCE(TRIM(deleted_at),'')='';
          SELECT 'workflow_models' metric, COUNT(*) value
            FROM json_store
           WHERE scope='DESEN_WORKFLOW_MODEL'
             AND main_company_slug='mecit-hakan'
             AND json_valid(data)=1;
          SELECT 'inbox_rows' metric, COUNT(*) value
            FROM json_store
           WHERE scope='DESEN_INBOX_FILE'
             AND main_company_slug='mecit-hakan';
          SELECT 'filehub_active_connections' metric, COUNT(*) value
            FROM file_hub_connections
           WHERE main_company_slug='mecit-hakan' AND is_active=1;
          SELECT 'filehub_desen_bindings' metric, COUNT(*) value
            FROM file_hub_bindings
           WHERE main_company_slug='mecit-hakan' AND module_code='DESEN';
          SELECT 'filehub_assets' metric, COUNT(*) value
            FROM file_hub_assets
           WHERE main_company_slug='mecit-hakan';
          SELECT 'filehub_model_relations' metric, COUNT(*) value
            FROM file_hub_relations
           WHERE main_company_slug='mecit-hakan' AND entity_type='MODEL';
          SELECT provider_type, COUNT(*) value
            FROM file_hub_connections
           WHERE main_company_slug='mecit-hakan' AND is_active=1
           GROUP BY provider_type
           ORDER BY provider_type;
          SELECT purpose_code, COUNT(*) value
            FROM file_hub_bindings
           WHERE main_company_slug='mecit-hakan' AND module_code='DESEN'
           GROUP BY purpose_code
           ORDER BY purpose_code;
          SELECT MAX(last_sync_at) last_sync_at
            FROM file_hub_connections
           WHERE main_company_slug='mecit-hakan' AND is_active=1;
          SELECT provider_type, connection_status, sync_mode,
                 CASE WHEN TRIM(COALESCE(local_root_path,''))<>'' THEN 1 ELSE 0 END has_local_root,
                 CASE WHEN TRIM(COALESCE(remote_root_id,''))<>'' THEN 1 ELSE 0 END has_remote_root_id,
                 CASE WHEN TRIM(COALESCE(remote_root_name,''))<>'' THEN 1 ELSE 0 END has_remote_root_name,
                 last_sync_at
            FROM file_hub_connections
           WHERE main_company_slug='mecit-hakan' AND is_active=1
           ORDER BY is_primary DESC, updated_at DESC;
          SELECT status, COUNT(*) value, MAX(last_seen_at) last_seen_at
            FROM file_hub_agent_status
           WHERE main_company_slug='mecit-hakan'
           GROUP BY status
           ORDER BY status;
          SELECT purpose_code,
                 CASE WHEN TRIM(COALESCE(root_path,''))<>'' THEN root_path ELSE '<root>' END root_path,
                 read_enabled, write_enabled, sync_enabled, is_default
            FROM file_hub_bindings
           WHERE main_company_slug='mecit-hakan' AND module_code='DESEN'
           ORDER BY purpose_code;
          SELECT provider_type, COUNT(*) value,
                 SUM(CASE WHEN TRIM(COALESCE(refresh_token_cipher,''))<>'' THEN 1 ELSE 0 END) refresh_ready
            FROM file_hub_oauth_accounts
           WHERE main_company_slug='mecit-hakan'
           GROUP BY provider_type
           ORDER BY provider_type;
          SELECT COUNT(*) value
            FROM file_hub_cloud_connection_accounts
           WHERE main_company_slug='mecit-hakan';
          SELECT customer_id, customer_name, COUNT(*) value
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND UPPER(COALESCE(customer_name,'')) LIKE 'TAHA%'
             AND COALESCE(TRIM(deleted_at),'')=''
           GROUP BY customer_id, customer_name
           ORDER BY value DESC;
          SELECT 'model_status' metric, COALESCE(NULLIF(TRIM(status),''),'EMPTY') code, COUNT(*) value
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND COALESCE(TRIM(deleted_at),'')=''
           GROUP BY COALESCE(NULLIF(TRIM(status),''),'EMPTY')
           ORDER BY value DESC;
          SELECT 'workflow_status' metric, COALESCE(NULLIF(json_extract(data,'$.status'),''),'EMPTY') code, COUNT(*) value
            FROM json_store
           WHERE scope='DESEN_WORKFLOW_MODEL'
             AND main_company_slug='mecit-hakan'
             AND json_valid(data)=1
           GROUP BY COALESCE(NULLIF(json_extract(data,'$.status'),''),'EMPTY')
           ORDER BY value DESC;
          SELECT 'workflow_missing_main_image' metric, COUNT(*) value
            FROM json_store
           WHERE scope='DESEN_WORKFLOW_MODEL'
             AND main_company_slug='mecit-hakan'
             AND json_valid(data)=1
             AND COALESCE(NULLIF(json_extract(data,'$.mainImage.storageKey'),''),NULLIF(json_extract(data,'$.mainImage.previewUrl'),''),NULLIF(json_extract(data,'$.imageUrl'),''),'')='';
          SELECT 'workflow_operation_count' metric, COUNT(*) value
            FROM json_store j, json_each(CASE WHEN json_valid(j.data)=1 THEN COALESCE(json_extract(j.data,'$.operations'),'[]') ELSE '[]' END)
           WHERE j.scope='DESEN_WORKFLOW_MODEL'
             AND j.main_company_slug='mecit-hakan';
          SELECT 'placement_status' metric,
                 COALESCE(NULLIF(json_extract(op.value,'$.placementStatus'),''),'EMPTY') code,
                 COUNT(*) value
            FROM json_store j, json_each(CASE WHEN json_valid(j.data)=1 THEN COALESCE(json_extract(j.data,'$.operations'),'[]') ELSE '[]' END) op
           WHERE j.scope='DESEN_WORKFLOW_MODEL'
             AND j.main_company_slug='mecit-hakan'
           GROUP BY COALESCE(NULLIF(json_extract(op.value,'$.placementStatus'),''),'EMPTY')
           ORDER BY value DESC;
          SELECT 'dyehouse_status' metric,
                 COALESCE(NULLIF(json_extract(op.value,'$.dyehouseStatus'),''),'EMPTY') code,
                 COUNT(*) value
            FROM json_store j, json_each(CASE WHEN json_valid(j.data)=1 THEN COALESCE(json_extract(j.data,'$.operations'),'[]') ELSE '[]' END) op
           WHERE j.scope='DESEN_WORKFLOW_MODEL'
             AND j.main_company_slug='mecit-hakan'
           GROUP BY COALESCE(NULLIF(json_extract(op.value,'$.dyehouseStatus'),''),'EMPTY')
           ORDER BY value DESC;
          SELECT 'inbox_status' metric, COALESCE(NULLIF(json_extract(data,'$.status'),''),'EMPTY') code, COUNT(*) value
            FROM json_store
           WHERE scope='DESEN_INBOX_FILE'
             AND main_company_slug='mecit-hakan'
             AND json_valid(data)=1
           GROUP BY COALESCE(NULLIF(json_extract(data,'$.status'),''),'EMPTY')
           ORDER BY value DESC;
          SELECT 'filehub_asset_extension' metric, COALESCE(NULLIF(extension,''),'NONE') code, COUNT(*) value
            FROM file_hub_assets
           WHERE main_company_slug='mecit-hakan'
           GROUP BY COALESCE(NULLIF(extension,''),'NONE')
           ORDER BY value DESC
           LIMIT 20;
          SELECT 'recent_model' metric, model_name, customer_name, status, created_at, updated_at
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND COALESCE(TRIM(deleted_at),'')=''
           ORDER BY COALESCE(updated_at,created_at) DESC
           LIMIT 12;
          SELECT 'all_model_name' metric, model_name
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND COALESCE(TRIM(deleted_at),'')=''
           ORDER BY model_name;
          "
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$sql" --json > /tmp/desen-audit.json
          node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("/tmp/desen-audit.json","utf8"));
            for(const block of data){
              for(const row of block.results||[]) console.log(JSON.stringify(row));
            }
          '

name: KY ERP Gunluk Giris Canli Tani

on:
  push:
    branches:
      - diagnostic/daily-entry-live-20260924
    paths:
      - .github/workflows/daily-entry-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Canli Worker tail ve D1 salt-okunur kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      DB_NAME: ky-erp-db
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Wrangler hazirla ve Cloudflare erisimini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx wrangler whoami

      - name: 24 Eylul kayitlari - once
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ATTENDANCE BEFORE ==='
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT e.full_name,a.employee_id,a.work_date,a.day_shift,a.night_shift,a.updated_at FROM hr_daily_attendance a JOIN hr_daily_employees e ON e.id=a.employee_id WHERE e.main_company_id='mecit-hakan' AND a.work_date='2026-09-24' ORDER BY e.full_name;"
          echo '=== AUDIT BEFORE ==='
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT action,employee_id,work_date,source,request_id,created_at FROM hr_daily_operation_audit WHERE main_company_id='mecit-hakan' AND work_date='2026-09-24' ORDER BY created_at DESC LIMIT 40;"

      - name: Canli Worker isteklerini 4 dakika dinle
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -u
          echo '=== LIVE TAIL START ==='
          timeout 240s npx wrangler tail ky-erp-api --config wrangler.jsonc --format pretty > /tmp/kyerp-daily-tail.log 2>&1
          rc=$?
          cat /tmp/kyerp-daily-tail.log
          echo "TAIL_RC=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi

      - name: 24 Eylul kayitlari - sonra
        if: always()
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ATTENDANCE AFTER ==='
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT e.full_name,a.employee_id,a.work_date,a.day_shift,a.night_shift,a.updated_at FROM hr_daily_attendance a JOIN hr_daily_employees e ON e.id=a.employee_id WHERE e.main_company_id='mecit-hakan' AND a.work_date='2026-09-24' ORDER BY e.full_name;"
          echo '=== REVISIONS AFTER ==='
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT employee_id,revision,day_shift,night_shift,change_type,source,request_id,created_at FROM hr_daily_attendance_revision WHERE main_company_id='mecit-hakan' AND work_date='2026-09-24' ORDER BY created_at DESC,revision DESC LIMIT 60;"
          echo '=== AUDIT AFTER ==='
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT action,employee_id,work_date,source,request_id,created_at FROM hr_daily_operation_audit WHERE main_company_id='mecit-hakan' AND work_date='2026-09-24' ORDER BY created_at DESC LIMIT 60;"

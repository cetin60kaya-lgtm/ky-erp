name: TEMP Daily Operation Validation

on:
  push:
    branches:
      - fix/daily-operation-canonical-20260924

permissions:
  contents: read

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run

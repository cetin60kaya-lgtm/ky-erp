name: PDKS Final Verify

on:
  # Cloudflare Git Integration is the production path. Manual diagnostic only.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: pdks-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API test / typecheck / dry build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json
      - name: API bağımlılıkları
        run: npm ci
      - name: API testleri
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Worker dry-run build
        run: npm run build

  frontend:
    name: Frontend test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - name: Frontend bağımlılıkları
        run: npm ci
      - name: Frontend testleri
        run: npm test
      - name: Frontend production build
        run: npm run build

name: Desen R2 Tip Düzeltme Tek Sefer

on:
  pull_request:
    paths:
      - ".github/workflows/fix-desen-r2-types-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
      - name: R2 liste ve taşıma tiplerini açıklaştır
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('APP/cloud/ky-erp-api/src/desen-workflow.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  const listed = await c.env.FILES.list({ prefix, limit: 1000 });',
              '  const bucket = c.env.FILES as any;\n  const listed = await bucket.list({ prefix, limit: 1000 });'
          )
          old = '''  const source = await c.env.FILES.get(sourceKey);
  if (!source) return false;
  await c.env.FILES.put(targetKey, source.body, {
    httpMetadata: source.httpMetadata,
    customMetadata: source.customMetadata,
  });
  await c.env.FILES.delete(sourceKey);'''
          new = '''  const bucket = c.env.FILES as any;
  const source = await bucket.get(sourceKey);
  if (!source) return false;
  await bucket.put(targetKey, source.body, {
    httpMetadata: source.httpMetadata,
    customMetadata: source.customMetadata,
  });
  await bucket.delete(sourceKey);'''
          if old not in text:
              raise SystemExit('R2 taşıma bloğu bulunamadı.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-desen-r2-types-once.yml').unlink()
          PY
      - name: Düzeltmeyi kaydet ve geçici akışı kaldır
        run: |
          git config user.name "kyerp-ci"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/desen-workflow.ts .github/workflows/fix-desen-r2-types-once.yml
          git commit -m "fix(desen): R2 liste ve taşıma tiplerini açıklaştır"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

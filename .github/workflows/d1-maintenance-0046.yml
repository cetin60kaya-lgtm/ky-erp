name: KY ERP D1 Bakim - 0046 Canonical Muhasebe

on:
  push:
    branches:
      - ops/0046-accounting-canonical-20260906

permissions:
  contents: read

concurrency:
  group: kyerp-d1-maintenance-0046
  cancel-in-progress: false

jobs:
  migrate:
    name: Backup, readiness, 0046, verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      DB_NAME: ky-erp-db
      WORKER_DIR: APP/cloud/ky-erp-api
      EXPECTED_BRANCH: ops/0046-accounting-canonical-20260906

    steps:
      - name: Kaynak ve bakım branchini doğrula
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bakım dalı güvenlik kapısı
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test -f "$WORKER_DIR/migrations/0046_accounting_canonical_report_controls.sql"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN eksik" >&2; exit 1; }

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Worker paketleri ve kod kapısı
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Cloudflare production erişimini doğrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Canlı D1 tam yedeğini al
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-before-0046-${stamp}.sql"
          npx wrangler d1 export "$DB_NAME" --remote --config wrangler.jsonc --skip-confirmation --output "$output"
          test -s "$output"
          echo "D1_BACKUP=$output" >> "$GITHUB_ENV"
          sha256sum "$output" | tee "${output}.sha256"

      - name: D1 yedeğini artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ky-erp-d1-before-0046-${{ github.run_id }}
          path: |
            APP/cloud/ky-erp-api/database-backup/*.sql
            APP/cloud/ky-erp-api/database-backup/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 0046 readiness ve partial-schema kontrolü
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail

          scalar() {
            local sql="$1"
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "$sql" --json               | jq -r '.[0].results[0].n // 0'
          }

          check_table() {
            local table="$1"
            local expected="$2"
            local names="$3"
            local exists required
            exists="$(scalar "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='$table';")"
            if [ "$exists" = "0" ]; then
              echo "$table yok; additive migration oluşturacak."
              return
            fi
            required="$(scalar "SELECT COUNT(*) AS n FROM pragma_table_info('$table') WHERE name IN ($names);")"
            if [ "$required" != "$expected" ]; then
              echo "GÜVENLİK DURDURMASI: $table partial/uyumsuz şema ($required/$expected gerekli kolon)." >&2
              exit 1
            fi
            echo "$table mevcut ve gerekli kolonlar tam."
          }

          check_table accounting_report_categories 9 "'id','main_company_slug','code','name','category_type','is_active','sort_order','created_at','updated_at'"
          check_table accounting_report_overrides 16 "'id','main_company_slug','source_type','source_id','report_included','report_category_id','report_amount','report_description','report_official_type','report_vat_amount','report_vat_included','report_expense_status','report_note','override_mask','created_at','updated_at'"
          check_table accounting_expense_rules 13 "'id','main_company_slug','company_id','product_id','normalized_description','category_id','category_name','routing_type','priority','is_active','source','created_at','updated_at'"

      - name: 0046 canonical Muhasebe rapor ve gider hafızası şemasını uygula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc             --file migrations/0046_accounting_canonical_report_controls.sql

      - name: 0046 şema ve indeks doğrulaması
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "
            SELECT name, type
            FROM sqlite_master
            WHERE name IN (
              'accounting_report_categories',
              'accounting_report_overrides',
              'accounting_expense_rules',
              'ix_accounting_report_categories_active',
              'ix_accounting_report_overrides_source',
              'ix_accounting_expense_rules_match'
            )
            ORDER BY type, name;
          " --json)"
          echo "$schema" | jq .
          count="$(jq -r '.[0].results | length' <<<"$schema")"
          test "$count" = "6" || { echo "GÜVENLİK DURDURMASI: 0046 nesnelerinin tamamı oluşmadı ($count/6)." >&2; exit 1; }

      - name: Canonical tablo okuma smoke
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM accounting_report_categories) AS report_categories,
              (SELECT COUNT(*) FROM accounting_report_overrides) AS report_overrides,
              (SELECT COUNT(*) FROM accounting_expense_rules) AS expense_rules;
          " --json | jq .
          echo "0046_CANLI_MIGRATION_OK"

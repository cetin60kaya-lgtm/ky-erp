name: KY ERP Frontend Dependency Security

on:
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "APP/app/ky-erp-frontend/package.json"
      - "APP/app/ky-erp-frontend/package-lock.json"
      - ".github/workflows/frontend-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Frontend npm audit high/critical
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Frontend paketleri
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: High ve critical dependency audit
        working-directory: APP/app/ky-erp-frontend
        run: npm audit --audit-level=high

      - name: Frontend lint
        working-directory: APP/app/ky-erp-frontend
        run: npm run lint

      - name: Frontend testleri
        working-directory: APP/app/ky-erp-frontend
        run: npm test

      - name: Frontend production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: npm run build

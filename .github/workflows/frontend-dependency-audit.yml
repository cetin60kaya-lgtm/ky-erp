name: KY ERP Frontend Dependency Security

on:
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "APP/app/ky-erp-frontend/package.json"
      - "APP/app/ky-erp-frontend/package-lock.json"
      - ".github/workflows/frontend-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Frontend npm audit high/critical
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Frontend paketleri
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Advisory kaydini yazdir
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: npm audit --audit-level=high --json || true

      - name: NPM guvenli lockfile duzeltmesini uret
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          echo '=== LOCKFILE FIX DIFF ==='
          git diff -- package.json package-lock.json
          echo '=== POST FIX AUDIT ==='
          npm audit --audit-level=high

      - name: Frontend regresyon testi
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

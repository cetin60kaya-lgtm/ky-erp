name: KY ERP Frontend Dependency Remediation

on:
  push:
    branches:
      - codex/frontend-security-audit-20260902

permissions:
  contents: write

concurrency:
  group: frontend-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Apply npm audit lockfile fix
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: codex/frontend-security-audit-20260902
          fetch-depth: 0

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: NPM guvenli lockfile duzeltmesini uygula
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only
          npm audit --audit-level=high

      - name: Lockfile degisikligini dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- APP/app/ky-erp-frontend/package-lock.json; then
            echo "Lockfile zaten guvenli; yeni commit gerekmiyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/package-lock.json
          git commit -m "security: refresh browserslist lockfile to patched versions"
          git push origin HEAD:codex/frontend-security-audit-20260902

      - name: Frontend regresyon ve audit
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

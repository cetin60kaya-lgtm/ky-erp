name: KY ERP Canlı Yayın - Eski GitHub Yolu Kapalı

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-deploy-guard:
    name: Canonical Windows deploy guard
    runs-on: ubuntu-latest
    steps:
      - name: Eski GitHub production yolunu engelle
        shell: bash
        run: |
          set -euo pipefail
          echo "KY ERP production GitHub Actions yolu bilerek devre disidir."
          echo "Neden: production D1 icin genel migration zinciri uygulanmaz; eski ikinci-domain kontrolu kullanilmaz."
          echo "Canonical tek production yolu: repo kokundeki 'KY ERP CANLIYA YUKLE.bat'."
          echo "Bu launcher: kaynak guncelleme -> admin@kyerp.net Resend kaniti -> tum preflight testleri -> hedefli D1 -> Worker -> kyerp.net Pages -> canli asset dogrulamasi sirasini uygular."
          exit 1

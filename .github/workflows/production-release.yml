name: KY ERP Canli Yayin - Hedefli D1 + Worker + Pages

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "RELEASES/kyerp-production-release.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Preflight, D1 yedek, guvenlik cutover, Worker ve Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DB_NAME: ky-erp-db
      WORKER_DIR: APP/cloud/ky-erp-api
      FRONTEND_DIR: APP/app/ky-erp-frontend
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Release kaydini ve production branchini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PROD_BRANCH"
          jq -e '.approved == true and .target == "production" and .sourceBranch == "codex/model-uretim-kontrol-merkezi-final"' RELEASES/kyerp-production-release.json >/dev/null
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN eksik" >&2; exit 1; }

      - name: Worker paketleri ve tam test
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: File Hub agent syntax kontrolu
        run: |
          set -euo pipefail
          node --check tools/file-hub-agent/file-hub-agent.mjs
          node --check tools/file-hub-agent/accounting-archive-worker.mjs

      - name: Frontend paketleri, lint, test ve production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Cloudflare production erisimini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Canli D1 tam yedegini al
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-before-final-${stamp}.sql"
          npx wrangler d1 export "$DB_NAME" --remote --config wrangler.jsonc --skip-confirmation --output "$output"
          test -s "$output"
          echo "D1_BACKUP=$output" >> "$GITHUB_ENV"

      - name: D1 yedegini artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ky-erp-production-backup-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 30

      - name: Yalniz File Hub + Muhasebe hedefli migrationlarini uygula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail

          for migration in 0030_file_hub_multistorage.sql 0031_file_hub_outgoing_team_links.sql 0032_file_hub_provider_defaults.sql 0033_file_hub_primary_location_failover.sql; do
            test -f "migrations/$migration"
            echo "Uygulaniyor/idempotent: $migration"
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "migrations/$migration"
          done

          echo "0034 accounting_documents canli sema uyumlulugu kontrol ediliyor..."
          canonical="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM pragma_table_info('accounting_documents') WHERE name='uuid';" --json)"
          canonical_n="$(jq -r '.[0].results[0].n // 0' <<<"$canonical")"
          if [ "$canonical_n" = "1" ]; then
            echo "0034 canonical accounting_documents zaten mevcut; tekrar uygulanmiyor."
          else
            legacy_count_json="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM accounting_documents;" --json)"
            legacy_count="$(jq -r '.[0].results[0].n // -1' <<<"$legacy_count_json")"
            if [ "$legacy_count" != "0" ]; then
              echo "GUVENLIK DURDURMASI: Eski accounting_documents tablosunda $legacy_count kayit var; otomatik donusum yapilmadi." >&2
              exit 1
            fi
            echo "Eski accounting_documents tablosu bos; canonical semaya guvenli gecis yapiliyor."
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "DROP TABLE accounting_documents;"
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file migrations/0034_accounting_document_core.sql
          fi

          for migration in 0035_accounting_intelligence_profiles.sql 0036_accounting_document_archive_queue.sql; do
            test -f "migrations/$migration"
            echo "Uygulaniyor/idempotent: $migration"
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "migrations/$migration"
          done

      - name: Migration sonrasi File Hub + Muhasebe semasini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          tables=(
            file_hub_connections file_hub_bindings file_hub_assets file_hub_locations
            file_hub_relations file_hub_revisions file_hub_events file_hub_agent_status
            accounting_documents accounting_document_lines accounting_document_taxes
            accounting_document_relations accounting_document_issues accounting_payment_plans
            accounting_ledger_entries accounting_extraction_profiles accounting_bank_import_batches
            accounting_bank_import_rows accounting_document_archive_jobs
          )
          triggers=(trg_file_hub_outgoing_package_teammates trg_file_hub_primary_location_failover trg_accounting_documents_enqueue_archive)
          for table in "${tables[@]}"; do
            out="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='$table';" --json)"
            jq -e '.[0].results[0].n == 1' <<<"$out" >/dev/null || { echo "Eksik tablo: $table" >&2; exit 1; }
          done
          for trigger in "${triggers[@]}"; do
            out="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='trigger' AND name='$trigger';" --json)"
            jq -e '.[0].results[0].n == 1' <<<"$out" >/dev/null || { echo "Eksik trigger: $trigger" >&2; exit 1; }
          done
          canonical="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM pragma_table_info('accounting_documents') WHERE name IN ('uuid','direction','provider_type','record_scope','payable_total');" --json)"
          jq -e '.[0].results[0].n == 5' <<<"$canonical" >/dev/null || { echo "accounting_documents canonical kolonlari eksik" >&2; exit 1; }

      - name: Worker'i api.kyerp.net production'a dagit
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: RESEND_API_KEY aktif Worker bindingini dogrula veya GitHub secretiyle kur
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          current="$(npx wrangler secret list --config wrangler.jsonc --format json)"
          if jq -e 'any(.[]?; .name == "RESEND_API_KEY")' <<<"$current" >/dev/null; then
            echo "RESEND_API_KEY Worker'da mevcut."
          else
            test -n "${RESEND_API_KEY:-}" || { echo "RESEND_API_KEY Worker'da ve GitHub production secretlarinda yok." >&2; exit 1; }
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.jsonc
          fi
          final="$(npx wrangler secret list --config wrangler.jsonc --format json)"
          jq -e 'any(.[]?; .name == "RESEND_API_KEY")' <<<"$final" >/dev/null

      - name: API canli saglik ve auth contract kontrolu
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://api.kyerp.net/api/health | jq -e '.ok == true' >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent https://api.kyerp.net/api/system/status | jq -e '.ok == true' >/dev/null
          auth="$(curl --fail --silent -H 'Origin: https://app.kyerp.net' https://api.kyerp.net/api/auth/status)"
          jq -e '.authVersion == "canonical-v3" and .sessionPolicy.passwordOnlyEnabled == false and .sessionPolicy.passwordOnlySeconds == 0 and .sessionPolicy.mfaSeconds == 36000' <<<"$auth" >/dev/null

      - name: Auth pre-cutover firma ve security satirlarini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM auth_users u LEFT JOIN auth_user_security s ON s.user_id=u.id WHERE s.user_id IS NULL) AS missing_security, (SELECT COUNT(*) FROM auth_user_security WHERE TRIM(COALESCE(main_company_slug,''))='') AS missing_company;" --json)"
          jq -e '.[0].results[0].missing_security == 0 and .[0].results[0].missing_company == 0' <<<"$out" >/dev/null

      - name: MFA + oturum + IsNet + Auth final D1 cutover
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "$GITHUB_WORKSPACE/DEPLOY/KYERP_FINAL_ROUND_SECURITY_CUTOVER_V1.sql"
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file migrations/0027_isnet_tenant_scope_backfill.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file migrations/0028_isnet_tenant_scope_guard.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file migrations/0029_auth_security_policy_guard.sql

      - name: Final guvenlik ve tenant durumunu D1'den dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT (SELECT COUNT(*) FROM auth_system_secrets WHERE secret_key='FINAL_SECURITY_MAIL_ISNET_CUTOVER_20260901_V1') AS cutover_marker, (SELECT COUNT(*) FROM auth_user_security WHERE login_policy NOT IN ('GOOGLE','MICROSOFT','ANY_MFA','BOTH_MFA') OR COALESCE(session_seconds,0)<>36000) AS unsafe_policy, (SELECT COUNT(*) FROM json_store WHERE scope LIKE 'ISNET_%' AND (main_company_slug IS NULL OR TRIM(main_company_slug)='')) AS global_isnet, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_isnet_json_store_tenant_insert','trg_isnet_json_store_tenant_update')) AS isnet_guard_triggers, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_auth_users_role_canonical_insert','trg_auth_users_role_canonical_update','trg_auth_security_mfa_insert','trg_auth_security_mfa_update','trg_auth_module_key_canonical_insert','trg_auth_module_key_canonical_update')) AS auth_guard_triggers;"
          out="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command "$sql" --json)"
          jq -e '.[0].results[0].cutover_marker >= 1 and .[0].results[0].unsafe_policy == 0 and .[0].results[0].global_isnet == 0 and .[0].results[0].isnet_guard_triggers == 2 and .[0].results[0].auth_guard_triggers == 6' <<<"$out" >/dev/null

      - name: Mevcut Pages projesini ve iki canonical domaini dogrula
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          project="$(curl --fail --silent --show-error -H "$auth" "$base")"
          jq -e --arg p "$PAGES_PROJECT" '.success == true and .result.name == $p' <<<"$project" >/dev/null
          production_branch="$(jq -r '.result.production_branch // empty' <<<"$project")"
          test "$production_branch" = "$PROD_BRANCH"
          for domain in kyerp.net app.kyerp.net; do
            domains="$(curl --fail --silent --show-error -H "$auth" "$base/domains")"
            if ! jq -e --arg d "$domain" 'any(.result[]?; .name == $d)' <<<"$domains" >/dev/null; then
              created="$(curl --fail --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' --data "{\"name\":\"$domain\"}" "$base/domains")"
              jq -e '.success == true' <<<"$created" >/dev/null
            fi
          done

      - name: Frontendi Cloudflare Pages production'a dagit
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name "$PAGES_PROJECT"
          --branch "$PROD_BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "KY ERP final production $GITHUB_SHA"

      - name: Pages domainleri ACTIVE olana kadar dogrula
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          for domain in kyerp.net app.kyerp.net; do
            active=0
            for attempt in $(seq 1 60); do
              row="$(curl --fail --silent --show-error -H "$auth" "$base/domains/$domain")"
              status="$(jq -r '.result.status // empty' <<<"$row")"
              if [ "$status" = "active" ]; then active=1; break; fi
              if [ "$status" = "failed" ] || [ "$status" = "error" ]; then jq '.' <<<"$row"; exit 1; fi
              sleep 5
            done
            test "$active" -eq 1 || { echo "$domain ACTIVE olmadi" >&2; exit 1; }
          done

      - name: Canli site + uygulama HTTP kontrolu
        shell: bash
        run: |
          set -euo pipefail
          for url in https://kyerp.net/ https://app.kyerp.net/; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" >/tmp/kyerp-page.html && test -s /tmp/kyerp-page.html; then ready=1; break; fi
              sleep 2
            done
            test "$ready" -eq 1
          done

      - name: Canli yayin sonucu
        run: |
          echo "KY ERP production yayini tamamlandi."
          echo "MFA: zorunlu"
          echo "Oturum cutover: uygulandi"
          echo "IsNet tenant guard: aktif"
          echo "RESEND_API_KEY: aktif Worker bindingi dogrulandi"
          echo "API: https://api.kyerp.net"
          echo "Site: https://kyerp.net"
          echo "App: https://app.kyerp.net"

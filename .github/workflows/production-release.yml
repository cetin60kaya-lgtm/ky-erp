name: KY ERP Canlı Yayın

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "RELEASES/kyerp-production-release.json"

permissions:
  contents: read

concurrency:
  group: kyerp-production-release
  cancel-in-progress: false

jobs:
  release:
    name: D1 yedek, migration, Worker ve Pages yayını
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Release kaydını doğrula
        run: |
          jq -e '.approved == true and .target == "production"' \
            RELEASES/kyerp-production-release.json >/dev/null

      - name: Cloudflare tokenını doğrula ve D1 hesabını çöz
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN eksik." >&2
            exit 1
          }
          database_id="b504b712-6927-499d-815d-0b954c8ee246"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts_json="$(curl --fail --silent --show-error \
            -H "$auth_header" \
            https://api.cloudflare.com/client/v4/accounts)"
          mapfile -t account_ids < <(jq -r '.result[]?.id' <<<"$accounts_json")
          test "${#account_ids[@]}" -gt 0 || {
            echo "Tokenın erişebildiği Cloudflare hesabı yok." >&2
            exit 1
          }
          resolved_account_id=""
          for account_id in "${account_ids[@]}"; do
            databases_json="$(curl --fail --silent --show-error \
              -H "$auth_header" \
              "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg database_id "$database_id" \
              'any(.result[]?; ((.uuid // .id // "") == $database_id))' \
              <<<"$databases_json" >/dev/null; then
              resolved_account_id="$account_id"
              break
            fi
          done
          test -n "$resolved_account_id" || {
            echo "ky-erp-db sahibi hesap bulunamadı." >&2
            exit 1
          }
          echo "CLOUDFLARE_ACCOUNT_ID=$resolved_account_id" >> "$GITHUB_ENV"

      - name: Mevcut Cloudflare Pages projesini doğrula
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          project_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ky-erp-frontend")"
          jq -e '.success == true and .result.name == "ky-erp-frontend"' \
            <<<"$project_json" >/dev/null
          project_name="$(jq -r '.result.name' <<<"$project_json")"
          production_branch="$(jq -r '.result.production_branch // "main"' <<<"$project_json")"
          test -n "$production_branch" && test "$production_branch" != "null"
          echo "name=$project_name" >> "$GITHUB_OUTPUT"
          echo "branch=$production_branch" >> "$GITHUB_OUTPUT"
          echo "Pages projesi doğrulandı: $project_name / $production_branch"

      - name: Worker paketlerini kur
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Üretim bağımlılık güvenlik denetimi
        working-directory: APP/cloud/ky-erp-api
        run: npm audit --omit=dev --audit-level=high

      - name: Worker typecheck ve dry-run
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm run typecheck
          npm run build

      - name: Frontend paketlerini kur
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Frontend lint ve production build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm run lint
          npm run build

      - name: Canlı D1 tam yedeğini al
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-full-before-${stamp}.sql"
          success=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$output"
            if npx wrangler d1 export ky-erp-db \
              --remote \
              --config wrangler.jsonc \
              --skip-confirmation \
              --output "$output"; then
              success=1
              break
            fi
            wait_seconds=$((attempt * 30))
            echo "D1 yedeği hazırlanıyor; ${wait_seconds} saniye sonra yeniden denenecek."
            sleep "$wait_seconds"
          done
          test "$success" -eq 1 || {
            echo "Tam D1 yedeği alınamadı; migration ve yayın durduruldu." >&2
            exit 1
          }

      - name: Yedeği yayın öncesi sakla
        uses: actions/upload-artifact@v4
        with:
          name: ky-erp-production-backup-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 30

      - name: Bekleyen D1 migrationlarını göster
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler d1 migrations list ky-erp-db --remote --config wrangler.jsonc

      - name: Canlı D1 migrationlarını uygula
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler d1 migrations apply ky-erp-db --remote --config wrangler.jsonc

      - name: Migration sonrası canlı D1 denetimi
        working-directory: APP/cloud/ky-erp-api
        run: >-
          node scripts/d1-schema-audit.mjs
          --remote
          --database ky-erp-db
          --config wrangler.jsonc
          --require-migrations

      - name: Workerı api.kyerp.net adresine dağıt
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Canlı API sağlık ve Boyahane rota kontrolü
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://api.kyerp.net/api/health \
              | tee /tmp/health.json \
              | jq -e '.ok == true' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent https://api.kyerp.net/api/system/status \
            | tee /tmp/system-status.json \
            | jq -e '.ok == true' >/dev/null
          curl --fail --silent \
            "https://api.kyerp.net/api/boyahane/registered-colors?mainCompanySlug=mecit-hakan&mainCompanyId=main-mecit-hakan" \
            >/tmp/boyahane-registered-colors.json

      - name: Frontendi Cloudflare Pages production ortamına dağıt
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name "${{ steps.pages.outputs.name }}"
          --branch "${{ steps.pages.outputs.branch }}"
          --commit-hash "${{ github.sha }}"
          --commit-message "KY ERP production release ${{ github.sha }}"

      - name: Canlı siteyi doğrula
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --location --fail --silent --show-error https://kyerp.net/ \
              >/tmp/kyerp-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          test -s /tmp/kyerp-home.html

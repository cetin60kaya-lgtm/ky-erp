name: e-Belge Merkezi Doğrulama

on:
  pull_request:
    branches:
      - codex/e-belge-merkezi-v1
    paths:
      - "APP/app/ky-erp-backend/**"
      - "APP/app/ky-erp-frontend/**"
      - "docs/trigger-e-belge-validation.txt"
      - ".github/workflows/e-belge-validate.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci-validation.db"
    defaults:
      run:
        working-directory: APP/app/ky-erp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - name: e-Belge ve İşNet güvenlik testleri
        run: npx tsx --test src/muhasebe/e-belge-match.engine.spec.ts src/muhasebe/isnet-full-sync.service.spec.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

name: KY ERP Mobile Data Consolidation

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/consolidate-mobile-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply consolidation patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth = Path('APP/app/ky-erp-frontend/src/context/AuthContext.jsx')
          s = auth.read_text(encoding='utf-8-sig')
          s = s.replace('const CLOUD_ADMIN_USERNAME = "admin";\nconst CLOUD_ADMIN_PASSWORD = "2582";\n', '')
          start = s.find('function base64Url(value) {')
          end = s.find('function parseJwtPayload(token) {')
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          s = re.sub(
              r'\n      if \(snapshot\.user\?\.id === "cloud-admin"\) \{.*?\n        return;\n      \}\n',
              '\n',
              s,
              flags=re.S,
          )
          s = re.sub(
              r'  const login = useCallback\(async function login\(username, password\) \{.*?\n    const response = await apiFetch\("/auth/login",',
              '  const login = useCallback(async function login(username, password) {\n    const response = await apiFetch("/auth/login",',
              s,
              count=1,
              flags=re.S,
          )
          if '2582' in s or 'cloud-admin' in s or 'CLOUD_ADMIN_' in s:
              raise SystemExit('Frontend fixed admin fallback could not be removed completely')
          auth.write_text(s, encoding='utf-8')

          ik = Path('APP/app/ky-erp-frontend/src/pages/modules/IkPage.jsx')
          s = ik.read_text(encoding='utf-8-sig')
          s = s.replace('const IK_DAILY_DATE_RANGE_KEY = "ikDailyDateRange";', 'const IK_DAILY_DATE_RANGE_KEY = "ikDailyDateRange.v2";')
          s = s.replace('const IK_DAILY_SELECTED_DATE_KEY = "ikDailySelectedDate";', 'const IK_DAILY_SELECTED_DATE_KEY = "ikDailySelectedDate.v2";')
          s = s.replace(
              'const DEFAULT_DAILY_RANGE = { start: "2026-05-13", end: "2026-05-19" };',
              'const DEFAULT_DAILY_RANGE = (() => {\n  const start = startOfWeekDateOnly(TODAY);\n  return { start, end: addDaysDateOnly(start, 6) };\n})();',
              1,
          )
          if 'const IK_DAILY_DATE_RANGE_KEY = "ikDailyDateRange.v2";' not in s:
              raise SystemExit('Daily range storage key was not upgraded')
          if 'const start = startOfWeekDateOnly(TODAY);' not in s:
              raise SystemExit('Dynamic current-week default was not installed')
          ik.write_text(s, encoding='utf-8')

          company = Path('APP/app/ky-erp-frontend/src/context/ActiveCompanyContext.jsx')
          s = company.read_text(encoding='utf-8')
          s = s.replace('name: "Mecit Hakan",', 'name: "Hakan Emprime",', 1)
          company.write_text(s, encoding='utf-8')

          storage = Path('APP/cloud/ky-erp-api/src/desen-storage.ts')
          s = storage.read_text(encoding='utf-8')
          if 'relativePath: text(form.relativePath)' not in s:
              old = '''        customMetadata: {\n          originalName: file.name,\n          uploadedAt: nowIso(),\n          source: "KY_ERP_UPLOAD",\n        },'''
              new = '''        customMetadata: {\n          originalName: file.name,\n          relativePath: text(form.relativePath),\n          uploadedAt: nowIso(),\n          source: text(form.source || "KY_ERP_UPLOAD"),\n        },'''
              if old not in s:
                  raise SystemExit('Desen upload metadata anchor not found')
              s = s.replace(old, new, 1)
          storage.write_text(s, encoding='utf-8')
          PY

      - name: Worker typecheck and build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend lint and build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify fixed login is gone and IK routes are wired
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-string 'CLOUD_ADMIN_PASSWORD' APP/app/ky-erp-frontend/src
          ! grep -R --line-number --fixed-string 'FALLBACK_ADMIN_PASSWORD' APP/cloud/ky-erp-api/src
          ! grep -R --line-number --fixed-string '2582' APP/app/ky-erp-frontend/src/context/AuthContext.jsx APP/cloud/ky-erp-api/src/auth-cloud.ts
          grep -q 'registerIkRelationalCloudRoutes(app);' APP/cloud/ky-erp-api/src/main.ts
          grep -q 'ikDailyDateRange.v2' APP/app/ky-erp-frontend/src/pages/modules/IkPage.jsx
          grep -q 'startOfWeekDateOnly(TODAY)' APP/app/ky-erp-frontend/src/pages/modules/IkPage.jsx

      - name: Commit consolidated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add \
            APP/app/ky-erp-frontend/src/context/AuthContext.jsx \
            APP/app/ky-erp-frontend/src/context/ActiveCompanyContext.jsx \
            APP/app/ky-erp-frontend/src/pages/modules/IkPage.jsx \
            APP/cloud/ky-erp-api/src/desen-storage.ts
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git commit -m "fix: consolidate mobile IK auth and design migration defaults"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

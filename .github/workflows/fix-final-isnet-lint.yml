name: Nihai İşNet Lint Düzeltmesi

on:
  push:
    branches: [tasarim-final-v1]
    paths: [.github/workflows/fix-final-isnet-lint.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tasarim-final-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Kullanılmayan state satırını kaldır
        shell: pwsh
        run: |
          $path = 'APP/app/ky-erp-frontend/src/pages/modules/isnet/IsnetWorkflowFinalPage.jsx'
          $content = Get-Content $path -Raw
          $content = $content.Replace('  const [dispatchCandidates, setDispatchCandidates] = useState({});' + "`r`n", '')
          $content = $content.Replace('  const [dispatchCandidates, setDispatchCandidates] = useState({});' + "`n", '')
          Set-Content $path $content -Encoding utf8
          if (Select-String -Path $path -Pattern 'dispatchCandidates' -Quiet) { throw 'Kullanılmayan state kaldı.' }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Build
        working-directory: APP/app/ky-erp-frontend
        run: npm run build

      - name: Lint
        working-directory: APP/app/ky-erp-frontend
        run: npx eslint src/AppV3.jsx src/pages/modules/isnet/IsnetWorkflowFinalPage.jsx scripts/audit-core-tabs.mjs --max-warnings=0

      - name: Sekme bağlantı denetimi
        working-directory: APP/app/ky-erp-frontend
        run: node scripts/audit-core-tabs.mjs

      - name: Doğrulanmış değişikliği commit et
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm '.github/workflows/fix-final-isnet-lint.yml'
          git add 'APP/app/ky-erp-frontend/src/pages/modules/isnet/IsnetWorkflowFinalPage.jsx'
          git commit -m "İşNet nihai ekran lint temizliğini tamamla"
          git push origin HEAD:tasarim-final-v1

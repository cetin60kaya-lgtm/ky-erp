name: Frontend Shell Check

on:
  push:
    branches:
      - arayuz-kabuk-v3
      - tasarim-dogru-v4
      - tasarim-final-v1
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Final kabuk lint
        run: >-
          npx eslint
          src/AppV3.jsx
          src/app/moduleRegistry.js
          src/hooks/useWorkspaceTabs.js
          src/layouts/AppShellV3.jsx
          --max-warnings=0

      - name: Build
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 120
            exit $LASTEXITCODE
          }

      - name: Build log yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: APP/app/ky-erp-frontend/build.log
          if-no-files-found: ignore

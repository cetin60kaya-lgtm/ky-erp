name: KY ERP Muhasebe İşNet ve İK Kontrolü

on:
  push:
    branches:
      - arayuz-kabuk-v3
      - tasarim-dogru-v4
      - tasarim-final-v1
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Build
        shell: pwsh
        run: |
          cmd /c "npm run build > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log
          exit $code

      - name: Muhasebe İşNet ve İK lint
        shell: pwsh
        run: |
          cmd /c "npx eslint src/AppV3.jsx src/app/moduleRegistry.js src/hooks/useWorkspaceTabs.js src/layouts/AppShellV3.jsx src/pages/modules/ik/MonthlyOperationsWorkspaceV2.jsx src/pages/modules/muhasebe/MuhasebeSmartMatchPage.jsx src/pages/modules/isnet/*.jsx --max-warnings=0 > lint.log 2>&1"
          $code = $LASTEXITCODE
          if (Test-Path lint.log) { Get-Content lint.log }
          exit $code

      - name: Üç modül sekme bağlantı denetimi
        shell: pwsh
        run: |
          cmd /c "node scripts/audit-core-tabs.mjs > tab-audit.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content tab-audit.log
          exit $code

      - name: Kontrol loglarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-logs
          path: |
            APP/app/ky-erp-frontend/build.log
            APP/app/ky-erp-frontend/lint.log
            APP/app/ky-erp-frontend/tab-audit.log
          if-no-files-found: ignore

  core-backend:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./ci-isnet.db
      NODE_ENV: test
    defaults:
      run:
        working-directory: APP/app/ky-erp-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-backend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Prisma client üret
        run: npm run db:generate

      - name: Backend build
        shell: pwsh
        run: |
          cmd /c "npm run build > backend-build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content backend-build.log
          exit $code

      - name: İşNet ve Muhasebe testleri
        shell: pwsh
        run: |
          cmd /c "npm run test:isnet > isnet-tests.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content isnet-tests.log
          exit $code

      - name: İK aylık ve günlük testleri
        shell: pwsh
        run: |
          cmd /c "npm run test:ik > ik-tests.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content ik-tests.log
          exit $code

      - name: Backend loglarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-backend-check-logs
          path: |
            APP/app/ky-erp-backend/backend-build.log
            APP/app/ky-erp-backend/isnet-tests.log
            APP/app/ky-erp-backend/ik-tests.log
          if-no-files-found: ignore

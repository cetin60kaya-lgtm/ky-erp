name: KY ERP Görselle Model Bul Finalize

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/desen-visual-assistant-finalize.yml
      - tools/patch-visual-assistant.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Görsel model aramayı bağla
        run: python3 tools/patch-visual-assistant.py

      - name: Worker typecheck ve dry build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend lint ve build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Bağlantıyı doğrula
        run: |
          grep -q 'registerDesenVisualSearchRoutes' APP/cloud/ky-erp-api/src/main.ts
          grep -q 'VISION_OCR_PLUS_BGE_M3_RERANK' APP/cloud/ky-erp-api/src/desen-visual-search.ts
          grep -q 'findDesignByImage' APP/app/ky-erp-frontend/src/services/aiApi.js
          grep -q 'Görselle Bul' APP/app/ky-erp-frontend/src/pages/modules/AiAssistantPage.jsx
          grep -q 'Bu model büyük olasılıkla' APP/app/ky-erp-frontend/src/pages/modules/AiAssistantPage.jsx

      - name: Tamamlanan kodu kaydet
        run: |
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add APP/cloud/ky-erp-api/src/main.ts APP/cloud/ky-erp-api/src/desen-visual-search.ts APP/app/ky-erp-frontend/src/services/aiApi.js APP/app/ky-erp-frontend/src/pages/modules/AiAssistantPage.jsx APP/app/ky-erp-frontend/src/pages/modules/AiAssistantPage.css APP/app/ky-erp-frontend/src/pages/desen/DesenModeller.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: find ERP models from uploaded design photos"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final


name: TEMP Worker TypeScript Diagnostics

on:
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final

permissions:
  contents: read

jobs:
  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json
      - name: Environment
        run: node -v && npm -v
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

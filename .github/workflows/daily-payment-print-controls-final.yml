name: Daily Operations Final UX Consolidation

on:
  push:
    branches: [codex/model-uretim-kontrol-merkezi-final]
    paths:
      - '.github/workflows/daily-payment-print-controls-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/model-uretim-kontrol-merkezi-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Use committed final UX source
        run: echo "Using committed DailyHrWorkspace print/range fixes"

      - name: Verify final UX contract
        shell: bash
        run: |
          set -euo pipefail
          page='APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx'
          css='APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css'
          grep -F 'index += 10' "$page"
          grep -F 'grid-template-rows:repeat(5,51mm)' "$page"
          grep -F 'TOPLAM ÖDEME' "$page"
          grep -F 'index += 35' "$page"
          grep -F 'week-totals' "$page"
          grep -F 'GENEL TOPLAM' "$page"
          grep -F 'weekday: "short"' "$page"
          grep -F 'else await loadQuickFocus(snapshot.date, snapshot.shift, snapshot.query);' "$page"
          grep -F 'gop-person-dialog' "$page"
          grep -F 'DialogSizer kind="quick"' "$page"
          grep -F 'DialogSizer kind="person"' "$page"
          grep -F 'DialogSizer kind="log"' "$page"
          grep -F 'DialogSizer kind="excel"' "$page"
          grep -F 'quick-shift-badge' "$page"
          grep -F 'quick.shift === "day" ? "G" : "N"' "$page"
          grep -F 'FINAL-UX-CONSOLIDATION-2026-09-29' "$css"
          grep -F '.gop-quick-dialog.shift-night' "$css"
          grep -F '.dialog-sizer' "$css"

      - name: Frontend checks
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        env:
          VITE_API_URL: https://api.kyerp.net

      - name: Commit final Daily Operations update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KY ERP Automation'
          git config user.email 'actions@kyerp.net'
          git add \
            APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx \
            APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(daily): consolidate final entry print and dialog UX'
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

      - name: Deploy production
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.118.0 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$PROD_BRANCH" --commit-hash "$(git rev-parse HEAD)" --commit-message "Daily Operations final UX consolidation"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in gunluk-operasyon/daily-entry gunluk-operasyon/daily-payments gunluk-operasyon/daily-weekly; do
            ok=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "https://kyerp.net/$path" > /tmp/daily.html && test -s /tmp/daily.html; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done

# urgent-slip-range-split-v1

name: Günlük Operasyon Canlı Yayın

on:
  push:
    branches: [codex/model-uretim-kontrol-merkezi-final]
    paths:
      - 'APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx'
      - 'APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace.css'
      - 'APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css'
      - 'APP/app/ky-erp-frontend/src/services/dailyOpsApi.js'
      - 'APP/app/ky-erp-frontend/src/app/moduleRegistry.js'
      - 'APP/app/ky-erp-frontend/public/manifest.webmanifest'
      - '.github/workflows/daily-payment-print-controls-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-operations-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/model-uretim-kontrol-merkezi-final

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Frontend kalite kapısı
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Günlük Operasyon build doğrulaması
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -R -q "Yönetim Özeti" dist/assets
          grep -R -q "Hızlı Personel Girişi" dist/assets
          grep -R -q "Hakediş & Ödeme" dist/assets

      - name: Cloudflare Pages production deploy
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name "$PAGES_PROJECT"
          --branch "$PROD_BRANCH"
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "Günlük Operasyon kurumsal final düzen"

      - name: Canlı route smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in             gunluk-operasyon/daily-dashboard             gunluk-operasyon/daily-entry             gunluk-operasyon/daily-cards             gunluk-operasyon/daily-weekly             gunluk-operasyon/daily-payments             manifest.webmanifest
          do
            ok=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "https://kyerp.net/$path" > /tmp/live.out && test -s /tmp/live.out; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
          done

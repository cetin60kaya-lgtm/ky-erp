name: Daily Operations Final UX Consolidation

on:
  push:
    branches: [codex/model-uretim-kontrol-merkezi-final]
    paths:
      - '.github/workflows/daily-payment-print-controls-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/model-uretim-kontrol-merkezi-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Frontend build
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.kyerp.net

      - name: Deploy production directly to Cloudflare Pages
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name "$PAGES_PROJECT"
          --branch "$PROD_BRANCH"
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "Urgent Daily Operations payment slips"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in gunluk-operasyon/daily-payments gunluk-operasyon/daily-weekly; do
            ok=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "https://kyerp.net/$path" > /tmp/daily.html && test -s /tmp/daily.html; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done

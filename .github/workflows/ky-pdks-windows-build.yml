name: KY ERP + PDKS Windows Setup

on:
  # Automatic GitHub Actions disabled. Run only when explicitly requested.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ky-erp-pdks-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, iki ürün publish ve Setup.exe
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: KY ERP + KY PDKS test ve paket
        shell: pwsh
        run: ./APP/desktop/ky-pdks/BUILD_SETUP.ps1

      - name: İki Setup çıktısını doğrula
        shell: pwsh
        run: |
          $erp = Get-ChildItem ./APP/desktop/ky-pdks/dist/setup -Filter 'KY-ERP-Desktop-Setup-*.exe' | Select-Object -First 1
          $pdks = Get-ChildItem ./APP/desktop/ky-pdks/dist/setup -Filter 'KY-PDKS-Desktop-Setup-*.exe' | Select-Object -First 1
          if (-not $erp) { throw 'KY ERP Desktop Setup.exe bulunamadı.' }
          if (-not $pdks) { throw 'KY PDKS Desktop Setup.exe bulunamadı.' }
          Get-FileHash $erp.FullName -Algorithm SHA256
          Get-FileHash $pdks.FullName -Algorithm SHA256
          Get-Content "$($erp.FullName).sha256.txt"
          Get-Content "$($pdks.FullName).sha256.txt"
          Get-Content ./APP/desktop/ky-pdks/dist/setup/build-info.json

      - name: Windows kurulum paketlerini sakla
        uses: actions/upload-artifact@v4
        with:
          name: KY-ERP-PDKS-Windows-Setup-${{ github.run_number }}
          path: |
            APP/desktop/ky-pdks/dist/setup/KY-ERP-Desktop-Setup-*.exe
            APP/desktop/ky-pdks/dist/setup/KY-PDKS-Desktop-Setup-*.exe
            APP/desktop/ky-pdks/dist/setup/*.sha256.txt
            APP/desktop/ky-pdks/dist/setup/build-info.json
          if-no-files-found: error
          retention-days: 30

name: KY ERP Masaüstü Windows Setup

on:
  # Automatic GitHub Actions disabled. Run only when explicitly requested.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ky-erp-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, publish ve Setup.exe
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: KY ERP Masaüstü test ve paket
        shell: pwsh
        run: ./APP/desktop/ky-pdks/BUILD_SETUP.ps1

      - name: Setup çıktısını doğrula
        shell: pwsh
        run: |
          $setup = Get-ChildItem ./APP/desktop/ky-pdks/dist/setup -Filter 'KY-ERP-Masaustu-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'KY ERP Masaüstü Setup.exe bulunamadı.' }
          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-Content "$($setup.FullName).sha256.txt"

      - name: Windows kurulum paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: KY-ERP-Masaustu-Windows-Setup-${{ github.run_number }}
          path: |
            APP/desktop/ky-pdks/dist/setup/KY-ERP-Masaustu-Setup-*.exe
            APP/desktop/ky-pdks/dist/setup/*.sha256.txt
            APP/desktop/ky-pdks/dist/setup/build-info.json
          if-no-files-found: error
          retention-days: 30

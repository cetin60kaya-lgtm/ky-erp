name: KY PDKS Windows Setup

on:
  push:
    branches:
      - codex/ky-pdks-windows-v1
    paths:
      - "APP/desktop/ky-pdks/**"
      - ".github/workflows/ky-pdks-windows-build.yml"
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "APP/desktop/ky-pdks/**"
      - ".github/workflows/ky-pdks-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ky-pdks-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, publish ve Setup.exe
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: KY PDKS test ve paket
        shell: powershell
        run: ./APP/desktop/ky-pdks/BUILD_SETUP.ps1

      - name: Setup çıktısını doğrula
        shell: powershell
        run: |
          $setup = Get-ChildItem ./APP/desktop/ky-pdks/dist/setup -Filter 'KY-PDKS-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'KY PDKS Setup.exe bulunamadı.' }
          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-Content "$($setup.FullName).sha256.txt"

      - name: Windows kurulum paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: KY-PDKS-Windows-Setup-${{ github.run_number }}
          path: |
            APP/desktop/ky-pdks/dist/setup/KY-PDKS-Setup-*.exe
            APP/desktop/ky-pdks/dist/setup/*.sha256.txt
            APP/desktop/ky-pdks/dist/setup/build-info.json
          if-no-files-found: error
          retention-days: 30

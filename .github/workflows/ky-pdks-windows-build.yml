name: KY ERP Desktop Windows Setup

on:
  push:
    branches:
      - codex/ky-erp-desktop-final-20260903
      - main
    paths:
      - "APP/desktop/ky-pdks/**"
      - "APP/app/ky-erp-frontend/**"
      - ".github/workflows/ky-pdks-windows-build.yml"
  pull_request:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - "APP/desktop/ky-pdks/**"
      - "APP/app/ky-erp-frontend/**"
      - ".github/workflows/ky-pdks-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ky-erp-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, frontend, publish ve Setup.exe
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: KY ERP Desktop test ve paket
        shell: pwsh
        run: ./APP/desktop/ky-pdks/BUILD_SETUP.ps1

      - name: Setup çıktısını doğrula
        shell: pwsh
        run: |
          $setup = Get-ChildItem ./APP/desktop/ky-pdks/dist/setup -Filter 'KY-ERP-Desktop-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'KY ERP Desktop Setup.exe bulunamadı.' }
          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-Content "$($setup.FullName).sha256.txt"
          Get-Content ./APP/desktop/ky-pdks/dist/setup/build-info.json

      - name: Windows kurulum paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: KY-ERP-Desktop-Windows-Setup-${{ github.run_number }}
          path: |
            APP/desktop/ky-pdks/dist/setup/KY-ERP-Desktop-Setup-*.exe
            APP/desktop/ky-pdks/dist/setup/*.sha256.txt
            APP/desktop/ky-pdks/dist/setup/build-info.json
          if-no-files-found: error
          retention-days: 30

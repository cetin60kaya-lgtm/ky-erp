name: IK Personel Merkezi Tek Seferlik Canli Yayin

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/ik-personnel-live-deploy-once.yml"

permissions:
  contents: read

concurrency:
  group: kyerp-ik-personnel-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: D1 migration ve Worker canli yayin
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Cloudflare kimlik bilgilerini dogrula
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN eksik" >&2; exit 1)

      - name: Gercek Cloudflare hesabini ve D1 sahibini cozumle
        shell: bash
        run: |
          set -euo pipefail
          database_id="b504b712-6927-499d-815d-0b954c8ee246"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts_json="$(curl --fail --silent --show-error -H "$auth_header" https://api.cloudflare.com/client/v4/accounts)"
          mapfile -t account_ids < <(jq -r '.result[]?.id' <<<"$accounts_json")
          test "${#account_ids[@]}" -gt 0 || { echo "Cloudflare hesabi bulunamadi." >&2; exit 1; }
          resolved_account_id=""
          for account_id in "${account_ids[@]}"; do
            databases_json="$(curl --fail --silent --show-error -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg database_id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $database_id))' <<<"$databases_json" >/dev/null; then
              resolved_account_id="$account_id"
              break
            fi
          done
          test -n "$resolved_account_id" || { echo "ky-erp-db sahibi Cloudflare hesabi bulunamadi." >&2; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$resolved_account_id" >> "$GITHUB_ENV"
          echo "D1 sahibi Cloudflare hesabi dogrulandi."

      - name: Worker paketlerini kur
        run: npm ci

      - name: Migration oncesi tam D1 yedegi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-full-before-ik-personnel-${stamp}.sql"
          success=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$output"
            if npx wrangler d1 export ky-erp-db --remote --config wrangler.jsonc --skip-confirmation --output "$output"; then
              success=1
              break
            fi
            wait_seconds=$((attempt * 30))
            echo "D1 tam yedegi mesgul; ${wait_seconds} saniye sonra tekrar."
            sleep "$wait_seconds"
          done
          test "$success" -eq 1 || { echo "Tam D1 yedegi alinamadi; migration uygulanmadi." >&2; exit 1; }
          test -s "$output" || { echo "D1 yedek dosyasi bos." >&2; exit 1; }
          echo "D1 tam yedegi hazir: $output"

      - name: Bekleyen migrationlari goster
        run: npx wrangler d1 migrations list ky-erp-db --remote --config wrangler.jsonc

      - name: Canli D1 migrationlarini uygula
        run: npx wrangler d1 migrations apply ky-erp-db --remote --config wrangler.jsonc

      - name: Migration sonrasi D1 butunluk denetimi
        run: >-
          node scripts/d1-schema-audit.mjs
          --remote
          --database ky-erp-db
          --config wrangler.jsonc
          --require-migrations

      - name: Personel kontrol tablolarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('ik_user_hr_scope','ik_employee_change_history','ik_time_clock_events','ik_attendance_day_overrides','ik_card_export_batches','ik_card_export_items') ORDER BY name;" > /tmp/ik-personnel-tables.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/ik-personnel-tables.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw.flatMap((item) => item.results || []) : [];
          const names = new Set(rows.map((row) => row.name));
          const required = ['ik_user_hr_scope','ik_employee_change_history','ik_time_clock_events','ik_attendance_day_overrides','ik_card_export_batches','ik_card_export_items'];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) throw new Error(`Eksik IK personel tablosu: ${missing.join(', ')}`);
          console.log(`IK personel kontrol tablolari hazir: ${required.length}/${required.length}`);
          NODE

      - name: Worker typecheck
        run: npm run typecheck

      - name: Worker production build
        run: npm run build

      - name: Worker'i canliya dagit
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Canli API saglik kontrolu
        shell: bash
        run: |
          set -euo pipefail
          health_ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://api.kyerp.net/api/health | tee /tmp/health.json | jq -e '.ok == true' >/dev/null; then
              health_ok=1
              break
            fi
            sleep 2
          done
          test "$health_ok" -eq 1 || { echo "Canli health endpoint dogrulanamadi." >&2; exit 1; }
          curl --fail --silent https://api.kyerp.net/api/system/status | tee /tmp/system-status.json | jq -e '.ok == true' >/dev/null
          echo "Canli API health ve system status OK."

      - name: IK kontrol rotasinin canlida korumali oldugunu dogrula
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/ik-control-profile.json --write-out '%{http_code}' https://api.kyerp.net/api/ik/control/profile)"
          test "$code" = "401" || { echo "IK kontrol rotasi beklenen 401 yerine HTTP $code dondu." >&2; cat /tmp/ik-control-profile.json; exit 1; }
          echo "IK control/profile canlida mevcut ve oturum korumasi aktif (401)."

      - name: Bekleyen migration kalmadigini dogrula
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 migrations list ky-erp-db --remote --config wrangler.jsonc)"
          printf '%s\n' "$output"
          if grep -q '0020_hr_personnel_control_center.sql' <<<"$output"; then
            echo "0020 migration hala bekliyor." >&2
            exit 1
          fi

      - name: D1 yedegini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ik-personnel-d1-backup-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 30

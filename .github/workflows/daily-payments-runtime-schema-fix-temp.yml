name: KYERP Daily Payments Runtime Schema Fix TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payments-runtime-schema-fix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - name: Apply clean runtime schema separation
        run: |
          set -euo pipefail
          python3 .github/scripts/daily_payments_runtime_schema_fix_temp.py
          git diff --check
          ! grep -q 'CREATE TABLE IF NOT EXISTS hr_daily_payments' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          ! grep -q 'CREATE TRIGGER IF NOT EXISTS trg_daily_sync_payment_insert' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'async function paymentPool' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'async function paymentHistory' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'async function createPayment' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit clean source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          git commit -m "fix(daily): isolate payment ledger schema from runtime bootstrap"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
      - name: Deploy API Worker
        working-directory: APP/cloud/ky-erp-api
        run: npx --yes wrangler@4.119.0 deploy
      - name: API smoke
        run: |
          set -euo pipefail
          for url in https://api.kyerp.net/health https://api.kyerp.net/api/health; do
            code="$(curl -sS -L -o /tmp/api.txt -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then echo "$url live: OK"; exit 0; fi
          done
          echo 'API health smoke failed'
          cat /tmp/api.txt || true
          exit 1

name: Muhasebe lint kaynak düzeltmesi

on:
  push:
    branches:
      - agent/muhasebe-sade-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/muhasebe-sade-v1
          fetch-depth: 0
      - run: node scripts/patch-muhasebe-smart-match-lint.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/muhasebe/MuhasebeSmartMatchPage.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Muhasebe eşleştirme ekranındaki kullanılmayan kodu kaldır"
          git push origin HEAD:agent/muhasebe-sade-v1

name: KYERP Payments Final Polish TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payments-polish-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyerp-payments-final-polish
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - name: Apply final polish
        run: |
          set -euo pipefail
          python3 .github/scripts/daily_payments_polish_temp.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -uo pipefail
          npm ci >/tmp/pay-polish.log 2>&1 || true
          npm run lint >>/tmp/pay-polish.log 2>&1
          lint=$?
          if [ "$lint" -eq 0 ]; then npm test >>/tmp/pay-polish.log 2>&1; test_rc=$?; else test_rc=99; fi
          if [ "$lint" -eq 0 ] && [ "$test_rc" -eq 0 ]; then npm run build >>/tmp/pay-polish.log 2>&1; build_rc=$?; else build_rc=99; fi
          if [ "$lint" -ne 0 ] || [ "$test_rc" -ne 0 ] || [ "$build_rc" -ne 0 ]; then
            cd ../../..
            tail -n 240 /tmp/pay-polish.log > .github/payment_polish_error.txt
            git config user.name "kyerp-production-bot"
            git config user.email "kyerp-production-bot@users.noreply.github.com"
            git add .github/payment_polish_error.txt
            git commit -m "chore: capture payment polish validation diagnostic" || true
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
            exit 1
          fi
      - name: Commit final polish
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/app/moduleRegistry.js APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          git commit -m "fix(daily): finalize payments navigation and yearly filter"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
      - name: Deploy frontend
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git rev-parse HEAD)"
      - name: Production smoke
        run: |
          set -euo pipefail
          for path in /gunluk-operasyon/daily-payments /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-weekly; do
            ok=0
            for i in {1..10}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1
          done

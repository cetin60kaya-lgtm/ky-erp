name: TEMP IK Period Dashboard Final Payroll CI

on:
  push:
    branches:
      - codex/ik-period-dashboard-final-payroll-20260906

permissions:
  contents: read

concurrency:
  group: temp-ik-period-dashboard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/cloud/ky-erp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/app/ky-erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.kyerp.net

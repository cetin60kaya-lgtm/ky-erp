name: Muhasebe IK Diagnostic

on:
  push:
    branches:
      - codex/muhasebe-fibe-cari-final
    paths:
      - ".github/workflows/muhasebe-ik-diagnostic.yml"
      - "docs/muhasebe-ik-diagnostic-trigger.txt"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json
      - name: Kur ve izole D1 hazirla
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npm ci
          rm -rf .local-ik-diagnostic
          for sql in \
            local-production-center.sql \
            local-boyahane-inventory.sql \
            local-isnet-cloud.sql \
            migrations/0008_hr_relational_bootstrap.sql \
            local-accounting-quick-smoke.sql \
            migrations/0040_accounting_fibe_company_tracking.sql \
            local-accounting-quick-smoke-seed.sql; do
            npx wrangler d1 execute ky-erp-production-local --local --config wrangler.production-local.jsonc --persist-to .local-ik-diagnostic --file "$sql" >/dev/null
          done
      - name: Worker baslat ve IK cevabini yazdir
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          nohup npx wrangler dev --local --config wrangler.production-local.jsonc --persist-to .local-ik-diagnostic --port 8791 >/tmp/ik-diag-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8791/api/health >/dev/null; then break; fi
            sleep 1
          done
          echo '--- IK RESPONSE ---'
          curl --silent --show-error -i 'http://127.0.0.1:8791/api/ik/monthly-employees?mainCompanySlug=mecit-hakan' | tee /tmp/ik-response.txt
          echo '--- WORKER LOG ---'
          cat /tmp/ik-diag-worker.log
          test -s /tmp/ik-response.txt

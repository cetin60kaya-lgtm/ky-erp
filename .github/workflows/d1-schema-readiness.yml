name: KY ERP D1 Schema Readiness - Check Only

on:
  # GitHub Actions is disabled for automatic production/PR execution.
  # Cloudflare Git Integration is the automatic deploy path; keep this workflow manual-only as fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-d1-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-only:
    name: D1 güvenlik ve hedefli şema sözleşmesi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Worker paketleri
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Worker typecheck ve test
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm run typecheck
          npm test

      - name: Worker dry-run build
        working-directory: APP/cloud/ky-erp-api
        run: npm run build

      - name: D1 production güvenlik sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -f APP/cloud/ky-erp-api/migrations/0022_auth_same_browser_session_guard.sql
          test -f APP/cloud/ky-erp-api/migrations/0023_admin_company_alias_schema.sql
          test -f APP/cloud/ky-erp-api/migrations/0024_denetime_pdks_system_user.sql
          grep -Fq 'D1 tam yedek' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq 'Remote-Column-Exists' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0022_auth_same_browser_session_guard.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0023_admin_company_alias_schema.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0024_denetime_pdks_system_user.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          ! grep -Fq 'wrangler d1 migrations apply' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          ! grep -Fq 'wrangler d1 reset' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          echo 'D1 check-only contract PASSED; production write yok.'


      - name: DESEN Drive kaynak/yerleşim/model bağları — D1 salt okunur denetim
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          audit="SELECT b.purpose_code AS purpose,
                 co.provider_type AS provider, co.sync_mode AS sync_mode,
                 co.connection_status AS connection_status,
                 COUNT(DISTINCT l.file_asset_id) AS indexed_files,
                 COUNT(DISTINCT CASE WHEN r.entity_type='MODEL' THEN r.file_asset_id END) AS linked_files,
                 COUNT(DISTINCT CASE WHEN r.entity_type='MODEL' THEN r.entity_id END) AS linked_models
               FROM file_hub_bindings b
               JOIN file_hub_connections co
                 ON co.id=b.storage_connection_id AND co.main_company_slug=b.main_company_slug
               LEFT JOIN file_hub_locations l
                 ON l.storage_connection_id=co.id AND l.main_company_slug=b.main_company_slug
                 AND l.is_available=1
                 AND substr(lower(l.relative_path),1,length(b.root_path)+1)=lower(b.root_path)||'/'
               LEFT JOIN file_hub_relations r
                 ON r.file_asset_id=l.file_asset_id AND r.main_company_slug=l.main_company_slug
                 AND r.relation_type=b.purpose_code
               WHERE b.main_company_slug='mecit-hakan'
                 AND b.module_code='DESEN' AND b.sync_enabled=1
               GROUP BY b.purpose_code,co.provider_type,co.sync_mode,co.connection_status
               ORDER BY b.purpose_code;"
          response="$(npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$audit" --json)"
          echo "$response" | jq -e 'type=="array" and .[0].success==true' >/dev/null
          echo "$response" | jq -cr '.[0].results[] | "DESEN_PURPOSE purpose=\(.purpose) provider=\(.provider) sync=\(.sync_mode) connection=\(.connection_status) indexed=\(.indexed_files) related=\(.linked_files) models=\(.linked_models)"'
          summary="SELECT COUNT(*) AS total_models,
                    SUM(CASE WHEN COALESCE(TRIM(image_url),'')<>'' THEN 1 ELSE 0 END) AS models_with_image,
                    SUM(CASE WHEN COALESCE(TRIM(image_url),'')='' THEN 1 ELSE 0 END) AS models_without_image
                   FROM model_records
                  WHERE main_company_slug='mecit-hakan' AND COALESCE(TRIM(deleted_at),'')='';"
          response="$(npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$summary" --json)"
          echo "$response" | jq -e 'type=="array" and .[0].success==true' >/dev/null
          echo "$response" | jq -cr '.[0].results[0] | "DESEN_MODEL_COVERAGE total=\(.total_models) with_image=\(.models_with_image) missing=\(.models_without_image)"'

          bindings="SELECT b.purpose_code AS purpose,
                   b.sync_enabled AS sync_enabled,
                   CASE WHEN COALESCE(TRIM(b.root_path),'')='' THEN 0 ELSE 1 END AS has_specific_root,
                   co.sync_mode AS sync_mode,
                   co.connection_status AS connection_status
              FROM file_hub_bindings b
              JOIN file_hub_connections co ON co.id=b.storage_connection_id
                AND co.main_company_slug=b.main_company_slug
             WHERE b.main_company_slug='mecit-hakan' AND b.module_code='DESEN'
               AND b.purpose_code IN ('MODEL_IMAGE','MODEL_SOURCE','PLACEMENT','OUTGOING_DESIGN')
             ORDER BY b.purpose_code;"
          response="$(npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$bindings" --json)"
          echo "$response" | jq -e 'type=="array" and .[0].success==true' >/dev/null
          echo "$response" | jq -cr '.[0].results[] | "DESEN_BINDING purpose=\(.purpose) enabled=\(.sync_enabled) root=\(.has_specific_root) mode=\(.sync_mode) state=\(.connection_status)"'
          mismatch="SELECT COUNT(DISTINCT m.id) AS workflow_image_without_canonical
              FROM model_records m
              JOIN json_store j ON j.main_company_slug=m.main_company_slug
                AND j.scope='DESEN_WORKFLOW_MODEL'
                AND json_extract(j.data,'$.id')=m.id
             WHERE m.main_company_slug='mecit-hakan' AND COALESCE(TRIM(m.deleted_at),'')=''
               AND COALESCE(TRIM(m.image_url),'')=''
               AND (
                 COALESCE(TRIM(json_extract(j.data,'$.imageUrl')),'')<>''
                 OR EXISTS(
                   SELECT 1 FROM json_each(j.data,'$.files') f
                   WHERE json_extract(f.value,'$.role')='MODEL_IMAGE'
                     AND COALESCE(
                       NULLIF(json_extract(f.value,'$.thumbnailUrl'),''),
                       NULLIF(json_extract(f.value,'$.previewUrl'),''),
                       ''
                     )<>''
                 )
               );"
          response="$(npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$mismatch" --json)"
          echo "$response" | jq -e 'type=="array" and .[0].success==true' >/dev/null
          echo "$response" | jq -cr '.[0].results[0] | "DESEN_IMAGE_GAP workflow_has_image_canonical_empty=\(.workflow_image_without_canonical)"'

          legacy="SELECT
             COUNT(*) AS raw_visual_fallback_models
            FROM model_records
           WHERE main_company_slug='mecit-hakan'
             AND COALESCE(TRIM(deleted_at),'')=''
             AND COALESCE(TRIM(image_url),'')=''
             AND (
               COALESCE(TRIM(json_extract(CASE WHEN json_valid(raw) THEN raw ELSE '{}' END,'$.imageUrl')),'')<>''
               OR COALESCE(TRIM(json_extract(CASE WHEN json_valid(raw) THEN raw ELSE '{}' END,'$.thumbnailUrl')),'')<>''
               OR COALESCE(TRIM(json_extract(CASE WHEN json_valid(raw) THEN raw ELSE '{}' END,'$.mainImage.thumbnailUrl')),'')<>''
               OR COALESCE(TRIM(json_extract(CASE WHEN json_valid(raw) THEN raw ELSE '{}' END,'$.mainImage.previewUrl')),'')<>''
             );"
          response="$(npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$legacy" --json)"
          echo "$response" | jq -e 'type=="array" and .[0].success==true' >/dev/null
          echo "$response" | jq -cr '.[0].results[0] | "DESEN_RAW_IMAGE_FALLBACK canonical_empty_but_visible=\(.raw_visual_fallback_models)"'

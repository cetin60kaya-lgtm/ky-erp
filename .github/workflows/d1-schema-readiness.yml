name: KY ERP D1 Schema Readiness - Check Only

on:
  # GitHub Actions is disabled for automatic production/PR execution.
  # Cloudflare Git Integration is the automatic deploy path; keep this workflow manual-only as fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-d1-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-only:
    name: D1 güvenlik ve hedefli şema sözleşmesi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Worker paketleri
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Worker typecheck ve test
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm run typecheck
          npm test

      - name: Worker dry-run build
        working-directory: APP/cloud/ky-erp-api
        run: npm run build

      - name: 0046 canonical Muhasebe migration sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          migration='APP/cloud/ky-erp-api/migrations/0046_accounting_canonical_report_controls.sql'
          test -f "$migration"
          grep -Fq 'CREATE TABLE IF NOT EXISTS accounting_report_categories' "$migration"
          grep -Fq 'CREATE TABLE IF NOT EXISTS accounting_report_overrides' "$migration"
          grep -Fq 'CREATE TABLE IF NOT EXISTS accounting_expense_rules' "$migration"
          ! grep -Eiq '(^|[[:space:]])DROP[[:space:]]+(TABLE|INDEX)|(^|[[:space:]])DELETE[[:space:]]+FROM|(^|[[:space:]])TRUNCATE|(^|[[:space:]])ALTER[[:space:]]+TABLE.+DROP' "$migration"
          echo '0046 canonical Muhasebe migration additive-only contract PASSED.'

      - name: 0046 migrationı izole D1 üzerinde uygula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .local-d1-readiness-0046
          npx wrangler d1 execute ky-erp-production-local \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-d1-readiness-0046 \
            --file migrations/0046_accounting_canonical_report_controls.sql
          npx wrangler d1 execute ky-erp-production-local \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-d1-readiness-0046 \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('accounting_report_categories','accounting_report_overrides','accounting_expense_rules') ORDER BY name;"

      - name: D1 production güvenlik sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -f APP/cloud/ky-erp-api/migrations/0022_auth_same_browser_session_guard.sql
          test -f APP/cloud/ky-erp-api/migrations/0023_admin_company_alias_schema.sql
          test -f APP/cloud/ky-erp-api/migrations/0024_denetime_pdks_system_user.sql
          test -f APP/cloud/ky-erp-api/migrations/0046_accounting_canonical_report_controls.sql
          grep -Fq 'D1 tam yedek' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq 'Remote-Column-Exists' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0022_auth_same_browser_session_guard.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0023_admin_company_alias_schema.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          grep -Fq '0024_denetime_pdks_system_user.sql' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          ! grep -Fq 'wrangler d1 migrations apply' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          ! grep -Fq 'wrangler d1 reset' DEPLOY/KYERP_DIRECT_PRODUCTION_V3.ps1
          echo 'D1 check-only contract PASSED; production write yok.'

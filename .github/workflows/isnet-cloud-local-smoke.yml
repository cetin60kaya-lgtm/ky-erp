name: İşNet Cloud Yerel Uçtan Uca Test

on:
  # GitHub Actions is disabled for automatic production/PR execution.
  # Cloudflare Git Integration is the automatic deploy path; keep this workflow manual-only as fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isnet-cloud-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isnet-local:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Worker paketleri
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Worker typecheck ve dry-run
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm run typecheck
          npm run build
          npx wrangler deploy --dry-run --config wrangler.production-local.jsonc

      - name: İzole yerel D1 şemasını kur
        working-directory: APP/cloud/ky-erp-api
        run: |
          rm -rf .local-isnet-ci
          npx wrangler d1 execute ky-erp-production-local \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-isnet-ci \
            --file local-production-center.sql
          npx wrangler d1 execute ky-erp-production-local \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-isnet-ci \
            --file local-isnet-cloud.sql

          for migration in \
            migrations/0018_auth_mfa_sessions.sql \
            migrations/0019_auth_dual_mfa_recovery.sql \
            migrations/0021_auth_security_policy_owner_recovery.sql \
            migrations/0022_auth_same_browser_session_guard.sql
          do
            npx wrangler d1 execute ky-erp-production-local \
              --local \
              --config wrangler.production-local.jsonc \
              --persist-to .local-isnet-ci \
              --file "$migration"
          done

          PASSWORD_HASH="$(node --input-type=module -e 'import { hash } from "bcryptjs"; console.log(await hash("Isnet-Smoke-2026!", 10));')"
          npx wrangler d1 execute ky-erp-production-local \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-isnet-ci \
            --command "INSERT OR REPLACE INTO auth_users(id,username,password_hash,full_name,role,is_active,must_change_password,created_at,updated_at) VALUES('isnet-smoke-user','isnet-smoke-user','$PASSWORD_HASH','İşNet Smoke User','VIEWER',1,0,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP); INSERT OR REPLACE INTO auth_user_security(user_id,email,main_company_slug,role_override,mfa_enabled,email_verified,approval_required,login_policy,session_seconds,created_at,updated_at) VALUES('isnet-smoke-user','isnet-smoke@example.test','mecit-hakan',NULL,0,0,0,'PASSWORD_ONLY',28800,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);"

      - name: Yerel Worker'ı başlat ve güvenli İşNet oturumu aç
        working-directory: APP/cloud/ky-erp-api
        run: |
          nohup npx wrangler dev \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-isnet-ci \
            --port 8789 > /tmp/kyerp-isnet-worker.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:8789/api/health" > /tmp/isnet-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/kyerp-isnet-worker.log
            exit 1
          fi

          curl --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"username":"isnet-smoke-user","password":"Isnet-Smoke-2026!","deviceLabel":"IsNet Local Smoke"}' \
            "http://127.0.0.1:8789/api/auth/login" \
            > /tmp/isnet-login.json
          jq -e '.stage == "AUTHENTICATED" and (.token | length > 20)' /tmp/isnet-login.json
          TOKEN="$(jq -r '.token' /tmp/isnet-login.json)"
          printf 'header = "Authorization: Bearer %s"\nheader = "X-KYERP-Tenant-Slug: mecit-hakan"\n' "$TOKEN" > /tmp/isnet-curl.conf

          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/configuration?mainCompanySlug=mecit-hakan" \
            > /tmp/isnet-configuration.json

      - name: İşNet yerel yapılandırmasını doğrula
        run: |
          jq -e '.ok == true' /tmp/isnet-configuration.json
          jq -e '.data.capabilities.localDocumentArchive == true' /tmp/isnet-configuration.json
          jq -e '.data.capabilities.localDraft == true' /tmp/isnet-configuration.json
          jq -e '.data.capabilities.portalSync == false' /tmp/isnet-configuration.json
          jq -e '.data.capabilities.submitOfficialInvoice == false' /tmp/isnet-configuration.json

      - name: Yerel belge ve yönetim özetini doğrula
        run: |
          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/dashboard?mainCompanySlug=mecit-hakan" \
            > /tmp/isnet-dashboard.json
          jq -e '.ok == true' /tmp/isnet-dashboard.json
          jq -e '.data.summary.totalDocuments == 2' /tmp/isnet-dashboard.json
          jq -e '.data.summary.incomingDispatches == 1' /tmp/isnet-dashboard.json
          jq -e '.data.summary.issuedDocuments == 1' /tmp/isnet-dashboard.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/portal/documents?mainCompanySlug=mecit-hakan" \
            > /tmp/isnet-documents.json
          jq -e '.ok == true' /tmp/isnet-documents.json
          jq -e '.data.documents | length == 2' /tmp/isnet-documents.json
          jq -e '.data.documents | map(select(.documentNo == "DDM2026000009001")) | length == 1' /tmp/isnet-documents.json

      - name: Gelen irsaliyeyi işleme al
        run: |
          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan"}' \
            "http://127.0.0.1:8789/api/isnet/incoming-dispatches/isnet-incoming-dispatch-1/import" \
            > /tmp/isnet-import.json
          jq -e '.ok == true' /tmp/isnet-import.json
          jq -e '.data.intake.status == "MODEL_WAITING"' /tmp/isnet-import.json
          jq -e '.data.intake.lines | length == 1' /tmp/isnet-import.json
          jq -r '.data.intake.id' /tmp/isnet-import.json > /tmp/isnet-intake-id.txt

      - name: Desen modelini aç ve irsaliyeye bağla
        run: |
          cat > /tmp/isnet-model.json <<'JSON'
          {
            "mainCompanySlug": "mecit-hakan",
            "id": "isnet-ci-design-model",
            "modelName": "CI ISNET MODEL",
            "modelCode": "CI-ISNET-MODEL",
            "companyId": "company-isnet-customer",
            "companyName": "TAHA GİYİM İŞNET TEST",
            "status": "CHANNEL_REVIEW_PENDING"
          }
          JSON
          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/isnet-model.json \
            "http://127.0.0.1:8789/api/desen/workflow/models" \
            > /tmp/isnet-model-result.json
          jq -e '.ok == true' /tmp/isnet-model-result.json

          INTAKE_ID="$(cat /tmp/isnet-intake-id.txt)"
          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/intake/${INTAKE_ID}/models?mainCompanySlug=mecit-hakan&q=CI%20ISNET%20MODEL" \
            > /tmp/isnet-model-suggestions.json
          jq -e '.ok == true' /tmp/isnet-model-suggestions.json
          jq -e '.data.suggestions | map(select(.id == "isnet-ci-design-model")) | length == 1' /tmp/isnet-model-suggestions.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan","candidateId":"isnet-ci-design-model"}' \
            "http://127.0.0.1:8789/api/isnet/intake/${INTAKE_ID}/model" \
            > /tmp/isnet-model-assign.json
          jq -e '.ok == true' /tmp/isnet-model-assign.json
          jq -e '.data.intake.status == "MODEL_ASSIGNED"' /tmp/isnet-model-assign.json
          jq -e '.data.intake.modelId == "isnet-ci-design-model"' /tmp/isnet-model-assign.json

      - name: Yerel fatura taslağını oluştur ve doğrula
        run: |
          cat > /tmp/isnet-draft.json <<'JSON'
          {
            "mainCompanySlug": "mecit-hakan",
            "requestId": "isnet-ci-invoice-draft",
            "recipientId": "company-isnet-customer",
            "recipientName": "TAHA GİYİM İŞNET TEST",
            "modelName": "CI ISNET MODEL",
            "lines": [
              {
                "productName": "CI ISNET MODEL",
                "description": "CI ISNET MODEL ÖN BASKI",
                "quantity": 1500,
                "unitPrice": 10,
                "vatRate": 20,
                "measureUnitId": 67
              }
            ]
          }
          JSON
          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/isnet-draft.json \
            "http://127.0.0.1:8789/api/isnet/drafts/invoice" \
            > /tmp/isnet-draft-result.json
          jq -e '.ok == true' /tmp/isnet-draft-result.json
          jq -e '.data.verified == true' /tmp/isnet-draft-result.json
          jq -r '.data.draftId' /tmp/isnet-draft-result.json > /tmp/isnet-draft-id.txt

          DRAFT_ID="$(cat /tmp/isnet-draft-id.txt)"
          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan"}' \
            "http://127.0.0.1:8789/api/isnet/drafts/${DRAFT_ID}/validate" \
            > /tmp/isnet-draft-validation.json
          jq -e '.ok == true' /tmp/isnet-draft-validation.json
          jq -e '.data.verified == true' /tmp/isnet-draft-validation.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan","approved":true,"confirmationText":"FATURAYI GÖNDER"}' \
            "http://127.0.0.1:8789/api/isnet/drafts/${DRAFT_ID}/approve" \
            > /tmp/isnet-draft-approval.json
          jq -e '.ok == true' /tmp/isnet-draft-approval.json
          jq -e '.data.status == "APPROVED_LOCAL_DRAFT"' /tmp/isnet-draft-approval.json

      - name: Adaptör yokken resmî gönderimi engelle
        run: |
          DRAFT_ID="$(cat /tmp/isnet-draft-id.txt)"
          HTTP_CODE=$(curl --config /tmp/isnet-curl.conf --silent --output /tmp/isnet-submit.json --write-out '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan"}' \
            "http://127.0.0.1:8789/api/isnet/drafts/${DRAFT_ID}/submit")
          test "$HTTP_CODE" = "409"
          jq -e '.error.code == "OFFICIAL_SUBMIT_ADAPTER_NOT_CONFIGURED"' /tmp/isnet-submit.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/drafts/${DRAFT_ID}/status?mainCompanySlug=mecit-hakan" \
            > /tmp/isnet-draft-status.json
          jq -e '.ok == true' /tmp/isnet-draft-status.json
          jq -e '.data.status == "APPROVED_LOCAL_DRAFT"' /tmp/isnet-draft-status.json
          jq -e '.data.officialInvoiceNumber == ""' /tmp/isnet-draft-status.json

      - name: Okundu ve çıktı durumlarını doğrula
        run: |
          AUTOMATION_KEY=$(jq -r '.data.documents[] | select(.documentNo == "DDM2026000009001") | .automationKey' /tmp/isnet-documents.json)
          ENCODED_KEY=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$AUTOMATION_KEY")
          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan","isRead":true}' \
            "http://127.0.0.1:8789/api/isnet/portal/documents/${ENCODED_KEY}/read" \
            > /tmp/isnet-read.json
          jq -e '.ok == true' /tmp/isnet-read.json
          jq -e '.data.readAt != null' /tmp/isnet-read.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mainCompanySlug":"mecit-hakan"}' \
            "http://127.0.0.1:8789/api/isnet/print-queue/dispatch/isnet-incoming-dispatch-1/mark-printed" \
            > /tmp/isnet-printed.json
          jq -e '.ok == true' /tmp/isnet-printed.json
          jq -e '.data.printedAt != null' /tmp/isnet-printed.json

          curl --config /tmp/isnet-curl.conf --fail --silent \
            "http://127.0.0.1:8789/api/isnet/print-queue?mainCompanySlug=mecit-hakan" \
            > /tmp/isnet-print-queue.json
          jq -e '.ok == true' /tmp/isnet-print-queue.json
          jq -e '.data.rows | map(select(.documentNo == "DDM2026000009001"))[0].printedAt != null' /tmp/isnet-print-queue.json

      - name: Rota ve veri güvenliği
        run: |
          git diff --check
          ! git diff --name-only | grep -E '(^|/)(DATA|STORAGE)(/|$)|(^|/)\.env($|\.)|\.(db|sqlite|sqlite3)$'

      - name: Hata olursa Worker logunu göster
        if: failure()
        run: cat /tmp/kyerp-isnet-worker.log || true

name: Muhasebe boya kimya lot kuralı

on:
  push:
    branches:
      - agent/muhasebe-sade-v1

permissions:
  contents: write

jobs:
  apply-rule:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Muhasebe dalını al
        uses: actions/checkout@v4
        with:
          ref: agent/muhasebe-sade-v1
          fetch-depth: 0

      - name: Boya kimya lot kuralını uygula
        run: node scripts/patch-muhasebe-chemical-lot-rule.mjs

      - name: Kaynak düzeltmesini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-backend/src/muhasebe/muhasebe-document-workflow.service.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lot üretimini boya kimya tedarikçileriyle sınırla"
          git push origin HEAD:agent/muhasebe-sade-v1

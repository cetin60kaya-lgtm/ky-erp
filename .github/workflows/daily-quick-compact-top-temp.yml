name: KYERP Daily Quick Compact Top TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-quick-compact-top-temp.yml

permissions:
  contents: write

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply compact quick entry top for small monitors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* QUICK-ENTRY-SMALL-MONITOR-COMPACT-TOP-2026-09-30 */'
          assert marker not in s, 'compact top marker already exists'
          s += r'''

          /* QUICK-ENTRY-SMALL-MONITOR-COMPACT-TOP-2026-09-30 */
          @media (max-width:1366px), (max-height:820px){
            .gop-dialog.gop-quick-dialog{max-height:calc(100dvh - 16px)!important}
            .gop-quick-dialog>header{padding:6px 9px!important;gap:7px!important;min-height:0!important}
            .gop-quick-dialog>header>div>span{font-size:7px!important;letter-spacing:.08em!important}
            .gop-quick-dialog>header p{display:none!important}
            .gop-quick-dialog>header>button{width:28px!important;height:28px!important;min-height:28px!important;padding:0!important}
            .gop-quick-dialog .quick-title-line{gap:6px!important}
            .gop-quick-dialog .quick-title-line h2{margin:1px 0 0!important;font-size:15px!important;line-height:1.1!important}
            .gop-quick-dialog .quick-shift-badge{min-width:52px!important;height:19px!important;font-size:7px!important}
            .gop-quick-dialog .quick-day-nav{padding:5px 8px!important;gap:4px!important}
            .gop-quick-dialog .quick-day-nav button,.gop-quick-dialog .gop-shift-switch button{min-height:28px!important;height:28px!important;padding:0 8px!important;font-size:8px!important}
            .gop-quick-dialog .quick-day-nav label{gap:1px!important}
            .gop-quick-dialog .quick-day-nav label>span{font-size:7px!important}
            .gop-quick-dialog .quick-day-nav input{height:28px!important;font-size:8px!important}
            .gop-quick-dialog .quick-warning{margin:0 8px 4px!important;padding:4px 7px!important;min-height:0!important;display:flex!important;align-items:center!important;gap:7px!important;white-space:nowrap!important;overflow:hidden!important}
            .gop-quick-dialog .quick-warning strong{font-size:8px!important;flex:0 0 auto!important}
            .gop-quick-dialog .quick-warning span{font-size:7px!important;overflow:hidden!important;text-overflow:ellipsis!important}
            .gop-quick-dialog .quick-kpis{gap:4px!important;padding:0 8px 4px!important}
            .gop-quick-dialog .quick-kpis .gop-stat{min-height:48px!important;padding:5px 7px!important;border-radius:7px!important}
            .gop-quick-dialog .quick-kpis .gop-stat span{font-size:8px!important}
            .gop-quick-dialog .quick-kpis .gop-stat strong{margin:2px 0 0!important;font-size:14px!important;line-height:1!important}
            .gop-quick-dialog .quick-kpis .gop-stat small{margin-top:2px!important;font-size:7px!important}
            .gop-quick-dialog .quick-controls{padding:3px 8px 4px!important;gap:4px!important}
            .gop-quick-dialog .quick-controls .gop-search{height:29px!important;min-height:29px!important;padding:0 7px!important}
            .gop-quick-dialog .quick-controls .gop-search input{height:25px!important;font-size:9px!important}
            .gop-quick-dialog .quick-add-bar>button{min-height:29px!important;height:29px!important;padding:0 7px!important;font-size:7px!important}
            .gop-quick-dialog .quick-legend{font-size:7px!important;gap:3px!important;white-space:nowrap!important}
            .gop-quick-dialog .quick-group-head{min-height:27px!important;padding:4px 6px!important}
            .gop-quick-dialog .quick-group-head strong,.gop-quick-dialog .quick-group-head span,.gop-quick-dialog .quick-group-head button{font-size:7px!important}
            .gop-quick-dialog .quick-footer{padding:5px 8px!important;gap:4px!important;min-height:42px!important}
          }
          @media (max-height:720px){
            .gop-quick-dialog .quick-warning span{display:none!important}
            .gop-quick-dialog .quick-kpis .gop-stat{min-height:42px!important;padding:4px 6px!important}
            .gop-quick-dialog .quick-kpis .gop-stat small{display:none!important}
            .gop-quick-dialog .quick-kpis .gop-stat strong{font-size:13px!important}
            .gop-quick-dialog .quick-legend{display:none!important}
          }
          '''
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -q 'QUICK-ENTRY-SMALL-MONITOR-COMPACT-TOP-2026-09-30' APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend validate
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit final source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          git commit -m "fix(daily): compact quick entry header on small screens"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git -C ../../.. rev-parse HEAD)"

      - name: Production smoke
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' 'https://kyerp.net/gunluk-operasyon/daily-entry' || true)"
            if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1

      - name: Remove deployment helper
        if: success()
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git rm .github/workflows/daily-quick-compact-top-temp.yml
          git commit -m "chore: remove quick compact top deployment helper"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

name: KY ERP File Hub OAuth Secret Unblock

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/filehub-oauth-secret-unblock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-filehub-oauth-secret-unblock
  cancel-in-progress: false

jobs:
  unblock:
    name: Worker deploy + File Hub OAuth key
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      FILE_HUB_OAUTH_KEY: ${{ secrets.FILE_HUB_OAUTH_KEY }}
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Production branch ve Cloudflare erisimini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PROD_BRANCH"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami

      - name: Worker test ve dry-run
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Test edilmis Worker surumunu once production'a dagit
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: FILE_HUB_OAUTH_KEY aktif Worker secretini kur veya dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          current="$(npx wrangler secret list --config wrangler.jsonc --format json)"
          if jq -e 'any(.[]?; .name == "FILE_HUB_OAUTH_KEY")' <<<"$current" >/dev/null; then
            echo "FILE_HUB_OAUTH_KEY zaten aktif Worker bindinginde mevcut."
          else
            if [ -n "${FILE_HUB_OAUTH_KEY:-}" ]; then
              value="$FILE_HUB_OAUTH_KEY"
              echo "FILE_HUB_OAUTH_KEY GitHub production secretinden kuruluyor."
            else
              value="$(openssl rand -hex 48)"
              echo "FILE_HUB_OAUTH_KEY guvenli tek seferlik degerle olusturuluyor."
            fi
            printf '%s' "$value" | npx wrangler secret put FILE_HUB_OAUTH_KEY --config wrangler.jsonc
            unset value
          fi
          final="$(npx wrangler secret list --config wrangler.jsonc --format json)"
          jq -e 'any(.[]?; .name == "FILE_HUB_OAUTH_KEY")' <<<"$final" >/dev/null

      - name: Canli Worker saglik kontrolu
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://api.kyerp.net/api/health | jq -e '.ok == true' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo "File Hub OAuth secret unblock tamamlandi. D1 degismedi."

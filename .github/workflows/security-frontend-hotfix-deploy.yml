name: KY Security PWA Frontend Hotfix

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - APP/app/ky-erp-frontend/public/guvenlik/**
      - .github/workflows/security-frontend-hotfix-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-security-pwa-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy KY Security PWA only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Validate security installer source
        shell: bash
        run: |
          set -euo pipefail
          node --check APP/app/ky-erp-frontend/public/guvenlik/install-helper.js
          grep -q 'fresh-v3-20260923-install-handoff' APP/app/ky-erp-frontend/public/guvenlik/install-helper.js
          grep -q 'Chrome.da Aç' APP/app/ky-erp-frontend/public/guvenlik/install-helper.js
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }

      - name: Build frontend
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy Pages only
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final

      - name: Verify live installer revision
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl --fail --silent --show-error --max-time 20 'https://security.kyerp.net/guvenlik/install-helper.js' || true)"
            if printf '%s' "$body" | grep -q 'fresh-v3-20260923-install-handoff' \
              && printf '%s' "$body" | grep -q "Chrome'da Aç"; then
              ok=1
              echo "Live installer hotfix verified on attempt ${attempt}."
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1

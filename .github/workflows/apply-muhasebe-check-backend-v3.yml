name: Muhasebe çek backend v3 kaynak yaması

on:
  push:
    branches:
      - agent/muhasebe-isnet-finans-v3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/muhasebe-isnet-finans-v3
          fetch-depth: 0
      - run: node scripts/patch-muhasebe-check-backend-v3.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-backend/src/muhasebe/accounting-api.service.ts APP/app/ky-erp-backend/src/muhasebe/muhasebe.controller.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Çek aylık özet ve belge ekleri backendini ekle"
          git push origin HEAD:agent/muhasebe-isnet-finans-v3

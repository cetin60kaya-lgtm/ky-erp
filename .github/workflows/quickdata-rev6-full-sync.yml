name: QuickDataTool REV6 Full DB-TNF Sync

on:
  push:
    branches:
      - codex/quickdata-tnf-tab-rev4
    paths:
      - '.github/workflows/quickdata-rev6-full-sync.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore full Data Kontrol and keep TNF Hazirla
        shell: pwsh
        run: |
          $tool = 'APP/desktop/kyerp-pdks-current/tools/QuickDataTool'
          $main = Join-Path $tool 'MainForm.cs'

          # Restore the last verified full DB <-> TNF sync implementation.
          git show a2a57332597e3fa5a6284f4c5209c33bf2368688:APP/desktop/kyerp-pdks-current/tools/QuickDataTool/MainForm.cs | Set-Content $main -Encoding UTF8
          $s = Get-Content $main -Raw

          # Make the sync tab impossible to miss.
          $s = $s.Replace('tabs.TabPages.Add(Page("Data Kontrol", BuildAudit()));','tabs.TabPages.Add(Page("DB - TNF Eşitle", BuildAudit()));')

          # Prefer the real Hedef live database over the KYERP local FDB when both exist.
          $old = 'string[] dbCandidates = [configured ?? "", @"C:\Hedef500\Data\DATABASE.GDB", @"D:\Hedef500\Hedef500\Data\DATABASE.GDB"];'
          $new = 'string[] dbCandidates = [@"D:\Hedef500\Hedef500\Data\DATABASE.GDB", @"C:\Hedef500\Data\DATABASE.GDB", configured ?? ""];'
          if ($s.Contains($old)) { $s = $s.Replace($old,$new) }

          Set-Content $main $s -Encoding UTF8 -NoNewline

          # Keep REV5 TNF-tab startup fix.
          $tnf = Join-Path $tool 'TnfPrepareInjector.cs'
          $t = Get-Content $tnf -Raw
          $t = $t.Replace('        BeginInvoke(new Action(RefreshPeople));','        Load += (_, _) => RefreshPeople();')
          Set-Content $tnf $t -Encoding UTF8 -NoNewline

          # Crash guard: unexpected UI exceptions are logged instead of silently closing.
          $guard = @'
          using System.Text;
          namespace QuickDataTool;
          internal static class CrashGuard
          {
              internal static void Install()
              {
                  Application.SetUnhandledExceptionMode(UnhandledExceptionMode.CatchException);
                  Application.ThreadException += (_, e) => Log(e.Exception);
                  AppDomain.CurrentDomain.UnhandledException += (_, e) => { if (e.ExceptionObject is Exception ex) Log(ex); };
              }
              static void Log(Exception ex)
              {
                  try
                  {
                      var path = Path.Combine(AppContext.BaseDirectory, "QUICKDATA_HATA.log");
                      File.AppendAllText(path, $"[{DateTime.Now:yyyy-MM-dd HH:mm:ss}] {ex}\r\n\r\n", Encoding.UTF8);
                      MessageBox.Show("Bir işlem hatası yakalandı; uygulama kapatılmadı.\n\n" + ex.Message + "\n\nKayıt: " + path,
                          "HKN PDKS", MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
                  catch { }
              }
          }
          '@
          $guard | Set-Content (Join-Path $tool 'CrashGuard.cs') -Encoding UTF8

          $program = Join-Path $tool 'Program.cs'
          $p = Get-Content $program -Raw
          if (-not $p.Contains('CrashGuard.Install();')) {
            $needle = '        ApplicationConfiguration.Initialize();'
            if (-not $p.Contains($needle)) { throw 'Program startup marker not found.' }
            $p = $p.Replace($needle, $needle + "`r`n        CrashGuard.Install();")
            Set-Content $program $p -Encoding UTF8 -NoNewline
          }

          # Hard validation: the build must contain the full sync controls.
          $check = Get-Content $main -Raw
          foreach($name in @('ApplyMissingTnf','CleanExtraTnf','FixTimeMismatchTnf','TNF EKLE','TNF SİL FAZLA','TNF DÜZELT')) {
            if(-not $check.Contains($name)) { throw "Missing full sync function: $name" }
          }

      - name: Publish QuickDataTool
        shell: pwsh
        run: |
          $proj = 'APP/desktop/kyerp-pdks-current/tools/QuickDataTool/QuickDataTool.csproj'
          dotnet restore $proj
          dotnet publish $proj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP\QuickDataTool"
          @'
          HKN PDKS HIZLI VERI - REV6 FULL DB-TNF SYNC

          Tek giris: QuickDataTool.exe

          DB - TNF Esitle sekmesi:
          - Kontrol Et
          - Secili Eksikleri Ekle
          - Tum Eksikleri Ekle
          - Fazla TNF Temizle
          - Saat Farkini Duzelt
          - TNF Listele
          - E olan DB kaydinin TNF karsiligi varsa TNF'den temizler
          - Coklu/belirsiz TNF kaydini otomatik degistirmez; INCELE olarak birakir
          - Her degisiklikten once TNF yedegi alir
          - Veritabani bu sekmede kaynak/okuma tarafidir; duzeltmeler TNF dosyasina uygulanir

          TNF Hazirla sekmesi de korunmustur.
          Otomatik tani, varsa once D:\Hedef500\Hedef500\Data\DATABASE.GDB dosyasini tercih eder.
          '@ | Set-Content "$env:RUNNER_TEMP\QuickDataTool\README_REV6.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKN-PDKS-Hizli-Veri-REV6-FULL-SYNC
          path: ${{ runner.temp }}\QuickDataTool\**
          if-no-files-found: error
          retention-days: 7

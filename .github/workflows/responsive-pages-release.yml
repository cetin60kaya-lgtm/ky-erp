name: KY ERP Responsive Frontend Canli Yayin

on:
  # Cloudflare Git Integration is the automatic production deployment path.
  # GitHub Actions is kept manual-only as an emergency fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-responsive-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Frontend test build ve Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
      FRONTEND_DIR: APP/app/ky-erp-frontend

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Production branchini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PROD_BRANCH"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Yalnız frontend degisikligi oldugunu dogrula
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Frontend-only yayin otomatik atlandi: onceki commit belirlenemedi."
            exit 0
          fi
          git cat-file -e "$before^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$before"
          changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          if grep -Eq '^(APP/cloud/ky-erp-api/|RELEASES/kyerp-production-release\.json$|\.github/workflows/production-release\.yml$)' <<<"$changed"; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Worker/D1/full-release degisikligi bulundu; Pages-only yayin atlandi."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Paketleri kur
        if: steps.scope.outputs.deploy == 'true'
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Test lint ve production build
        if: steps.scope.outputs.deploy == 'true'
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run build

      - name: Cloudflare erisimini dogrula
        if: steps.scope.outputs.deploy == 'true'
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.118.0 whoami

      - name: Frontendi Cloudflare Pages productiona dagit
        if: steps.scope.outputs.deploy == 'true'
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name "$PAGES_PROJECT"
          --branch "$PROD_BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "KY ERP responsive production $GITHUB_SHA"

      - name: Canli uygulamayi ve responsive bundlei dogrula
        if: steps.scope.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --location --fail --silent --show-error "https://app.kyerp.net/" > /tmp/kyerp-home.html && test -s /tmp/kyerp-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          entry_script="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/kyerp-home.html | head -1 | sed -n 's/.*src="\([^"]*\)"/\1/p')"
          test -n "$entry_script"

          local_responsive_asset="$(grep -l "kyerp.display.preferences.v1" "$FRONTEND_DIR"/dist/assets/*.js | head -1)"
          test -n "$local_responsive_asset"
          responsive_asset_name="$(basename "$local_responsive_asset")"

          curl --location --fail --silent --show-error             "https://app.kyerp.net/assets/$responsive_asset_name" > /tmp/kyerp-responsive-live.js
          grep -q "kyerp.display.preferences.v1" /tmp/kyerp-responsive-live.js
          grep -q "Telefon Modu" /tmp/kyerp-responsive-live.js
          grep -q "Tablet Modu" /tmp/kyerp-responsive-live.js
          grep -q "PC Modu" /tmp/kyerp-responsive-live.js

          curl --location --fail --silent --show-error "https://app.kyerp.net/boyahane/is-akisi" >/tmp/kyerp-route.html
          test -s /tmp/kyerp-route.html

      - name: Yayin sonucu
        if: steps.scope.outputs.deploy == 'true'
        run: |
          echo "KY ERP responsive frontend production yayini tamamlandi."
          echo "D1: degismedi"
          echo "Worker API: degismedi"
          echo "App: https://app.kyerp.net"

      - name: Full release paketinde Pages-only yayini atla
        if: steps.scope.outputs.deploy != 'true'
        run: |
          echo "Frontend-only yayin guvenli sekilde atlandi."
          echo "Worker/D1 iceren paket canonical production release ile yayinlanacak."

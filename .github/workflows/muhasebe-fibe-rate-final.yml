name: Muhasebe FIBE Rate Final

on:
  push:
    branches:
      - codex/muhasebe-fibe-cari-final
    paths:
      - docs/muhasebe-fibe-rate-final-trigger.txt

permissions:
  contents: write

jobs:
  final-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-fibe-cari-final
          fetch-depth: 0

      - name: FIBE oran gecmisini sabitle
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('APP/cloud/ky-erp-api/src/accounting-company-profile.ts')
          s = p.read_text(encoding='utf-8-sig')

          helper_anchor = '''function roleOf(row: Row) {'''
          helper = '''async function fibeIncomingVatTotal(\n  c: Context<AppEnv>,\n  slug: string,\n  companyId: string,\n  startDate: string,\n  beforeDate = "",\n) {\n  if (!startDate) return 0;\n  const beforeClause = beforeDate ? " AND substr(CAST(date AS TEXT),1,10) < ?" : "";\n  const statement = c.env.DB.prepare(\n    `SELECT COALESCE(SUM(COALESCE(incoming_vat,0)),0) AS total\n       FROM vat_records\n      WHERE main_company_slug=?\n        AND COALESCE(NULLIF(company_id,''),firm_id)=?\n        AND substr(CAST(date AS TEXT),1,10) >= ?${beforeClause}`,\n  );\n  const row = beforeDate\n    ? await statement.bind(slug, companyId, startDate, beforeDate).first<Row>()\n    : await statement.bind(slug, companyId, startDate).first<Row>();\n  return numberValue(row?.total, 0);\n}\n\nasync function fibeMovementCount(c: Context<AppEnv>, slug: string, companyId: string) {\n  const exists = await c.env.DB.prepare(\n    "SELECT name FROM sqlite_master WHERE type='table' AND name='accounting_fibe_movements' LIMIT 1",\n  ).first<Row>();\n  if (!exists?.name) return 0;\n  const row = await c.env.DB.prepare(\n    `SELECT COUNT(*) AS total FROM accounting_fibe_movements\n      WHERE main_company_slug=? AND company_id=? AND deleted_at IS NULL`,\n  ).bind(slug, companyId).first<Row>();\n  return Number(row?.total || 0);\n}\n\nfunction roleOf(row: Row) {'''
          if 'async function fibeIncomingVatTotal(' not in s:
              if helper_anchor not in s:
                  raise SystemExit('roleOf anchor bulunamadi')
              s = s.replace(helper_anchor, helper, 1)

          old = '''    const fibeEnabled = bool(body.fibeEnabled, Number(row.fibe_enabled || 0) === 1);\n    const fibeRate = numberValue(body.fibeRate, Number(row.fibe_rate || 0));\n    if (fibeRate < 0 || fibeRate > 100) {\n      return c.json(errorBody("INVALID_FIBE_RATE", "FİBE oranı 0 ile 100 arasında olmalıdır."), 400);\n    }\n    const requestedFibeStartDate = body.fibeStartDate === undefined\n      ? text(row.fibe_start_date)\n      : text(body.fibeStartDate);\n    const fibeStartDate = requestedFibeStartDate || (fibeEnabled ? nowIso().slice(0, 10) : "");\n    if (!validDate(fibeStartDate)) {\n      return c.json(errorBody("INVALID_FIBE_START_DATE", "FİBE başlangıç tarihi YYYY-AA-GG formatında olmalıdır."), 400);\n    }\n    const fibeOpeningAccrual = numberValue(body.fibeOpeningAccrual, Number(row.fibe_opening_accrual || 0));\n    const fibeOpeningPaid = numberValue(body.fibeOpeningPaid, Number(row.fibe_opening_paid || 0));\n    if (fibeOpeningAccrual < 0 || fibeOpeningPaid < 0) {\n      return c.json(errorBody("INVALID_FIBE_OPENING", "FİBE başlangıç hakedişi ve ödeneni negatif olamaz."), 400);\n    }'''
          new = '''    const oldFibeEnabled = Number(row.fibe_enabled || 0) === 1;\n    const oldFibeRate = numberValue(row.fibe_rate, 0);\n    const oldFibeStartDate = text(row.fibe_start_date);\n    const fibeEnabled = bool(body.fibeEnabled, oldFibeEnabled);\n    const fibeRate = numberValue(body.fibeRate, oldFibeRate);\n    if (fibeRate < 0 || fibeRate > 100) {\n      return c.json(errorBody("INVALID_FIBE_RATE", "FİBE oranı 0 ile 100 arasında olmalıdır."), 400);\n    }\n    const requestedFibeStartDate = body.fibeStartDate === undefined\n      ? oldFibeStartDate\n      : text(body.fibeStartDate);\n    let fibeStartDate = requestedFibeStartDate || (fibeEnabled ? nowIso().slice(0, 10) : "");\n    if (!validDate(fibeStartDate)) {\n      return c.json(errorBody("INVALID_FIBE_START_DATE", "FİBE başlangıç tarihi YYYY-AA-GG formatında olmalıdır."), 400);\n    }\n    let fibeOpeningAccrual = numberValue(body.fibeOpeningAccrual, Number(row.fibe_opening_accrual || 0));\n    const fibeOpeningPaid = numberValue(body.fibeOpeningPaid, Number(row.fibe_opening_paid || 0));\n    if (fibeOpeningAccrual < 0 || fibeOpeningPaid < 0) {\n      return c.json(errorBody("INVALID_FIBE_OPENING", "FİBE başlangıç hakedişi ve ödeneni negatif olamaz."), 400);\n    }\n\n    const rateChanged = oldFibeEnabled && fibeEnabled && Math.abs(fibeRate - oldFibeRate) > 0.000001;\n    if (rateChanged) {\n      const effectiveDate = nowIso().slice(0, 10);\n      if (oldFibeStartDate && oldFibeStartDate < effectiveDate) {\n        const previousVat = await fibeIncomingVatTotal(c, slug, text(row.id), oldFibeStartDate, effectiveDate);\n        const frozenAccrual = Math.round((previousVat * oldFibeRate / 100 + Number.EPSILON) * 100) / 100;\n        fibeOpeningAccrual = Math.round((fibeOpeningAccrual + frozenAccrual + Number.EPSILON) * 100) / 100;\n      }\n      fibeStartDate = effectiveDate;\n    } else if (oldFibeEnabled && fibeEnabled && oldFibeStartDate && fibeStartDate !== oldFibeStartDate) {\n      const [referenceVat, movementCount] = await Promise.all([\n        fibeIncomingVatTotal(c, slug, text(row.id), oldFibeStartDate),\n        fibeMovementCount(c, slug, text(row.id)),\n      ]);\n      const hasHistory =\n        referenceVat > 0 ||\n        movementCount > 0 ||\n        Number(row.fibe_opening_accrual || 0) > 0 ||\n        Number(row.fibe_opening_paid || 0) > 0;\n      if (hasHistory) {\n        return c.json(errorBody(\n          "FIBE_START_DATE_LOCKED",\n          "FİBE hareketi başladıktan sonra başlangıç tarihi geriye dönük değiştirilemez. Oran değişikliği yeni dönem olarak otomatik başlatılır.",\n        ), 409);\n      }\n    }'''
          if old not in s:
              raise SystemExit('FIBE settings block bulunamadi')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          seed = Path('APP/cloud/ky-erp-api/local-accounting-quick-smoke-seed.sql')
          z = seed.read_text(encoding='utf-8-sig')
          vat_anchor = '''INSERT OR REPLACE INTO payment_control_records('''
          extra_vat = '''INSERT OR REPLACE INTO vat_records(\n  id,main_company_slug,company_id,firm_id,document_id,date,period_month,period_year,\n  incoming_vat,outgoing_vat,carry_vat,raw,created_at,updated_at\n) VALUES(\n  'smoke-vat-rate-day','mecit-hakan','company-isnet-customer','company-isnet-customer','smoke-doc-2','2026-09-03',9,2026,\n  1000,0,0,'{}','2026-09-03T08:00:00.000Z','2026-09-03T08:00:00.000Z'\n);\n\nINSERT OR REPLACE INTO payment_control_records('''
          if 'smoke-vat-rate-day' not in z:
              if vat_anchor not in z:
                  raise SystemExit('seed payment anchor bulunamadi')
              z = z.replace(vat_anchor, extra_vat, 1)
          seed.write_text(z, encoding='utf-8')
          PY

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Worker typecheck ve build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: FIBE oran gecmisi smoke
        working-directory: APP/cloud/ky-erp-api
        run: |
          rm -rf .local-fibe-rate
          for sql in local-accounting-quick-smoke.sql migrations/0040_accounting_fibe_company_tracking.sql local-accounting-quick-smoke-seed.sql; do
            npx wrangler d1 execute ky-erp-production-local --local --config wrangler.production-local.jsonc --persist-to .local-fibe-rate --file "$sql"
          done
          nohup npx wrangler dev --local --config wrangler.production-local.jsonc --persist-to .local-fibe-rate --port 8794 > /tmp/kyerp-fibe-rate.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8794/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent 'http://127.0.0.1:8794/api/muhasebe/fibe/company-isnet-customer?mainCompanySlug=mecit-hakan' | jq -e '.ok == true and .data.summary.automaticAccrual == 300 and .data.summary.remainingBalance == 300'
          curl --fail --silent -X PATCH -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","fibeEnabled":true,"fibeRate":8,"fibeStartDate":"2026-08-01","fibeOpeningAccrual":0,"fibeOpeningPaid":0}' 'http://127.0.0.1:8794/api/muhasebe/firma-profilleri/company-isnet-customer' | jq -e '.ok == true and .data.fibeRate == 8 and .data.fibeStartDate == "2026-09-03" and .data.fibeOpeningAccrual == 200'
          curl --fail --silent 'http://127.0.0.1:8794/api/muhasebe/fibe/company-isnet-customer?mainCompanySlug=mecit-hakan' | jq -e '.ok == true and .data.summary.openingAccrual == 200 and .data.summary.automaticAccrual == 80 and .data.summary.remainingBalance == 280'
          STATUS=$(curl --silent -o /tmp/fibe-date-lock.json -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","fibeStartDate":"2026-08-01"}' 'http://127.0.0.1:8794/api/muhasebe/firma-profilleri/company-isnet-customer')
          test "$STATUS" = "409"
          jq -e '.error.code == "FIBE_START_DATE_LOCKED"' /tmp/fibe-date-lock.json
          curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","movementType":"PAYMENT","date":"2026-09-03","amount":50,"paymentMethod":"CASH"}' 'http://127.0.0.1:8794/api/muhasebe/fibe/company-isnet-customer/hareketler' | jq -e '.ok == true and .data.summary.remainingBalance == 230'
          curl --fail --silent 'http://127.0.0.1:8794/api/muhasebe/hizli-cari/hafta?mainCompanySlug=mecit-hakan&from=2026-09-01&to=2026-09-07' | jq -e '.ok == true and .data.summary.normalReceivable == 12000 and .data.summary.fibeRemaining == 230'

      - name: Frontend lint ve build
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Diff ve production ancestry guard
        run: |
          git fetch origin codex/model-uretim-kontrol-merkezi-final
          git merge-base --is-ancestor origin/codex/model-uretim-kontrol-merkezi-final HEAD
          git diff --check

      - name: Kaydet ve gecici akisi kaldir
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/accounting-company-profile.ts APP/cloud/ky-erp-api/local-accounting-quick-smoke-seed.sql
          git rm -f .github/workflows/muhasebe-fibe-rate-final.yml docs/muhasebe-fibe-rate-final-trigger.txt
          git commit -m "fix(accounting): freeze prior FIBE accrual when rate changes"
          git push origin HEAD:codex/muhasebe-fibe-cari-final

      - name: Hata logu
        if: failure()
        run: cat /tmp/kyerp-fibe-rate.log 2>/dev/null || true

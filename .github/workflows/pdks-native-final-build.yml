name: PDKS Native Final Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore APP/desktop/kyerp-pdks-current/KYERP.PDKS.sln
      - name: Build solution
        run: dotnet build APP/desktop/kyerp-pdks-current/KYERP.PDKS.sln -c Release --no-restore
      - name: Contract tests
        run: dotnet run --project APP/desktop/kyerp-pdks-current/tools/ContractTests/ContractTests.csproj -c Release --no-build
      - name: Shell smoke
        run: dotnet run --project APP/desktop/kyerp-pdks-current/tools/ShellSmokeTest/ShellSmokeTest.csproj -c Release --no-build
      - name: UI audit
        env:
          KY_PDKS_UI_AUDIT_NOLOAD: '1'
        run: dotnet run --project APP/desktop/kyerp-pdks-current/tools/UiAudit/UiAudit.csproj -c Release
      - name: V4 shell smoke
        run: dotnet run --project APP/desktop/kyerp-pdks-current/tools/V4ShellSmoke/V4ShellSmoke.csproj -c Release
      - name: Publish native app self contained
        run: dotnet publish APP/desktop/kyerp-pdks-current/src/HKN.Personel.Native/HKN.Personel.Native.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/HKN-PDKS
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/package | Out-Null
          Copy-Item out/HKN-PDKS/* out/package -Recurse -Force
          Get-ChildItem out/package -Filter '*.pdb' -Recurse | Remove-Item -Force
          Set-Content -Path out/package/BUILD_INFO.txt -Encoding UTF8 -Value @(
            'KY PDKS 6.3.7 CANLI',
            'Revision: 6.3.7 CANLI',
            'Scope: single simple shell + pre-paint stable window + one-minute safe live terminal sync + durable CANLI TNF/raw archive + weekly/monthly card control',
            'Distribution: release symbols removed',
            'Runtime: win-x64 self-contained',
            'Tests: Contract + Shell + UI Audit + V4 Shell',
            'Terminal: x86 TerminalBridge included; matched Hedef TerminalSdk is carried from the workplace installation during live deployment',
            'Safety: physical terminal logs are never auto-cleared; live archive cleanup never deletes main TNF/FDB',
            "Branch: $env:GITHUB_REF_NAME",
            "Commit: $env:GITHUB_SHA",
            "UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))"
          )
          Compress-Archive -Path out/package/* -DestinationPath out/KY-PDKS-6.3.7-CANLI.zip -Force
          (Get-FileHash out/KY-PDKS-6.3.7-CANLI.zip -Algorithm SHA256).Hash | Set-Content out/KY-PDKS-6.3.7-CANLI.zip.sha256.txt -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: KY-PDKS-6.3.7-CANLI
          path: |
            out/KY-PDKS-6.3.7-CANLI.zip
            out/KY-PDKS-6.3.7-CANLI.zip.sha256.txt
          if-no-files-found: error
          retention-days: 3

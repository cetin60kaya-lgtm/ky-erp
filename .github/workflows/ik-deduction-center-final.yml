name: IK deduction center final

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-deduction-center-final-trigger.txt

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uretim-tek-merkez
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch IK deduction center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          front = Path('APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx')
          worker = Path('APP/cloud/ky-erp-api/src/ik-relational-cloud.ts')
          migration = Path('APP/cloud/ky-erp-api/migrations/0008_hr_adjustment_payment_method.sql')

          s = front.read_text(encoding='utf-8')

          s = s.replace(
              'const FINANCE_TYPES = ["Mesai", "Avans", "Toplu avans", "Ozel kesinti"];',
              'const FINANCE_TYPES = ["Mesai", "Avans", "Toplu avans", "Ozel kesinti", "Icra", "Haciz"];',
              1,
          )

          old_norm = '''function normalizeFinanceType(value) {
            const text = upper(value);
            if (text.includes("TOPLU") && text.includes("AVANS")) return "Toplu avans";
            if (text.includes("AVANS")) return "Avans";
            if (text.includes("KESINT")) return "Ozel kesinti";
            if (text.includes("MESAI") || text.includes("HAFTA SONU")) return "Mesai";
            return FINANCE_TYPES.includes(value) ? value : "";
          }'''
          new_norm = '''function normalizeFinanceType(value) {
            const text = upper(value);
            if (text.includes("TOPLU") && text.includes("AVANS")) return "Toplu avans";
            if (text.includes("AVANS")) return "Avans";
            if (text.includes("HACIZ") || text.includes("HACİZ")) return "Haciz";
            if (text.includes("ICRA") || text.includes("İCRA")) return "Icra";
            if (text.includes("KESINT")) return "Ozel kesinti";
            if (text.includes("MESAI") || text.includes("HAFTA SONU")) return "Mesai";
            return FINANCE_TYPES.includes(value) ? value : "";
          }'''
          if old_norm not in s:
              raise SystemExit('normalizeFinanceType block not found')
          s = s.replace(old_norm, new_norm, 1)

          s = s.replace(
              '    setModal(normalized === "Toplu avans" ? "topluAvans" : normalized === "Avans" ? "avans" : normalized === "Ozel kesinti" ? "kesinti" : "mesai");',
              '    setModal(normalized === "Toplu avans" ? "topluAvans" : normalized === "Avans" ? "avans" : ["Ozel kesinti", "Icra", "Haciz"].includes(normalized) ? "kesinti" : "mesai");',
              1,
          )

          new_plan = r'''const planFor = useCallback((employee) => {
            const own = movements.filter((item) => item.employeeId === employee.id);
            const effective = own.filter((item) => !upper(item.payrollEffect).includes("SADECE"));
            const overtimeRows = effective.filter((item) => item.type === "Mesai");
            const advanceRows = effective.filter((item) => item.type === "Avans" || item.type === "Toplu avans");
            const deductionRows = effective.filter((item) => item.type === "Ozel kesinti");
            const legalRows = effective.filter((item) => item.type === "Icra" || item.type === "Haciz");
            const overtime = overtimeRows.reduce((sum, item) => sum + num(item.amount), 0);
            const advance = advanceRows.reduce((sum, item) => sum + num(item.amount), 0);
            const deduction = deductionRows.reduce((sum, item) => sum + num(item.amount), 0);
            const garnishment = legalRows.reduce((sum, item) => sum + num(item.amount), 0);
            const isBank = (item) => upper(item.paymentMethod).includes("BANKA");
            const bankDeductions = [...advanceRows, ...deductionRows, ...legalRows].filter(isBank).reduce((sum, item) => sum + num(item.amount), 0);
            const cashDeductions = [...advanceRows, ...deductionRows, ...legalRows].filter((item) => !isBank(item)).reduce((sum, item) => sum + num(item.amount), 0);
            const legalBank = legalRows.filter(isBank).reduce((sum, item) => sum + num(item.amount), 0);
            const legalCash = legalRows.filter((item) => !isBank(item)).reduce((sum, item) => sum + num(item.amount), 0);
            const legalKinds = new Set(legalRows.map((item) => item.type));
            const legalType = legalKinds.size > 1 ? "KARMA" : legalKinds.has("Haciz") ? "HACIZ" : legalKinds.has("Icra") ? "ICRA" : "YOK";
            const garnishmentSource = legalBank > 0 && legalCash > 0 ? "KARMA" : legalCash > 0 ? "ELDEN" : "BANKA";
            const actualSalary = num(employee.salary);
            const baseEmployee = employee.baseEmployeeId ? employees.find((item) => item.id === employee.baseEmployeeId) : null;
            const salary = baseEmployee ? num(baseEmployee.salary) : actualSalary;
            const road = num(employee.roadAllowance);
            const extraLabel = "EK";
            const extra = baseEmployee ? Math.max(round(actualSalary - salary), 0) : num(employee.extraPaymentAmount);
            const pre = calcRow({ salary, road, overtime, extra, advance, deduction, garnishment });
            const saved = payrollLines.find((line) => line.employeeId === employee.id);
            const bankPlanAfterDeductions = Math.max(num(employee.bankAmount) - bankDeductions, 0);
            const bank = saved?.final ? num(saved.final.bank) : Math.min(pre.net, bankPlanAfterDeductions);
            const cash = saved?.final ? num(saved.final.cash) : Math.max(pre.net - bank, 0);
            return { employee, actualSalary, baseEmployee, salary, road, extraLabel, extra, overtime, advance, deduction, legalType, garnishmentSource, garnishment, legalBank, legalCash, bankDeductions, cashDeductions, bank, cash, saved, ...calcRow({ salary, road, overtime, extra, advance, deduction, garnishment, bank, cash }) };
          }, [employees, movements, payrollLines]);'''
          pattern = re.compile(r'const planFor = useCallback\(\(employee\) => \{.*?\n\s*\}, \[employees, movements, payrollLines, period\]\);', re.S)
          s, count = pattern.subn(new_plan, s, count=1)
          if count != 1:
              raise SystemExit(f'planFor replacement count={count}')

          new_rows = r'''const payrollRows = useMemo(() => employees.map((employee) => {
            const system = planFor(employee);
            const saved = payrollLines.find((line) => line.employeeId === employee.id);
            if (!saved?.final) return system;
            const salary = num(saved.final.salaryPay);
            const road = num(saved.final.roadPay);
            const extraLabel = "EK";
            const extra = saved.final.premiumAmount !== undefined ? num(saved.final.premiumAmount) : system.extra;
            const overtime = num(saved.final.overtimeAmount);
            const advance = num(saved.final.advanceAmount);
            const deduction = num(saved.final.deductionAmount);
            const garnishment = saved.final.garnishmentAmount !== undefined ? num(saved.final.garnishmentAmount) : system.garnishment;
            const bank = num(saved.final.bank);
            const cash = num(saved.final.cash);
            return { ...system, salary, road, extraLabel, extra, overtime, advance, deduction, garnishment, bank, cash, saved, ...calcRow({ salary, road, overtime, extra, advance, deduction, garnishment, bank, cash }) };
          }), [employees, payrollLines, planFor]);'''
          pattern = re.compile(r'const payrollRows = useMemo\(\(\) => employees\.map\(\(employee\) => \{.*?\n\s*\}\), \[employees, payrollLines, planFor\]\);', re.S)
          s, count = pattern.subn(new_rows, s, count=1)
          if count != 1:
              raise SystemExit(f'payrollRows replacement count={count}')

          s = s.replace(
              '    if (text.includes("KESINT")) return openFinance("Ozel kesinti");\n    if (text.includes("MESAI")) return openFinance("Mesai");',
              '    if (text.includes("HACIZ") || text.includes("HACİZ")) return openFinance("Haciz");\n    if (text.includes("ICRA") || text.includes("İCRA")) return openFinance("Icra");\n    if (text.includes("KESINT")) return openFinance("Ozel kesinti");\n    if (text.includes("MESAI")) return openFinance("Mesai");',
              1,
          )

          # Personel karti artik sadece sabit bilgi ve ucret planidir; hukuki kesinti hareket merkezinde yonetilir.
          s = re.sub(r'\n\s*const legalType = \["ICRA", "HACIZ"\].*?\n\s*if \(num\(modalDraft\.garnishmentAmount\) < 0\) return setNotice\("Icra / haciz kesintisi negatif olamaz\."\);', '', s, count=1, flags=re.S)
          for line in [
              '        legalDeductionType: legalType,\n',
              '        garnishmentActive: legalType !== "YOK" && num(modalDraft.garnishmentAmount) > 0,\n',
              '        garnishmentAmount: legalType !== "YOK" ? num(modalDraft.garnishmentAmount) : 0,\n',
              '        garnishmentSource: upper(modalDraft.garnishmentSource) === "ELDEN" ? "ELDEN" : "BANKA",\n',
              '        legalStartPeriod: modalDraft.legalStartPeriod || "",\n',
              '        legalEndPeriod: modalDraft.legalEndPeriod || "",\n',
              '        garnishmentNote: modalDraft.garnishmentNote || "",\n',
          ]:
              s = s.replace(line, '', 1)

          # Personel karti gorunumunden hukuki kesinti alanlarini kaldir.
          s, count = re.subn(r'<Field label="Hukuki Kesinti">.*?<Field label="Resmi Bordro Net">', '<Field label="Resmi Bordro Net">', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('person card legal fields not found')

          s = s.replace('<th>EK</th><th>İcra/Haciz</th><th>Banka Plan</th>', '<th>EK</th><th>Banka Plan</th>', 1)
          s, count = re.subn(r'<td className="money">\{money\(employee\.extraPaymentAmount\)\}</td><td>\{num\(employee\.garnishmentAmount\)>0\?.*?</td><td className="money">\{money\(employee\.bankAmount\)\}</td>', '<td className="money">{money(employee.extraPaymentAmount)}</td><td className="money">{money(employee.bankAmount)}</td>', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('person table legal column not found')
          s = s.replace('<EmptyRow show={!filteredEmployees.length} colSpan={14} text="Personel bulunamadi." />', '<EmptyRow show={!filteredEmployees.length} colSpan={13} text="Personel bulunamadi." />', 1)

          # Kesinti modalinda tur secimi: Ozel Kesinti / Icra / Haciz.
          old_modal_type = '      const type = modal === "avans" ? "Avans" : modal === "kesinti" ? "Ozel kesinti" : "Mesai";'
          new_modal_type = '      const type = modal === "avans" ? "Avans" : modal === "kesinti" ? (modalDraft.adjustmentType || "Ozel kesinti") : "Mesai";'
          if old_modal_type not in s:
              raise SystemExit('finance modal type line not found')
          s = s.replace(old_modal_type, new_modal_type, 1)

          new_finance = r'''  function financeForm(type, bulk = false) {
            const isMesai = type === "Mesai";
            const isKesinti = ["Ozel kesinti", "Icra", "Haciz"].includes(type);
            const isLegal = ["Icra", "Haciz"].includes(type);
            const financeEmployee = employees.find((employee) => employee.id === modalDraft.employeeId) || selected;
            const financeBaseEmployee = financeEmployee?.baseEmployeeId ? employees.find((employee) => employee.id === financeEmployee.baseEmployeeId) : null;
            const overtimeBaseSalary = num(financeBaseEmployee?.salary || financeEmployee?.salary);
            const overtimeDivisor = num(financeEmployee?.overtimeHourlyBase || financeEmployee?.overtimeBaseHours) || 225;
            const overtimeHourly = overtimeDivisor > 0 ? round(overtimeBaseSalary / overtimeDivisor) : 0;
            const overtimeSuggested = round(overtimeHourly * num(modalDraft.hourOrDay));
            const currentTotal = movements
              .filter((item) => item.id !== modalDraft.id && item.employeeId === modalDraft.employeeId && item.type === type)
              .reduce((sum, item) => sum + num(item.amount), 0);
            const afterTotal = round(currentTotal + num(modalDraft.amount));
            const typeLabel = type === "Icra" ? "İcra" : type === "Haciz" ? "Haciz" : type === "Ozel kesinti" ? "Özel Kesinti" : type;
            return (
              <div className="form">
                {!bulk && <Field label="Personel" half><select value={modalDraft.employeeId || selected?.id || ""} onChange={(event) => setModalDraft((old) => ({ ...old, employeeId: event.target.value }))}>{employees.map((employee) => <option key={employee.id} value={employee.id}>{employee.fullName}</option>)}</select></Field>}
                <Field label="Tarih" half><input type="date" value={modalDraft.date || dateKey(year, month, 1)} onChange={(event) => setModalDraft((old) => ({ ...old, date: event.target.value }))} /></Field>
                {isMesai ? <>
                  <Field label="Mesai Saati"><input type="number" min="0" step="0.5" value={modalDraft.hourOrDay || ""} onChange={(event) => setModalDraft((old) => ({ ...old, hourOrDay: event.target.value, adjustmentType: type }))} /></Field>
                  <Field label={`Saatlik Baz (${overtimeDivisor} saat)`}><input value={money(overtimeHourly)} readOnly /></Field>
                  <Field label="Mesai Tutarı" half><div style={{ display: "flex", gap: 6 }}><input type="number" min="0" value={modalDraft.amount || ""} onChange={(event) => setModalDraft((old) => ({ ...old, amount: event.target.value, adjustmentType: type, payrollEffect: "Bordroya yansir", paymentMethod: "Bordro" }))} /><button type="button" className="btn" disabled={!num(modalDraft.hourOrDay)} onClick={() => setModalDraft((old) => ({ ...old, amount: overtimeSuggested, adjustmentType: type, payrollEffect: "Bordroya yansir", paymentMethod: "Bordro" }))}>Hesapla</button></div></Field>
                  <Field label="Bordro Etkisi" half><input value="Maaşa eklenir" readOnly /></Field>
                </> : <>
                  {isKesinti && <Field label="Kesinti Türü" half><select value={type} onChange={(event) => setModalDraft((old) => ({ ...old, adjustmentType: event.target.value, payrollEffect: "Bordroya yansir" }))}><option value="Ozel kesinti">Özel Kesinti</option><option value="Icra">İcra</option><option value="Haciz">Haciz</option></select></Field>}
                  <Field label={isKesinti ? `${typeLabel} Tutarı` : "Avans Tutarı"} half><input type="number" min="0" value={modalDraft.amount || ""} onChange={(event) => setModalDraft((old) => ({ ...old, amount: event.target.value, adjustmentType: type }))} /></Field>
                  <Field label={isKesinti ? "Kesinti Yeri" : "Ödeme Şekli"} half><select value={modalDraft.paymentMethod || "Elden"} onChange={(event) => setModalDraft((old) => ({ ...old, paymentMethod: event.target.value }))}><option>Elden</option><option>Banka</option></select></Field>
                  <Field label="Bordro Etkisi" half>{isLegal ? <input value="Bordrodan düşer" readOnly /> : <select value={modalDraft.payrollEffect || "Bordroya yansir"} onChange={(event) => setModalDraft((old) => ({ ...old, payrollEffect: event.target.value }))}><option>Bordroya yansir</option><option>Sadece kayit</option></select>}</Field>
                </>}
                <Field label="Açıklama" wide><textarea value={modalDraft.note || ""} onChange={(event) => setModalDraft((old) => ({ ...old, note: event.target.value }))} placeholder={isMesai ? "Mesai nedeni / vardiya notu" : isLegal ? "Dosya no / icra-haciz açıklaması" : isKesinti ? "Kesinti nedeni" : "Avans açıklaması"} /></Field>
                {!bulk && <div className={`wide warnline ${isKesinti ? "warn" : "ok"}`}>{isMesai ? `Bu ay mevcut mesai: ${money(currentTotal)} · Bu kayıt sonrası: ${money(afterTotal)} · Hesaplama: baz maaş / ${overtimeDivisor} × saat.` : isKesinti ? `Bu ay mevcut ${typeLabel.toLocaleLowerCase("tr-TR")}: ${money(currentTotal)} · Bu kayıt sonrası: ${money(afterTotal)} · ${modalDraft.paymentMethod || "Elden"} ödemesinden düşer.` : `Bu ay mevcut avans: ${money(currentTotal)} · Bu kayıt sonrası: ${money(afterTotal)}.`}</div>}
                {bulk && <div className="wide warnline warn">Toplu avans kaydında seçili personellerin her biri için aynı tarih ve kişi başı tutar kaydedilir.</div>}
              </div>
            );
          }'''
          pattern = re.compile(r'  function financeForm\(type, bulk = false\) \{.*?\n\s*\}\n\n\n\s*function dailyFields\(\)', re.S)
          s, count = pattern.subn(new_finance + '\n\n\n  function dailyFields()', s, count=1)
          if count != 1:
              raise SystemExit(f'financeForm replacement count={count}')

          s = s.replace(
              '  const legalLabel = (row) => row.legalType === "HACIZ" ? "Haciz" : row.legalType === "ICRA" ? "İcra" : "";\n  const legalSourceLabel = (row) => row.garnishmentSource === "ELDEN" ? "Elden" : "Bankadan";',
              '  const legalLabel = (row) => row.legalType === "KARMA" ? "İcra/Haciz" : row.legalType === "HACIZ" ? "Haciz" : row.legalType === "ICRA" ? "İcra" : "";\n  const legalSourceLabel = (row) => row.garnishmentSource === "KARMA" ? "Banka + Elden" : row.garnishmentSource === "ELDEN" ? "Elden" : "Bankadan";',
              1,
          )

          # Hareket ozetinde hukuki kesinti ayri gorunsun.
          old_summary = '<div className="sumgrid short">{summaryBox("Personel", employees.length)}{summaryBox("Mesai toplami", money(summary.overtime))}{summaryBox("Avans toplami", money(summary.advance), "orange")}{summaryBox("Kesinti toplami", money(summary.deduction), "red")}</div>'
          new_summary = '<div className="sumgrid short">{summaryBox("Personel", employees.length)}{summaryBox("Mesai toplamı", money(summary.overtime))}{summaryBox("Avans toplamı", money(summary.advance), "orange")}{summaryBox("Özel kesinti", money(summary.deduction), "red")}{summaryBox("İcra / Haciz", money(summary.garnishment), summary.garnishment ? "orange" : "")}</div>'
          if old_summary not in s:
              raise SystemExit('movement summary block not found')
          s = s.replace(old_summary, new_summary, 1)

          front.write_text(s, encoding='utf-8')

          w = worker.read_text(encoding='utf-8')
          w = w.replace(
              '    amount: number(row.amount),\n    payrollEffect: text(row.payroll_effect),',
              '    amount: number(row.amount),\n    paymentMethod: text(row.payment_method) || "Elden",\n    payrollEffect: text(row.payroll_effect),',
              1,
          )

          # Persist payment channel on adjustment rows.
          w = w.replace(
              '  const payrollEffect = text(body.payrollEffect ?? current?.payroll_effect) || (adjustmentType === "Mesai" ? "Bordroya ekle" : "Bordrodan düş");\n  const note = text(body.note ?? body.description ?? current?.note) || null;',
              '  const paymentMethod = text(body.paymentMethod ?? current?.payment_method) || (adjustmentType === "Mesai" ? "Bordro" : "Elden");\n  const payrollEffect = text(body.payrollEffect ?? current?.payroll_effect) || (adjustmentType === "Mesai" ? "Bordroya ekle" : "Bordrodan düş");\n  const note = text(body.note ?? body.description ?? current?.note) || null;',
              1,
          )
          w = w.replace(
              'if (current) await c.env.DB.prepare("UPDATE hr_monthly_adjustments_v2 SET date=?,adjustment_type=?,hour_or_day=?,amount=?,payroll_effect=?,note=?,status=? WHERE id=?").bind(date, adjustmentType, hourOrDay, amount, payrollEffect, note, status, id).run();\n  else await c.env.DB.prepare("INSERT INTO hr_monthly_adjustments_v2 (id,employee_id,date,adjustment_type,hour_or_day,amount,payroll_effect,note,status,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)").bind(id, employeeId, date, adjustmentType, hourOrDay, amount, payrollEffect, note, status, nowIso()).run();',
              'if (current) await c.env.DB.prepare("UPDATE hr_monthly_adjustments_v2 SET date=?,adjustment_type=?,hour_or_day=?,amount=?,payment_method=?,payroll_effect=?,note=?,status=? WHERE id=?").bind(date, adjustmentType, hourOrDay, amount, paymentMethod, payrollEffect, note, status, id).run();\n  else await c.env.DB.prepare("INSERT INTO hr_monthly_adjustments_v2 (id,employee_id,date,adjustment_type,hour_or_day,amount,payment_method,payroll_effect,note,status,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?)").bind(id, employeeId, date, adjustmentType, hourOrDay, amount, paymentMethod, payrollEffect, note, status, nowIso()).run();',
              1,
          )
          w = w.replace(
              'return okData(c, mapAdjustment(saved || { id, employee_id: employeeId, date, adjustment_type: adjustmentType, hour_or_day: hourOrDay, amount, payroll_effect: payrollEffect, note, status }), current ? 200 : 201);',
              'return okData(c, mapAdjustment(saved || { id, employee_id: employeeId, date, adjustment_type: adjustmentType, hour_or_day: hourOrDay, amount, payment_method: paymentMethod, payroll_effect: payrollEffect, note, status }), current ? 200 : 201);',
              1,
          )

          w = w.replace(
              '  const payrollEffect = text(body.payrollEffect) || (adjustmentType === "Mesai" ? "Bordroya ekle" : "Bordrodan düş");\n  const note = text(body.note || body.reason) || null;',
              '  const paymentMethod = text(body.paymentMethod) || (adjustmentType === "Mesai" ? "Bordro" : "Elden");\n  const payrollEffect = text(body.payrollEffect) || (adjustmentType === "Mesai" ? "Bordroya ekle" : "Bordrodan düş");\n  const note = text(body.note || body.reason) || null;',
              1,
          )
          w = w.replace(
              'const statements = employeeIds.map((employeeId) => c.env.DB.prepare("INSERT INTO hr_monthly_adjustments_v2 (id,employee_id,date,adjustment_type,hour_or_day,amount,payroll_effect,note,status,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)").bind(crypto.randomUUID(), employeeId, date, adjustmentType, hourOrDay, amount, payrollEffect, note, status, nowIso()));',
              'const statements = employeeIds.map((employeeId) => c.env.DB.prepare("INSERT INTO hr_monthly_adjustments_v2 (id,employee_id,date,adjustment_type,hour_or_day,amount,payment_method,payroll_effect,note,status,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?)").bind(crypto.randomUUID(), employeeId, date, adjustmentType, hourOrDay, amount, paymentMethod, payrollEffect, note, status, nowIso()));',
              1,
          )
          w = w.replace(
              'await c.env.DB.prepare("UPDATE hr_monthly_adjustments_v2 SET date=?,adjustment_type=?,hour_or_day=?,amount=?,payroll_effect=?,note=?,status=? WHERE id=?").bind(hrDateOnly(body.date || current.date), text(body.adjustmentType || body.type || current.adjustment_type), number(body.hourOrDay ?? body.hours ?? current.hour_or_day), number(body.amount ?? current.amount), text(body.payrollEffect || current.payroll_effect), text(body.note ?? current.note) || null, text(body.status || current.status), id).run();',
              'await c.env.DB.prepare("UPDATE hr_monthly_adjustments_v2 SET date=?,adjustment_type=?,hour_or_day=?,amount=?,payment_method=?,payroll_effect=?,note=?,status=? WHERE id=?").bind(hrDateOnly(body.date || current.date), text(body.adjustmentType || body.type || current.adjustment_type), number(body.hourOrDay ?? body.hours ?? current.hour_or_day), number(body.amount ?? current.amount), text(body.paymentMethod || current.payment_method) || "Elden", text(body.payrollEffect || current.payroll_effect), text(body.note ?? current.note) || null, text(body.status || current.status), id).run();',
              1,
          )

          new_advanced_payroll = r'''async function advancedPayroll(c: Context<AppEnv>) {
            const companyId = companyIdOf(c);
            const year = number(c.req.query("year")) || new Date().getFullYear();
            const month = number(c.req.query("month")) || new Date().getMonth() + 1;
            const period = `${year}-${String(month).padStart(2, "0")}`;
            const [employees, saved, adjustments] = await Promise.all([monthlyRows(c, companyId), payrollRows(c, companyId), adjustmentRows(c, companyId)]);
            const employeesById = new Map(employees.map((employee) => [text(employee.id), employee]));
            const byEmployee = new Map(saved.filter((row) => number(row.year) === year && number(row.month) === month).map((row) => [text(row.employeeId), row]));
            const normalizeType = (value: unknown) => { const valueUpper = upper(value); if (valueUpper.includes("TOPLU") && valueUpper.includes("AVANS")) return "TOPLU_AVANS"; if (valueUpper.includes("AVANS")) return "AVANS"; if (valueUpper.includes("HACIZ") || valueUpper.includes("HACİZ")) return "HACIZ"; if (valueUpper.includes("ICRA") || valueUpper.includes("İCRA")) return "ICRA"; if (valueUpper.includes("KESINT")) return "KESINTI"; if (valueUpper.includes("MESAI")) return "MESAI"; return valueUpper; };
            const lines = employees.map((employee) => {
              const row = byEmployee.get(text(employee.id));
              const baseEmployee = employee.baseEmployeeId ? employeesById.get(text(employee.baseEmployeeId)) : null;
              const baseSalary = baseEmployee ? number(baseEmployee.salary) : number(employee.salary);
              const extra = baseEmployee ? Math.max(number(employee.salary) - baseSalary, 0) : number(employee.extraPaymentAmount);
              const own = adjustments.filter((item) => text(item.employeeId) === text(employee.id) && text(item.date).startsWith(period) && !upper(item.payrollEffect).includes("SADECE"));
              const overtime = own.filter((item) => normalizeType(item.adjustmentType) === "MESAI").reduce((sum, item) => sum + number(item.amount), 0);
              const advanceRows = own.filter((item) => ["AVANS", "TOPLU_AVANS"].includes(normalizeType(item.adjustmentType)));
              const deductionRows = own.filter((item) => normalizeType(item.adjustmentType) === "KESINTI");
              const legalRows = own.filter((item) => ["ICRA", "HACIZ"].includes(normalizeType(item.adjustmentType)));
              const advance = advanceRows.reduce((sum, item) => sum + number(item.amount), 0);
              const deduction = deductionRows.reduce((sum, item) => sum + number(item.amount), 0);
              const garnishment = legalRows.reduce((sum, item) => sum + number(item.amount), 0);
              const bankDeductions = [...advanceRows, ...deductionRows, ...legalRows].filter((item) => upper(item.paymentMethod).includes("BANKA")).reduce((sum, item) => sum + number(item.amount), 0);
              const baseNet = Math.max(baseSalary + number(employee.roadAllowance) + extra + overtime - advance - deduction - garnishment, 0);
              const systemBank = Math.min(baseNet, Math.max(number(employee.bankAmount) - bankDeductions, 0));
              const systemCash = Math.max(baseNet - systemBank, 0);
              const systemFinal = { salaryPay: baseSalary, roadPay: number(employee.roadAllowance), overtimeAmount: overtime, premiumAmount: extra, garnishmentAmount: garnishment, deductionAmount: deduction, advanceAmount: advance, bank: systemBank, cash: systemCash, total: baseNet };
              const final = row && upper(row.status) === "OVERRIDE" ? { salaryPay: row.salary, roadPay: row.roadAllowance, overtimeAmount: row.overtimeAmount, premiumAmount: row.premiumAmount, garnishmentAmount: row.garnishmentAmount, deductionAmount: row.deductionAmount, advanceAmount: row.advanceAmount, bank: row.bankAmount, cash: row.cashAmount, total: row.totalAmount } : systemFinal;
              return { employeeId: employee.id, code: employee.code, fullName: employee.fullName, department: employee.department, system: systemFinal, final, status: row && upper(row.status) === "OVERRIDE" ? "OVERRIDE" : "SYSTEM" };
            });
            const totals = lines.reduce((sum, row) => ({ bank: sum.bank + number(row.final.bank), cash: sum.cash + number(row.final.cash), total: sum.total + number(row.final.total) }), { bank: 0, cash: 0, total: 0 });
            return okData(c, { year, month, policy: { roadByActualPresence: true, defaultOvertimeBase: 225, advanceFirstFromCash: false, deductionRespectsSource: true, legalDeductionsAreMovements: true }, lines, totals });
          }'''
          pattern = re.compile(r'async function advancedPayroll\(c: Context<AppEnv>\) \{.*?\n\}\n\nasync function savePersonCard', re.S)
          w, count = pattern.subn(new_advanced_payroll + '\n\nasync function savePersonCard', w, count=1)
          if count != 1:
              raise SystemExit(f'advancedPayroll replacement count={count}')

          new_override = r'''async function saveAdvancedPayrollOverride(c: Context<AppEnv>) {
            const body = await bodyOf(c);
            const companyId = companyIdOf(c, body);
            const employeeId = text(body.employeeId || body.personId);
            const year = number(body.year) || new Date().getFullYear();
            const month = number(body.month) || new Date().getMonth() + 1;
            const period = `${year}-${String(month).padStart(2, "0")}`;
            const override = body.override && typeof body.override === "object" && !Array.isArray(body.override) ? body.override as Row : {};
            const employee = await first(c, `SELECT e.*, s.extra_payment_amount, s.base_employee_id FROM hr_monthly_employees e LEFT JOIN ik_person_card_settings s ON s.employee_id=e.id AND s.main_company_id=e.main_company_id WHERE e.id=? AND e.main_company_id=?`, [employeeId, companyId]);
            if (!employee) return error(c, 404, "NOT_FOUND", "Personel bulunamadı.");
            const existing = await first(c, "SELECT * FROM hr_payrolls_v2 WHERE main_company_id=? AND year=? AND month=? AND employee_id=?", [companyId, year, month, employeeId]);
            const baseEmployee = text(employee.base_employee_id) ? await first(c, "SELECT id,salary FROM hr_monthly_employees WHERE id=? AND main_company_id=?", [text(employee.base_employee_id), companyId]) : null;
            const baseSalary = baseEmployee ? number(baseEmployee.salary) : number(employee.salary);
            const autoPremium = baseEmployee ? Math.max(number(employee.salary) - baseSalary, 0) : number(employee.extra_payment_amount);
            const allAdjustments = await adjustmentRows(c, companyId);
            const normalizeType = (value: unknown) => { const valueUpper = upper(value); if (valueUpper.includes("TOPLU") && valueUpper.includes("AVANS")) return "TOPLU_AVANS"; if (valueUpper.includes("AVANS")) return "AVANS"; if (valueUpper.includes("HACIZ") || valueUpper.includes("HACİZ")) return "HACIZ"; if (valueUpper.includes("ICRA") || valueUpper.includes("İCRA")) return "ICRA"; if (valueUpper.includes("KESINT")) return "KESINTI"; if (valueUpper.includes("MESAI")) return "MESAI"; return valueUpper; };
            const own = allAdjustments.filter((item) => text(item.employeeId) === employeeId && text(item.date).startsWith(period) && !upper(item.payrollEffect).includes("SADECE"));
            const overtime = own.filter((item) => normalizeType(item.adjustmentType) === "MESAI").reduce((sum, item) => sum + number(item.amount), 0);
            const advanceRows = own.filter((item) => ["AVANS", "TOPLU_AVANS"].includes(normalizeType(item.adjustmentType)));
            const deductionRows = own.filter((item) => normalizeType(item.adjustmentType) === "KESINTI");
            const legalRows = own.filter((item) => ["ICRA", "HACIZ"].includes(normalizeType(item.adjustmentType)));
            const advanceDefault = advanceRows.reduce((sum, item) => sum + number(item.amount), 0);
            const deductionDefault = deductionRows.reduce((sum, item) => sum + number(item.amount), 0);
            const garnishmentDefault = legalRows.reduce((sum, item) => sum + number(item.amount), 0);
            const bankDeductions = [...advanceRows, ...deductionRows, ...legalRows].filter((item) => upper(item.paymentMethod).includes("BANKA")).reduce((sum, item) => sum + number(item.amount), 0);
            const salary = number(override.salaryPay ?? existing?.salary ?? baseSalary);
            const road = number(override.roadPay ?? existing?.road_allowance ?? employee.road_allowance);
            const overtimeFinal = number(override.overtimeAmount ?? overtime);
            const premium = number(override.premiumAmount ?? existing?.premium_amount ?? autoPremium);
            const deduction = number(override.deductionAmount ?? deductionDefault);
            const advance = number(override.advanceAmount ?? advanceDefault);
            const garnishment = number(override.garnishmentAmount ?? garnishmentDefault);
            const calculatedTotal = Math.max(salary + road + overtimeFinal + premium - deduction - advance - garnishment, 0);
            const plannedBank = Math.max(number(employee.bank_amount) - bankDeductions, 0);
            const bank = override.bank !== undefined ? number(override.bank) : Math.min(calculatedTotal, plannedBank);
            const cash = override.cash !== undefined ? number(override.cash) : Math.max(calculatedTotal - bank, 0);
            const total = override.total !== undefined ? number(override.total) : calculatedTotal;
            const timestamp = nowIso();
            const id = text(existing?.id) || crypto.randomUUID();
            await c.env.DB.prepare(`INSERT INTO hr_payrolls_v2 (id,main_company_id,year,month,employee_id,salary,road_allowance,overtime_amount,premium_amount,garnishment_amount,deduction_amount,advance_amount,bank_amount,cash_amount,total_amount,status,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?) ON CONFLICT(main_company_id,year,month,employee_id) DO UPDATE SET salary=excluded.salary,road_allowance=excluded.road_allowance,overtime_amount=excluded.overtime_amount,premium_amount=excluded.premium_amount,garnishment_amount=excluded.garnishment_amount,deduction_amount=excluded.deduction_amount,advance_amount=excluded.advance_amount,bank_amount=excluded.bank_amount,cash_amount=excluded.cash_amount,total_amount=excluded.total_amount,status=excluded.status,updated_at=excluded.updated_at`).bind(id, companyId, year, month, employeeId, salary, road, overtimeFinal, premium, garnishment, deduction, advance, bank, cash, total, "OVERRIDE", text(existing?.created_at) || timestamp, timestamp).run();
            const saved = await first(c, "SELECT * FROM hr_payrolls_v2 WHERE main_company_id=? AND year=? AND month=? AND employee_id=?", [companyId, year, month, employeeId]);
            await audit(c, { mainCompanyId: companyId, period, employeeId, entityType: "BORDRO", action: "OVERRIDE", summary: "Bordro ödeme planı güncellendi.", details: { reason: text(body.reason), premiumAmount: premium, garnishmentAmount: garnishment, bank, cash, total } });
            return okData(c, mapPayroll(saved || { id, main_company_id: companyId, year, month, employee_id: employeeId, salary, road_allowance: road, overtime_amount: overtimeFinal, premium_amount: premium, garnishment_amount: garnishment, deduction_amount: deduction, advance_amount: advance, bank_amount: bank, cash_amount: cash, total_amount: total, status: "OVERRIDE" }));
          }'''
          pattern = re.compile(r'async function saveAdvancedPayrollOverride\(c: Context<AppEnv>\) \{.*?\n\}\n\nasync function auditLogs', re.S)
          w, count = pattern.subn(new_override + '\n\nasync function auditLogs', w, count=1)
          if count != 1:
              raise SystemExit(f'override replacement count={count}')

          worker.write_text(w, encoding='utf-8')

          migration.write_text('''-- IK kesintilerini personel kartindan hareket merkezine tasir.\n-- Mevcut hukuki kesinti kayitlari kaybolmaz; bu aya tek hareket olarak aktarilir.\n\nALTER TABLE hr_monthly_adjustments_v2 ADD COLUMN payment_method TEXT NOT NULL DEFAULT 'Elden';\n\nCREATE INDEX IF NOT EXISTS idx_hr_monthly_adjustments_employee_date_type\n  ON hr_monthly_adjustments_v2(employee_id, date, adjustment_type);\n\nINSERT INTO hr_monthly_adjustments_v2\n  (id, employee_id, date, adjustment_type, hour_or_day, amount, payment_method, payroll_effect, note, status, created_at)\nSELECT lower(hex(randomblob(16))), s.employee_id, date('now','start of month'),\n       CASE WHEN upper(s.legal_deduction_type)='HACIZ' THEN 'Haciz' ELSE 'Icra' END,\n       0, s.garnishment_amount,\n       CASE WHEN upper(s.garnishment_source)='ELDEN' THEN 'Elden' ELSE 'Banka' END,\n       'Bordroya yansir',\n       CASE WHEN trim(COALESCE(s.garnishment_note,''))<>'' THEN s.garnishment_note ELSE 'Personel kartından kesinti merkezine aktarıldı' END,\n       'APPROVED', CURRENT_TIMESTAMP\n  FROM ik_person_card_settings s\n WHERE COALESCE(s.garnishment_active,0)=1\n   AND COALESCE(s.garnishment_amount,0)>0\n   AND upper(COALESCE(s.legal_deduction_type,'YOK')) IN ('ICRA','HACIZ')\n   AND (trim(COALESCE(s.legal_start_period,''))='' OR strftime('%Y-%m','now') >= s.legal_start_period)\n   AND (trim(COALESCE(s.legal_end_period,''))='' OR strftime('%Y-%m','now') <= s.legal_end_period);\n\nUPDATE ik_person_card_settings\n   SET legal_deduction_type='YOK', garnishment_active=0, garnishment_amount=0,\n       garnishment_source='BANKA', legal_start_period='', legal_end_period='', garnishment_note='',\n       updated_at=CURRENT_TIMESTAMP\n WHERE COALESCE(garnishment_active,0)<>0 OR COALESCE(garnishment_amount,0)<>0\n    OR upper(COALESCE(legal_deduction_type,'YOK'))<>'YOK';\n''', encoding='utf-8')

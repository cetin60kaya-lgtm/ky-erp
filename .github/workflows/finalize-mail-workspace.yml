name: Muhasebe Mail Şablonu Son Kontrol

on:
  pull_request:
    paths:
      - "docs/trigger-finalize-mail-workspace.txt"
      - ".github/workflows/finalize-mail-workspace.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Çalışma dalını al
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-tam-yeniden-tasarim
          fetch-depth: 0

      - name: Mail şablonu bağlantısını ve JSX metnini düzelt
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("APP/app/ky-erp-frontend/src/pages/modules/MuhasebePage.jsx")
          text = page.read_text(encoding="utf-8")
          old_import = 'import MailSablonlariPage from "../muhasebe/MailSablonlariPage";'
          new_import = 'import MailTemplatesWorkspace from "./muhasebe/MailTemplatesWorkspace";'
          old_route = 'else if (current.key === "mail-sablonlari") content = <MailSablonlariPage activeMainCompany={activeMainCompany} />;'
          new_route = 'else if (current.key === "mail-sablonlari") content = <MailTemplatesWorkspace activeMainCompany={activeMainCompany} refreshKey={refreshKey} />;'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("Mail şablonu import satırı bulunamadı.")
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit("Mail şablonu rota satırı bulunamadı.")
          page.write_text(text, encoding="utf-8")

          workspace = Path("APP/app/ky-erp-frontend/src/pages/modules/muhasebe/MailTemplatesWorkspace.jsx")
          source = workspace.read_text(encoding="utf-8")
          broken = '<p>Değişkenler: {{"{{firmaAdi}}"}}, {{"{{bakiye}}"}}, {{"{{tarih}}"}}</p>'
          fixed = '<p>Değişkenler: <code>{"{{firmaAdi}}"}</code>, <code>{"{{bakiye}}"}</code>, <code>{"{{tarih}}"}</code></p>'
          if broken in source:
              source = source.replace(broken, fixed, 1)
          workspace.write_text(source, encoding="utf-8")
          PY

      - name: Frontend build ve lint
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Değişikliği kaydet ve geçici akışı kaldır
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/MuhasebePage.jsx APP/app/ky-erp-frontend/src/pages/modules/muhasebe/MailTemplatesWorkspace.jsx
          git rm -f .github/workflows/finalize-mail-workspace.yml docs/trigger-finalize-mail-workspace.txt
          git diff --cached --check
          git commit -m "fix(muhasebe): mail şablonu çalışma alanını doğrula ve bağla"
          git push origin HEAD:codex/muhasebe-tam-yeniden-tasarim

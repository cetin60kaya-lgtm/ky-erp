name: KY ERP Auth Live Inspect

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/auth-live-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live auth endpoints
        shell: bash
        run: |
          set -euo pipefail
          login_status="$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST https://api.kyerp.net/api/auth/login -H 'Content-Type: application/json' --data '{"username":"__probe__","password":"__probe__"}')"
          echo "LOGIN_STATUS=$login_status"
          cat /tmp/login.json
          echo
          test "$login_status" = "401"
          jq -e '.ok == false and .error.code == "INVALID_CREDENTIALS"' /tmp/login.json >/dev/null

          me_status="$(curl -sS -o /tmp/me.json -w '%{http_code}' https://api.kyerp.net/api/auth/me -H 'Authorization: Bearer invalid.token.value')"
          echo "ME_STATUS=$me_status"
          cat /tmp/me.json
          echo
          test "$me_status" = "401"
          jq -e '.ok == false and .error.code == "UNAUTHORIZED"' /tmp/me.json >/dev/null

          site_status="$(curl -L -sS -o /tmp/site.html -w '%{http_code}' https://app.kyerp.net/)"
          echo "SITE_STATUS=$site_status"
          test "$site_status" = "200"
          grep -q '<title>KY ERP</title>' /tmp/site.html

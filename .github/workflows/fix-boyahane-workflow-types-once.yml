name: Boyahane İş Motoru Tip Düzeltme Tek Sefer

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/fix-boyahane-workflow-types-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
      - name: Geniş JSON dönüş tiplerini açıkla
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('APP/cloud/ky-erp-api/src/boyahane-workflow.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'async function jobView(c: Context<AppEnv>, job: Row, slug: string) {',
              'async function jobView(c: Context<AppEnv>, job: Row, slug: string): Promise<Row> {'
          )
          text = text.replace(
              'function recipeView(row: Row) {',
              'function recipeView(row: Row): Row {'
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-boyahane-workflow-types-once.yml').unlink()
          PY
      - name: Düzeltmeyi kaydet ve geçici akışı kaldır
        run: |
          git config user.name "kyerp-ci"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/boyahane-workflow.ts .github/workflows/fix-boyahane-workflow-types-once.yml
          git commit -m "fix(boyahane): iş ve reçete dönüş tiplerini açıklaştır"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

name: KY ERP Worker Canli Yayin

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - RELEASES/kyerp-worker-production-release.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-worker-production-release
  cancel-in-progress: false

jobs:
  release-worker:
    name: Worker test, D1 yedek, schema, deploy ve canli dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      DB_NAME: ky-erp-db
      WORKER_DIR: APP/cloud/ky-erp-api
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Worker release kaydini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PROD_BRANCH"
          test -f RELEASES/kyerp-worker-production-release.json
          jq -e '.approved == true and .target == "production" and .component == "worker" and .sourceBranch == "codex/model-uretim-kontrol-merkezi-final"' RELEASES/kyerp-worker-production-release.json >/dev/null
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN eksik" >&2; exit 1; }
          echo "RELEASE_SHA=$GITHUB_SHA"

      - name: Worker paketleri, typecheck, test ve build
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Cloudflare production erisimini dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Canli D1 tam yedegini al
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          output="database-backup/ky-erp-db-before-worker-${stamp}.sql"
          npx wrangler d1 export "$DB_NAME" --remote --config wrangler.jsonc --skip-confirmation --output "$output"
          test -s "$output"
          echo "D1_BACKUP=$output" >> "$GITHUB_ENV"

      - name: D1 yedegini artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ky-erp-worker-production-backup-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 30

      # 0062, diger production migrationlardan tamamen ayridir.
      # Onayli 0062 release bayragi disinda migration calistirilamaz.
      - name: 0062 fiziksel journal icin tek-hedef user onay kapisi
        id: physical_0062_gate
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.applyPhysical0062 == true' RELEASES/kyerp-worker-production-release.json >/dev/null; then
            jq -e '.approved == true and .target == "production" and .component == "worker"
              and .sourceBranch == "codex/model-uretim-kontrol-merkezi-final"
              and .migrationApprovedByUser == true and .approvedMigrationId == "0062"
              and .applyMigrations == false' RELEASES/kyerp-worker-production-release.json >/dev/null || {
                echo "0062 hedefli migration onayi eksik veya baska migration da acik." >&2; exit 1;
              }
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sadece 0062 D1 fiziksel journal migration ve salt-okunur kanit
        if: steps.physical_0062_gate.outputs.apply == 'true'
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          migration=migrations/0062_accounting_physical_receipt_journal.sql
          test -f "$migration"
          test -n "${D1_BACKUP:-}" && test -s "$D1_BACKUP" || {
            echo "Canli D1 export yedegi bulunamadi; 0062 kesinlikle uygulanmayacak." >&2; exit 1;
          }
          # Yalniz CREATE TABLE/INDEX/TRIGGER; mevcut tablo veya satirlar degistirilemez.
          ! grep -Eiq '^[[:space:]]*(DROP|DELETE|UPDATE|INSERT|ALTER|REPLACE|TRUNCATE)[[:space:]]' "$migration"
          before="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command             "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('accounting_physical_operations','accounting_provisional_reconciliations')) AS journal_tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('json_store','stock_movements','accounting_documents','accounting_document_lines')) AS prerequisites;" --json)"
          jq -e '.[0].results[0].prerequisites == 4' <<<"$before" >/dev/null || {
            echo "0062 on kosul tablolari eksik; migration yapilmadi." >&2; exit 1;
          }
          existing="$(jq -r '.[0].results[0].journal_tables' <<<"$before")"
          case "$existing" in
            0)
              echo "0062 uygulanacak; yedek artifact kaydedildi, onceki journal tablosu yok."
              npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "$migration" --yes
              ;;
            2)
              echo "0062 tabloları zaten mevcut; yazma yapilmadan salt-okunur dogrulanacak."
              ;;
            *)
              echo "0062 kismi sema goruldu ($existing/2); otomatik degisiklik YASAK." >&2; exit 1
              ;;
          esac
          after="$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command             "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('accounting_physical_operations','accounting_provisional_reconciliations')) AS journal_tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('ix_accounting_physical_operations_recovery','ix_accounting_physical_operations_document','ix_accounting_physical_operations_source','ix_accounting_provisional_reconciliations_dispatch')) AS journal_indexes, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_accounting_physical_cost_capacity') AS capacity_trigger, (SELECT COUNT(*) FROM pragma_table_info('accounting_physical_operations') WHERE name IN ('id','main_company_slug','payload_hash','lease_token','lease_until','state','attempts')) AS required_columns, (SELECT COUNT(*) FROM accounting_physical_operations) AS journal_rows, (SELECT COUNT(*) FROM accounting_provisional_reconciliations) AS reconciliation_rows;" --json)"
          jq -e '.[0].results[0] | .journal_tables == 2 and .journal_indexes == 4 and .capacity_trigger == 1 and .required_columns == 7 and .journal_rows == 0 and .reconciliation_rows == 0' <<<"$after" >/dev/null || {
            echo "0062 sema kaniti eksik veya journal tablolarinda beklenmeyen satirlar var. Otomatik devam YASAK." >&2; exit 1;
          }
          echo "0062 tek hedef production D1 schema kabul: 2 tablo, 4 index, 1 trigger, 7 alan, yeni kayit yok."

      # Normal kod sürümü production D1 migration izni sayılmaz.
      # Eski release markerlar dahil varsayilan olarak tum mutasyonlu migration adimlari kapali.
      - name: Production migration icin ayri izin kapisi
        id: migration_gate
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.applyMigrations == true and .migrationApprovedByUser == true' RELEASES/kyerp-worker-production-release.json >/dev/null; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Production migration icin ek izin kaydi mevcut."
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Migration uygulanmayacak: salt kod release / sadece D1 yedegi ve schema okuma."
          fi

      - name: Mail ve muhasebe canonical schema migrationlarini uygula
        if: steps.migration_gate.outputs.apply == 'true'
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            migrations/0050_mail_communication_core.sql \
            migrations/0051_mail_workspace_user_state.sql \
            migrations/0055_accounting_workspace_core.sql; do
            test -f "$migration"
            echo "Uygulaniyor: $migration"
            npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "$migration" --yes
          done

          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('mail_accounts','mail_send_jobs','mail_message_user_state','accounting_live_revision','accounting_financial_accounts','accounting_reconciliations') ORDER BY name;" --json > /tmp/kyerp-schema-proof.json
          cat /tmp/kyerp-schema-proof.json
          for required in mail_accounts mail_send_jobs mail_message_user_state accounting_live_revision accounting_financial_accounts accounting_reconciliations; do
            grep -q "\"$required\"" /tmp/kyerp-schema-proof.json || { echo "Eksik production tablosu: $required" >&2; exit 1; }
          done

      - name: Personel 0060 icin canli D1 on kosul dogrulamasi
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          # Bu adimdan once tam D1 yedegi Actions artifact olarak saklanmis olmalidir.
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_users','auth_user_security','auth_sessions','auth_security_audit','main_companies','hr_monthly_employees','ik_person_card_settings','ik_time_clock_events','hr_leave_records_v2','ik_leave_plans','json_store','machine_shift_defaults','model_records','production_records','model_production_links') ORDER BY name;" \
            --json > /tmp/kyerp-0060-prerequisite.json
          for required in auth_users auth_user_security auth_sessions auth_security_audit main_companies hr_monthly_employees ik_person_card_settings ik_time_clock_events hr_leave_records_v2 ik_leave_plans json_store machine_shift_defaults model_records production_records model_production_links; do
            grep -q "\"$required\"" /tmp/kyerp-0060-prerequisite.json || { echo "0060 ON KOSUL EKSIGI: $required" >&2; exit 1; }
          done

      - name: Personel 0060 hedefli eklemeli D1 migration
        if: steps.migration_gate.outputs.apply == 'true'
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          migration=migrations/0060_employee_portal_access.sql
          test -f "$migration"
          ! grep -Eiq '(^|[[:space:]])(DROP[[:space:]]+TABLE|DELETE[[:space:]]+FROM|TRUNCATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE)' "$migration"
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "$migration" --yes
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('ky_employee_portal_accounts','ky_employee_portal_devices','ky_employee_portal_approvers','ky_employee_portal_nonces') ORDER BY name;" \
            --json > /tmp/kyerp-0060-proof.json
          for required in ky_employee_portal_accounts ky_employee_portal_devices ky_employee_portal_approvers ky_employee_portal_nonces; do
            grep -q "\"$required\"" /tmp/kyerp-0060-proof.json || { echo "0060 TABLO KANITI EKSIGI: $required" >&2; exit 1; }
          done

      - name: Gunluk Operasyon 0061 ek odeme kesinti D1 migration ve kanit
        if: steps.migration_gate.outputs.apply == 'true'
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          migration=migrations/0061_hr_daily_payment_adjustments.sql
          test -f "$migration"
          ! grep -Eiq '(^|[[:space:]])(DROP[[:space:]]+TABLE|DELETE[[:space:]]+FROM|TRUNCATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE)' "$migration"
          # Mevcut personel, ödeme ledger'ı ve senkron şeması zorunludur.
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('hr_daily_employees','hr_daily_payments','hr_daily_payment_items','hr_daily_sync_state','hr_daily_operation_audit') ORDER BY name;" \
            --json > /tmp/kyerp-0061-prereq.json
          for required in hr_daily_employees hr_daily_payments hr_daily_payment_items hr_daily_sync_state hr_daily_operation_audit; do
            grep -q "\"$required\"" /tmp/kyerp-0061-prereq.json || { echo "0061 ON KOSUL EKSIGI: $required" >&2; exit 1; }
          done
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --file "$migration" --yes
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type IN ('table','trigger') AND name IN ('hr_daily_payment_adjustments','hr_daily_payment_adjustment_snapshots','trg_daily_adjustment_prevent_after_paid','trg_daily_adjustment_snapshot_no_update','trg_daily_adjustment_sync_insert') ORDER BY name;" \
            --json > /tmp/kyerp-0061-proof.json
          for required in hr_daily_payment_adjustments hr_daily_payment_adjustment_snapshots trg_daily_adjustment_prevent_after_paid trg_daily_adjustment_snapshot_no_update trg_daily_adjustment_sync_insert; do
            grep -q "\"$required\"" /tmp/kyerp-0061-proof.json || { echo "0061 CANLI SEMASI EKSIK: $required" >&2; exit 1; }
          done

      - name: Canli D1 hedefli salt okunur schema dogrulamasi
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.jsonc --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('main_companies','accounting_documents','accounting_document_lines','accounting_document_issues') ORDER BY name;" --json > /tmp/kyerp-ebelge-schema-proof.json
          for required in main_companies accounting_documents accounting_document_lines accounting_document_issues; do
            grep -q "\"$required\"" /tmp/kyerp-ebelge-schema-proof.json || { echo "E-BELGE SCHEMA BLOKER: $required" >&2; exit 1; }
          done

      - name: Worker'i api.kyerp.net adresine dagit
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Canli API saglik kontrolu
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 https://api.kyerp.net/api/health > /tmp/kyerp-health.json; then
              cat /tmp/kyerp-health.json
              exit 0
            fi
            echo "Canli API henuz hazir degil; deneme $attempt/6"
            sleep 5
          done
          echo "Canli API saglik kontrolu basarisiz." >&2
          exit 1

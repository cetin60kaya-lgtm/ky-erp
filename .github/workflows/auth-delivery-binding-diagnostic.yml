name: KY ERP Auth Delivery Binding Diagnostic

on:
  push:
    branches:
      - codex/auth-policy-owner-recovery
    paths:
      - ".github/workflows/auth-delivery-binding-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List only Worker secret names
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 secret list --name ky-erp-api | jq -r '.[]?.name' | sort

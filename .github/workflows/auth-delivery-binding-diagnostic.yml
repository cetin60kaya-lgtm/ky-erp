name: KY ERP Auth Delivery Binding Diagnostic

on:
  push:
    branches:
      - codex/auth-policy-owner-recovery
    paths:
      - ".github/workflows/auth-delivery-binding-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List only Worker binding names and types
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ]; then
            accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
            account_id="$(jq -r '.result[0].id // empty' <<<"$accounts")"
          fi
          test -n "$account_id"
          settings="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts/ky-erp-api/settings")"
          jq -r '.result.bindings[]? | [.name, .type] | @tsv' <<<"$settings" | sort

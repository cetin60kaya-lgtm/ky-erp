name: KYERP Daily Payments Final Clean TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payments-final-clean-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyerp-daily-payments-final-clean
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply canonical payment source
        run: |
          set -euo pipefail
          TEST_FILE='APP/app/ky-erp-frontend/src/styles/canonical-workspace-ui.test.js'
          git show 642a53899615d5ed9761ab3db8d76c34c3594d67:"$TEST_FILE" > "$TEST_FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('APP/app/ky-erp-frontend/src/styles/canonical-workspace-ui.test.js')
          s = p.read_text(encoding='utf-8')
          old = 'assert.match(registry, /\\["daily-payments", "Ödeme Fişleri", "odemeler"\\]/);'
          new = 'assert.match(registry, /\\["daily-payments", "Ödemeler", "odemeler"\\]/);'
          if s.count(old) != 1:
              raise SystemExit(f'canonical payment test anchor expected once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/daily_payments_final_clean_temp.py
          git diff --check
          grep -q 'm.personnel_no,e.full_name,e.qualification' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'LEFT JOIN hr_daily_employee_meta m ON m.employee_id=e.id' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          ! grep -q 'e.personnel_no,e.full_name,e.qualification' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          test -f APP/cloud/ky-erp-api/migrations/0056_hr_daily_payment_ledger.sql
          grep -q '\["daily-payments", "Ödemeler", "odemeler"\]' APP/app/ky-erp-frontend/src/app/moduleRegistry.js
          grep -q 'daily-payments.*Ödemeler.*odemeler' "$TEST_FILE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate API
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Validate frontend
        working-directory: APP/app/ky-erp-frontend
        run: |
          set +e
          ci_rc=0; lint_rc=99; test_rc=99; build_rc=99
          npm ci > /tmp/daily-payments-frontend-final.log 2>&1
          ci_rc=$?
          if [ "$ci_rc" -eq 0 ]; then
            npm run lint >> /tmp/daily-payments-frontend-final.log 2>&1
            lint_rc=$?
          fi
          if [ "$ci_rc" -eq 0 ] && [ "$lint_rc" -eq 0 ]; then
            npm test >> /tmp/daily-payments-frontend-final.log 2>&1
            test_rc=$?
          fi
          if [ "$ci_rc" -eq 0 ] && [ "$lint_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            npm run build >> /tmp/daily-payments-frontend-final.log 2>&1
            build_rc=$?
          fi
          if [ "$ci_rc" -ne 0 ] || [ "$lint_rc" -ne 0 ] || [ "$test_rc" -ne 0 ] || [ "$build_rc" -ne 0 ]; then
            cd ../../..
            {
              echo "ci_rc=$ci_rc lint_rc=$lint_rc test_rc=$test_rc build_rc=$build_rc"
              grep -n -B 16 -A 32 '^not ok\|AssertionError\|ERR_ASSERTION\|error:' /tmp/daily-payments-frontend-final.log | tail -n 280 || true
              echo '--- tail ---'
              tail -n 220 /tmp/daily-payments-frontend-final.log
            } > .github/daily_payments_final_frontend_error.txt
            git config user.name "kyerp-production-bot"
            git config user.email "kyerp-production-bot@users.noreply.github.com"
            git add .github/daily_payments_final_frontend_error.txt
            git commit -m "chore: capture daily payment final frontend diagnostic" || true
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
            exit 1
          fi
          exit 0

      - name: Ensure canonical payment schema in production D1
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --file migrations/0056_hr_daily_payment_ledger.sql
          npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "SELECT a.id AS attendance_id, m.personnel_no, e.full_name FROM hr_daily_attendance a JOIN hr_daily_employees e ON e.id=a.employee_id LEFT JOIN hr_daily_employee_meta m ON m.employee_id=e.id LEFT JOIN hr_daily_attendance_check cd ON cd.main_company_id=e.main_company_id AND cd.employee_id=a.employee_id AND cd.work_date=a.work_date AND cd.shift='day' LEFT JOIN hr_daily_attendance_check cn ON cn.main_company_id=e.main_company_id AND cn.employee_id=a.employee_id AND cn.work_date=a.work_date AND cn.shift='night' WHERE (a.day_shift=1 OR a.night_shift=1) LIMIT 1;"
          npx --yes wrangler@4.119.0 d1 execute ky-erp-db --remote --command "SELECT COUNT(*) AS payment_table_ok FROM hr_daily_payments; SELECT COUNT(*) AS payment_item_table_ok FROM hr_daily_payment_items;"

      - name: Commit canonical source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/daily_payments_final_frontend_error.txt || true
          git add \
            APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts \
            APP/cloud/ky-erp-api/migrations/0056_hr_daily_payment_ledger.sql \
            APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx \
            APP/app/ky-erp-frontend/src/app/moduleRegistry.js \
            APP/app/ky-erp-frontend/src/styles/canonical-workspace-ui.test.js
          git commit -m "fix(daily): finalize canonical payment ledger"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

      - name: Deploy API Worker
        working-directory: APP/cloud/ky-erp-api
        run: npx --yes wrangler@4.119.0 deploy

      - name: Deploy frontend
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git rev-parse HEAD)"

      - name: Production smoke
        run: |
          set -euo pipefail
          api_ok=0
          for url in https://api.kyerp.net/health https://api.kyerp.net/api/health; do
            code="$(curl -sS -L -o /tmp/api.html -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then api_ok=1; break; fi
          done
          test "$api_ok" = 1
          for path in /gunluk-operasyon/daily-dashboard /gunluk-operasyon/daily-payments /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-weekly; do
            ok=0
            for i in {1..12}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1
          done

      - name: Remove temporary deployment helpers
        if: success()
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/daily-payments-final-clean-temp.yml \
            .github/scripts/daily_payments_final_clean_temp.py \
            .github/workflows/daily-payments-polish-temp.yml \
            .github/scripts/daily_payments_polish_temp.py \
            .github/payment_polish_error.txt \
            .github/payment_polish_source.txt \
            .github/daily-payments-schema-diagnostic.txt \
            .github/daily_payments_final_frontend_error.txt \
            .github/workflows/daily-payments-schema-diagnostic-temp.yml \
            .github/workflows/daily-payments-runtime-schema-fix-temp.yml \
            .github/scripts/daily_payments_runtime_schema_fix_temp.py || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove daily payment deployment helpers"
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

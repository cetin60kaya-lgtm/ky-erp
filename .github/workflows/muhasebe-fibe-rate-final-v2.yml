name: Muhasebe FIBE Rate Final V2

on:
  push:
    branches:
      - codex/muhasebe-fibe-cari-final
    paths:
      - docs/muhasebe-fibe-rate-final-v2-trigger.txt

permissions:
  contents: write

jobs:
  final-rate-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-fibe-cari-final
          fetch-depth: 0

      - name: FIBE oran gecmisi ve haftalik bakiye patchi
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('APP/cloud/ky-erp-api/src/accounting-company-profile.ts')
          s = p.read_text(encoding='utf-8-sig')
          helper_anchor = 'function roleOf(row: Row) {'
          helper = '''async function fibeIncomingVatTotal(\n  c: Context<AppEnv>,\n  slug: string,\n  companyId: string,\n  startDate: string,\n  beforeDate = "",\n) {\n  if (!startDate) return 0;\n  const beforeClause = beforeDate ? " AND substr(CAST(date AS TEXT),1,10) < ?" : "";\n  const statement = c.env.DB.prepare(\n    `SELECT COALESCE(SUM(COALESCE(incoming_vat,0)),0) AS total\n       FROM vat_records\n      WHERE main_company_slug=?\n        AND COALESCE(NULLIF(company_id,''),firm_id)=?\n        AND substr(CAST(date AS TEXT),1,10) >= ?${beforeClause}`,\n  );\n  const row = beforeDate\n    ? await statement.bind(slug, companyId, startDate, beforeDate).first<Row>()\n    : await statement.bind(slug, companyId, startDate).first<Row>();\n  return numberValue(row?.total, 0);\n}\n\nasync function fibeMovementCount(c: Context<AppEnv>, slug: string, companyId: string) {\n  const exists = await c.env.DB.prepare(\n    "SELECT name FROM sqlite_master WHERE type='table' AND name='accounting_fibe_movements' LIMIT 1",\n  ).first<Row>();\n  if (!exists?.name) return 0;\n  const row = await c.env.DB.prepare(\n    `SELECT COUNT(*) AS total FROM accounting_fibe_movements\n      WHERE main_company_slug=? AND company_id=? AND deleted_at IS NULL`,\n  ).bind(slug, companyId).first<Row>();\n  return Number(row?.total || 0);\n}\n\nfunction roleOf(row: Row) {'''
          if 'async function fibeIncomingVatTotal(' not in s:
              if helper_anchor not in s: raise SystemExit('profile helper anchor yok')
              s = s.replace(helper_anchor, helper, 1)

          old = '''    const fibeEnabled = bool(body.fibeEnabled, Number(row.fibe_enabled || 0) === 1);\n    const fibeRate = numberValue(body.fibeRate, Number(row.fibe_rate || 0));\n    if (fibeRate < 0 || fibeRate > 100) {\n      return c.json(errorBody("INVALID_FIBE_RATE", "FİBE oranı 0 ile 100 arasında olmalıdır."), 400);\n    }\n    const requestedFibeStartDate = body.fibeStartDate === undefined\n      ? text(row.fibe_start_date)\n      : text(body.fibeStartDate);\n    const fibeStartDate = requestedFibeStartDate || (fibeEnabled ? nowIso().slice(0, 10) : "");\n    if (!validDate(fibeStartDate)) {\n      return c.json(errorBody("INVALID_FIBE_START_DATE", "FİBE başlangıç tarihi YYYY-AA-GG formatında olmalıdır."), 400);\n    }\n    const fibeOpeningAccrual = numberValue(body.fibeOpeningAccrual, Number(row.fibe_opening_accrual || 0));\n    const fibeOpeningPaid = numberValue(body.fibeOpeningPaid, Number(row.fibe_opening_paid || 0));\n    if (fibeOpeningAccrual < 0 || fibeOpeningPaid < 0) {\n      return c.json(errorBody("INVALID_FIBE_OPENING", "FİBE başlangıç hakedişi ve ödeneni negatif olamaz."), 400);\n    }'''
          new = '''    const oldFibeEnabled = Number(row.fibe_enabled || 0) === 1;\n    const oldFibeRate = numberValue(row.fibe_rate, 0);\n    const oldFibeStartDate = text(row.fibe_start_date);\n    const fibeEnabled = bool(body.fibeEnabled, oldFibeEnabled);\n    const fibeRate = numberValue(body.fibeRate, oldFibeRate);\n    if (fibeRate < 0 || fibeRate > 100) {\n      return c.json(errorBody("INVALID_FIBE_RATE", "FİBE oranı 0 ile 100 arasında olmalıdır."), 400);\n    }\n    const requestedFibeStartDate = body.fibeStartDate === undefined ? oldFibeStartDate : text(body.fibeStartDate);\n    let fibeStartDate = requestedFibeStartDate || (fibeEnabled ? nowIso().slice(0, 10) : "");\n    if (!validDate(fibeStartDate)) {\n      return c.json(errorBody("INVALID_FIBE_START_DATE", "FİBE başlangıç tarihi YYYY-AA-GG formatında olmalıdır."), 400);\n    }\n    let fibeOpeningAccrual = numberValue(body.fibeOpeningAccrual, Number(row.fibe_opening_accrual || 0));\n    const fibeOpeningPaid = numberValue(body.fibeOpeningPaid, Number(row.fibe_opening_paid || 0));\n    if (fibeOpeningAccrual < 0 || fibeOpeningPaid < 0) {\n      return c.json(errorBody("INVALID_FIBE_OPENING", "FİBE başlangıç hakedişi ve ödeneni negatif olamaz."), 400);\n    }\n    const rateChanged = oldFibeEnabled && fibeEnabled && Math.abs(fibeRate - oldFibeRate) > 0.000001;\n    if (rateChanged) {\n      const effectiveDate = nowIso().slice(0, 10);\n      if (oldFibeStartDate && oldFibeStartDate < effectiveDate) {\n        const previousVat = await fibeIncomingVatTotal(c, slug, text(row.id), oldFibeStartDate, effectiveDate);\n        const frozenAccrual = Math.round((previousVat * oldFibeRate / 100 + Number.EPSILON) * 100) / 100;\n        fibeOpeningAccrual = Math.round((fibeOpeningAccrual + frozenAccrual + Number.EPSILON) * 100) / 100;\n      }\n      fibeStartDate = effectiveDate;\n    } else if (oldFibeEnabled && fibeEnabled && oldFibeStartDate && fibeStartDate !== oldFibeStartDate) {\n      const [referenceVat, movementCount] = await Promise.all([\n        fibeIncomingVatTotal(c, slug, text(row.id), oldFibeStartDate),\n        fibeMovementCount(c, slug, text(row.id)),\n      ]);\n      const hasHistory = referenceVat > 0 || movementCount > 0 || Number(row.fibe_opening_accrual || 0) > 0 || Number(row.fibe_opening_paid || 0) > 0;\n      if (hasHistory) {\n        return c.json(errorBody("FIBE_START_DATE_LOCKED", "FİBE hareketi başladıktan sonra başlangıç tarihi geriye dönük değiştirilemez. Oran değişikliği yeni dönem olarak otomatik başlatılır."), 409);\n      }\n    }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const oldFibeEnabled =' not in s:
              raise SystemExit('profile FIBE block yok')
          p.write_text(s, encoding='utf-8')

          q = Path('APP/cloud/ky-erp-api/src/accounting-quick-control.ts')
          t = q.read_text(encoding='utf-8-sig')
          anchor = '''async function companyBalance(c: Context<AppEnv>, slug: string, companyId: string) {'''
          helper2 = '''async function totalFibeRemaining(c: Context<AppEnv>, slug: string) {\n  if (!(await tableExists(c, "accounting_fibe_movements"))) return 0;\n  const row = await c.env.DB.prepare(\n    `SELECT COALESCE(SUM(CASE WHEN balance > 0 THEN balance ELSE 0 END),0) AS total\n       FROM (\n         SELECT\n           COALESCE(c.fibe_opening_accrual,0)\n           + COALESCE((\n               SELECT SUM(COALESCE(v.incoming_vat,0))\n                 FROM vat_records v\n                WHERE v.main_company_slug=c.main_company_slug\n                  AND COALESCE(NULLIF(v.company_id,''),v.firm_id)=c.id\n                  AND substr(CAST(v.date AS TEXT),1,10) >= COALESCE(NULLIF(c.fibe_start_date,''),'9999-12-31')\n             ),0) * COALESCE(c.fibe_rate,0) / 100.0\n           + COALESCE((\n               SELECT SUM(CASE UPPER(COALESCE(f.movement_type,''))\n                 WHEN 'ACCRUAL' THEN COALESCE(f.amount,0)\n                 WHEN 'ACCRUAL_REVERSAL' THEN -COALESCE(f.amount,0)\n                 ELSE 0 END)\n                 FROM accounting_fibe_movements f\n                WHERE f.main_company_slug=c.main_company_slug AND f.company_id=c.id AND f.deleted_at IS NULL\n             ),0)\n           - COALESCE(c.fibe_opening_paid,0)\n           - COALESCE((\n               SELECT SUM(CASE UPPER(COALESCE(f.movement_type,''))\n                 WHEN 'PAYMENT' THEN COALESCE(f.amount,0)\n                 WHEN 'PAYMENT_REVERSAL' THEN -COALESCE(f.amount,0)\n                 ELSE 0 END)\n                 FROM accounting_fibe_movements f\n                WHERE f.main_company_slug=c.main_company_slug AND f.company_id=c.id AND f.deleted_at IS NULL\n             ),0) AS balance\n         FROM companies c\n        WHERE c.main_company_slug=? AND c.deleted_at IS NULL AND COALESCE(c.fibe_enabled,0)=1\n       )`,\n  ).bind(slug).first<Row>();\n  return roundMoney(row?.total);\n}\n\nasync function companyBalance(c: Context<AppEnv>, slug: string, companyId: string) {'''
          if 'async function totalFibeRemaining(' not in t:
              if anchor not in t: raise SystemExit('quick helper anchor yok')
              t = t.replace(anchor, helper2, 1)
          before_return = '''    const internalFlow = allMovements\n      .filter((row) => row.recordScope === "INTERNAL")\n      .reduce((sum, row) => sum + row.amount, 0);\n\n    return c.json({'''
          with_fibe = '''    const internalFlow = allMovements\n      .filter((row) => row.recordScope === "INTERNAL")\n      .reduce((sum, row) => sum + row.amount, 0);\n    const fibeRemaining = await totalFibeRemaining(c, slug);\n\n    return c.json({'''
          if 'const fibeRemaining = await totalFibeRemaining' not in t:
              if before_return not in t: raise SystemExit('weekly return anchor yok')
              t = t.replace(before_return, with_fibe, 1)
          summary_anchor = '''          internalFlow: roundMoney(internalFlow),\n        },'''
          summary_new = '''          internalFlow: roundMoney(internalFlow),\n          fibeRemaining: roundMoney(fibeRemaining),\n        },'''
          if 'fibeRemaining: roundMoney(fibeRemaining)' not in t:
              if summary_anchor not in t: raise SystemExit('summary anchor yok')
              t = t.replace(summary_anchor, summary_new, 1)
          q.write_text(t, encoding='utf-8')

          ui = Path('APP/app/ky-erp-frontend/src/pages/modules/muhasebe/QuickAccountingBar.jsx')
          u = ui.read_text(encoding='utf-8-sig')
          card_anchor = '''            <div><span>Elden çıkan</span><strong>{money(week.summary?.cashOutgoing)}</strong></div>'''
          card_new = card_anchor + '''\n            <div><span>FİBE kalan</span><strong>{money(week.summary?.fibeRemaining)}</strong></div>'''
          if 'week.summary?.fibeRemaining' not in u:
              if card_anchor not in u: raise SystemExit('FIBE summary card anchor yok')
              u = u.replace(card_anchor, card_new, 1)
          ui.write_text(u, encoding='utf-8')

          seed = Path('APP/cloud/ky-erp-api/local-accounting-quick-smoke-seed.sql')
          z = seed.read_text(encoding='utf-8-sig')
          vat_anchor = 'INSERT OR REPLACE INTO payment_control_records('
          extra = '''INSERT OR REPLACE INTO vat_records(\n  id,main_company_slug,company_id,firm_id,document_id,date,period_month,period_year,\n  incoming_vat,outgoing_vat,carry_vat,raw,created_at,updated_at\n) VALUES(\n  'smoke-vat-rate-day','mecit-hakan','company-isnet-customer','company-isnet-customer','smoke-doc-2','2026-09-03',9,2026,\n  1000,0,0,'{}','2026-09-03T08:00:00.000Z','2026-09-03T08:00:00.000Z'\n);\n\nINSERT OR REPLACE INTO payment_control_records('''
          if 'smoke-vat-rate-day' not in z:
              if vat_anchor not in z: raise SystemExit('seed anchor yok')
              z = z.replace(vat_anchor, extra, 1)
          seed.write_text(z, encoding='utf-8')
          PY

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Worker typecheck ve build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Tum muhasebe ve oran gecmisi smoke
        working-directory: APP/cloud/ky-erp-api
        run: |
          rm -rf .local-fibe-rate-v2
          for sql in local-accounting-quick-smoke.sql migrations/0040_accounting_fibe_company_tracking.sql local-accounting-quick-smoke-seed.sql; do
            npx wrangler d1 execute ky-erp-production-local --local --config wrangler.production-local.jsonc --persist-to .local-fibe-rate-v2 --file "$sql"
          done
          nohup npx wrangler dev --local --config wrangler.production-local.jsonc --persist-to .local-fibe-rate-v2 --port 8795 > /tmp/kyerp-fibe-rate-v2.log 2>&1 &
          for attempt in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:8795/api/health >/dev/null; then break; fi; sleep 1; done
          curl --fail --silent 'http://127.0.0.1:8795/api/muhasebe/hizli-cari/hafta?mainCompanySlug=mecit-hakan&from=2026-09-01&to=2026-09-07' | jq -e '.ok == true and .data.summary.normalReceivable == 12000 and .data.summary.fibeRemaining == 300'
          curl --fail --silent -X PATCH -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","fibeEnabled":true,"fibeRate":8,"fibeStartDate":"2026-08-01","fibeOpeningAccrual":0,"fibeOpeningPaid":0}' 'http://127.0.0.1:8795/api/muhasebe/firma-profilleri/company-isnet-customer' | jq -e '.ok == true and .data.fibeRate == 8 and .data.fibeStartDate == "2026-09-03" and .data.fibeOpeningAccrual == 200'
          curl --fail --silent 'http://127.0.0.1:8795/api/muhasebe/fibe/company-isnet-customer?mainCompanySlug=mecit-hakan' | jq -e '.data.summary.totalAccrual == 280 and .data.summary.remainingBalance == 280'
          STATUS=$(curl --silent -o /tmp/fibe-lock-v2.json -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","fibeStartDate":"2026-08-01"}' 'http://127.0.0.1:8795/api/muhasebe/firma-profilleri/company-isnet-customer')
          test "$STATUS" = "409"
          jq -e '.error.code == "FIBE_START_DATE_LOCKED"' /tmp/fibe-lock-v2.json
          curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","movementType":"PAYMENT","date":"2026-09-03","amount":50,"paymentMethod":"CASH"}' 'http://127.0.0.1:8795/api/muhasebe/fibe/company-isnet-customer/hareketler' | jq -e '.data.summary.remainingBalance == 230'
          curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","transactionType":"COLLECTION","amount":2000,"date":"2026-09-03","paymentMethod":"CASH","recordType":"GAYRI_RESMI"}' 'http://127.0.0.1:8795/api/muhasebe/hizli-cari/hareket' | jq -e '.data.balanceAfter == 10000'
          curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","checkDirection":"RECEIVED","amount":1500,"workType":"OFFICIAL","date":"2026-09-03"}' 'http://127.0.0.1:8795/api/muhasebe/hizli-cari/cek/smoke-check-received/kapat' | jq -e '.data.balanceAfter == 8500 and .data.idempotent == false'
          curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","checkDirection":"RECEIVED","amount":1500,"workType":"OFFICIAL","date":"2026-09-03"}' 'http://127.0.0.1:8795/api/muhasebe/hizli-cari/cek/smoke-check-received/kapat' | jq -e '.data.idempotent == true'
          curl --fail --silent 'http://127.0.0.1:8795/api/muhasebe/hizli-cari/hafta?mainCompanySlug=mecit-hakan&from=2026-09-01&to=2026-09-07' | jq -e '.data.summary.normalReceivable == 8500 and .data.summary.fibeRemaining == 230 and .data.summary.cashOutgoing == 50'

      - name: Frontend lint ve build
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Production ancestry ve diff
        run: |
          git fetch origin codex/model-uretim-kontrol-merkezi-final
          git merge-base --is-ancestor origin/codex/model-uretim-kontrol-merkezi-final HEAD
          git diff --check

      - name: Final degisiklikleri kaydet
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/accounting-company-profile.ts \
                  APP/cloud/ky-erp-api/src/accounting-quick-control.ts \
                  APP/cloud/ky-erp-api/local-accounting-quick-smoke-seed.sql \
                  APP/app/ky-erp-frontend/src/pages/modules/muhasebe/QuickAccountingBar.jsx
          git rm -f .github/workflows/muhasebe-fibe-rate-final.yml docs/muhasebe-fibe-rate-final-trigger.txt \
                    .github/workflows/muhasebe-fibe-rate-final-v2.yml docs/muhasebe-fibe-rate-final-v2-trigger.txt
          git commit -m "fix(accounting): preserve FIBE rate history and weekly remaining"
          git push origin HEAD:codex/muhasebe-fibe-cari-final

      - name: Hata logu
        if: failure()
        run: cat /tmp/kyerp-fibe-rate-v2.log 2>/dev/null || true

name: Daily Operations Management UI

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-operations-management-ui-temp.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      FRONTEND_DIR: APP/app/ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Apply management UI patch
        run: |
          set -euo pipefail
          python .github/scripts/daily_operations_management_ui.py
          python - <<'PY'
          from pathlib import Path
          p = Path('APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx')
          t = p.read_text(encoding='utf-8')
          old = '''  const filteredEmployees = useMemo(() => {\n    const needle = query.trim().toLocaleLowerCase("tr-TR");\n    return employees.filter((person) => !needle || `${person.name} ${person.personnelNo} ${person.role} ${person.broker}`.toLocaleLowerCase("tr-TR").includes(needle));\n  }, [employees, query]);\n'''
          if old not in t:
              raise SystemExit('filteredEmployees cleanup marker missing')
          t = t.replace(old, '', 1)
          t = t.replace('const [query, setQuery] = useState("");', 'const [query] = useState("");', 1)
          t = t.replace('''  const paymentSettled = (row) => {\n    const total = number(row.totalAmount ?? row.total);\n    return rowPaid(row) || (total > 0 && number(row.paidAmount) >= total);\n  };\n  const visiblePaymentRows = useMemo(() => paymentRows.filter((row) => paymentFilter === "all" || (paymentFilter === "paid" ? paymentSettled(row) : !paymentSettled(row))), [paymentFilter, paymentRows]);\n''', '''  const paymentSettled = useCallback((row) => {\n    const total = number(row.totalAmount ?? row.total);\n    return rowPaid(row) || (total > 0 && number(row.paidAmount) >= total);\n  }, []);\n  const visiblePaymentRows = useMemo(() => paymentRows.filter((row) => paymentFilter === "all" || (paymentFilter === "paid" ? paymentSettled(row) : !paymentSettled(row))), [paymentFilter, paymentRows, paymentSettled]);\n''', 1)
          t = t.replace('''  }, { total: 0, paidCount: 0, waitingCount: 0, paidAmount: 0, waitingAmount: 0 }), [paymentRows]);\n''', '''  }, { total: 0, paidCount: 0, waitingCount: 0, paidAmount: 0, waitingAmount: 0 }), [paymentRows, paymentSettled]);\n''', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Guard Daily Entry and management contract
        shell: bash
        run: |
          set -euo pipefail
          file="$FRONTEND_DIR/src/pages/modules/ik/DailyHrWorkspace.jsx"
          registry="$FRONTEND_DIR/src/app/moduleRegistry.js"
          css="$FRONTEND_DIR/src/pages/modules/ik/daily-hr-workspace-final.css"
          grep -q 'daily-dashboard' "$file"
          grep -q 'gop-card-manager' "$file"
          grep -q 'gop-week-matrix' "$file"
          grep -q 'gop-payment-grid compact' "$file"
          grep -q 'DAILY-OPERATIONS-MANAGEMENT-UI-2026-09-30' "$css"
          grep -q '\["daily-dashboard", "Ana Sayfa", "dashboard"\]' "$registry"
          grep -q 'Günlük Personel Girişi' "$file"
          grep -q 'Hızlı Giriş' "$file"
          grep -q 'Personel Havuzu' "$file"

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit production implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx \
            APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css \
            APP/app/ky-erp-frontend/src/app/moduleRegistry.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(daily): add management home and purpose-built screens"
            git push origin HEAD:"$PROD_BRANCH"
          fi

      - name: Deploy frontend Pages production
        working-directory: APP/app/ky-erp-frontend
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name ky-erp-frontend
          --branch codex/model-uretim-kontrol-merkezi-final

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          for route in daily-dashboard daily-cards daily-weekly daily-payments daily-entry; do
            curl -fsS --retry 5 --retry-delay 2 "https://kyerp.net/gunluk-operasyon/$route" > "/tmp/$route.html"
            test -s "/tmp/$route.html"
          done

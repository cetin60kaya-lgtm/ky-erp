# retry after assertion hardening
name: KYERP Daily Entry Consistency Fix TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-entry-consistency-fix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyerp-daily-entry-consistency-fix
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply consistency patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/daily_entry_consistency_fix.py
          git diff --check
          grep -q 'setPersonReviewed(person, !reviewed)' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'trg_daily_check_clear_day' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'trg_daily_check_clear_night' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: API typecheck test build
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build

      - name: Commit application fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(daily): enforce selected and checked consistency"
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

      - name: Deploy API Worker
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy

      - name: Deploy frontend Pages
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist \
            --project-name ky-erp-frontend \
            --branch codex/model-uretim-kontrol-merkezi-final \
            --commit-hash "$(git rev-parse HEAD)"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          api_ok=0
          for i in {1..12}; do
            code="$(curl -sS -o /tmp/api.html -w '%{http_code}' https://api.kyerp.net/api/gunluk-operasyon/sync-state || true)"
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "200" ]; then api_ok=1; break; fi
            sleep 5
          done
          test "$api_ok" = 1
          for path in /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-weekly /gunluk-operasyon/daily-payments; do
            ok=0
            for i in {1..12}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
            echo "$path live: OK"
          done

name: PDKS Pro Setup Autofix

on:
  push:
    branches:
      - codex/pdks-desktop-1.8.1-device-final-20260907
    paths:
      - '.github/workflows/pdks-pro-setup-autofix.yml'
      - 'APP/desktop/ky-pdks/**'

permissions:
  contents: read

jobs:
  package:
    name: Package PDKS Pro Setup 1.9.0
    runs-on: windows-2025
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json
      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: KY PDKS Pro release package + Setup
        shell: pwsh
        run: ./APP/desktop/ky-pdks/BUILD_PDKS_PRO_SETUP.ps1 -SkipTests
      - name: Release çıktısını doğrula
        shell: pwsh
        run: |
          $setup = './APP/desktop/ky-pdks/release/KY-PDKS-Pro-Setup-1.9.0.exe'
          if (-not (Test-Path $setup)) { throw 'KY-PDKS-Pro-Setup-1.9.0.exe oluşmadı.' }
          Get-Item $setup | Format-List FullName,Length,LastWriteTime
      - name: KY PDKS Pro 1.9.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KY-PDKS-Pro-Setup-1.9.0
          path: |
            APP/desktop/ky-pdks/release/KY-PDKS-Pro-Setup-1.9.0.exe
            APP/desktop/ky-pdks/release/KY-PDKS-Pro-Setup-1.9.0.exe.sha256.txt
            APP/desktop/ky-pdks/release/KY-PDKS-Pro-Setup-1.9.0.build-info.json
          if-no-files-found: error
          retention-days: 14

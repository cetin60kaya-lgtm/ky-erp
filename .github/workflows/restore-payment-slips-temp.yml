name: KYERP Restore Payment Slips TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/restore-payment-slips-temp.yml

permissions:
  contents: write

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git -C ../../.. rev-parse HEAD)"
      - name: Production smoke
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' 'https://kyerp.net/gunluk-operasyon/daily-payments' || true)"
            if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Remove helper
        if: success()
        run: |
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git rm .github/workflows/restore-payment-slips-temp.yml
          git commit -m "chore: remove payment slip deploy helper"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

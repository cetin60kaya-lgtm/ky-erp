name: Daily Operations Live Sync Final

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-ops-live-sync-temp.yml

permissions:
  contents: write

concurrency:
  group: daily-ops-live-sync-final
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Apply Daily Operations live sync final patch
        run: |
          set -euo pipefail
          python .github/scripts/daily_ops_live_sync_final.py
          git diff --check

      - name: Source guardrails
        run: |
          set -euo pipefail
          grep -q 'hr_daily_attendance_check' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q '/api/gunluk-operasyon/sync-state' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'ATTENDANCE_CHECK_UPDATE' APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts
          grep -q 'getDailySyncState' APP/app/ky-erp-frontend/src/services/dailyOpsApi.js
          grep -q 'LIVE_SYNC_INTERVAL_MS = 1500' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'checkedBaseline' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'Canlı senkron: başka bilgisayardaki değişiklikler alındı' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx

      - name: Worker typecheck test build
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Frontend lint test build
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Verify Cloudflare access
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami

      - name: Backup live D1 before additive runtime schema
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          mkdir -p database-backup
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          backup="database-backup/ky-erp-db-before-daily-live-sync-${stamp}.sql"
          npx wrangler d1 export ky-erp-db --remote --config wrangler.jsonc --skip-confirmation --output "$backup"
          test -s "$backup"
          echo "D1_BACKUP=$backup" >> "$GITHUB_ENV"

      - name: Store D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-live-sync-d1-backup-${{ github.run_id }}
          path: APP/cloud/ky-erp-api/database-backup/*.sql
          if-no-files-found: error
          retention-days: 14

      - name: Commit final Daily Operations implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/gunluk-operasyon-cloud.ts \
                  APP/app/ky-erp-frontend/src/services/dailyOpsApi.js \
                  APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "fix(daily): persist review state and sync browsers live"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy API Worker production
        working-directory: APP/cloud/ky-erp-api
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Deploy frontend Pages production
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 pages deploy dist \
            --project-name ky-erp-frontend \
            --branch codex/model-uretim-kontrol-merkezi-final \
            --commit-hash "${DEPLOY_SHA}"

      - name: Production smoke
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://api.kyerp.net/api/health >/tmp/ky-health.json
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://kyerp.net/gunluk-operasyon/daily-entry >/tmp/ky-daily.html
          test -s /tmp/ky-health.json
          test -s /tmp/ky-daily.html
          status="$(curl -sS -o /tmp/ky-sync-auth.txt -w '%{http_code}' 'https://api.kyerp.net/api/gunluk-operasyon/sync-state?mainCompanyId=mecit-hakan')"
          test "$status" = "401"
          echo "Production smoke OK; sync endpoint remains authenticated."

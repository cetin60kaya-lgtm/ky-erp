name: İşNet ve Desen son kaynak düzeltmesi

on:
  push:
    branches:
      - agent/isnet-desen-final-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isnet-desen-final-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-isnet-desen-final.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP/app/ky-erp-backend/src/muhasebe/isnet-operations.service.ts
          git add APP/app/ky-erp-backend/src/modules/desen/desen.service.ts
          git add APP/app/ky-erp-backend/src/modules/desen/desen-workflow.service.ts
          git add APP/app/ky-erp-backend/src/modules/desen/desen.controller.ts
          git add APP/app/ky-erp-frontend/src/services/desenWorkflowApi.js
          git add APP/app/ky-erp-frontend/src/pages/desen/DesenModelMasasi.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "İşNet bağlantısını ve Desen klasör ayarını tamamla"
          git push origin HEAD:agent/isnet-desen-final-v1

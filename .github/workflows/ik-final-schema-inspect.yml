name: IK final schema inspect

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-final-schema-inspect-trigger.txt

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uretim-tek-merkez
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve D1 account
        shell: bash
        run: |
          set -euo pipefail
          database_id='b504b712-6927-499d-815d-0b954c8ee246'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          for account_id in $(jq -r '.result[]?.id' <<<"$accounts"); do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Install Worker packages
        working-directory: APP/cloud/ky-erp-api
        run: npm ci
      - name: Verify final IK D1 and live API
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          run_sql(){ echo "===== $1 ====="; npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$2" --json | jq -c '.[]?.results[]?'; }
          run_sql indexes "SELECT name,sql FROM sqlite_master WHERE type='index' AND tbl_name='ik_person_card_settings' ORDER BY name;"
          run_sql cuma "SELECT e.code,e.full_name,e.salary,s.card_no,s.base_employee_id,s.extra_payment_label,s.extra_payment_amount,s.legal_deduction_type,s.garnishment_amount,s.garnishment_source,s.legal_start_period,s.legal_end_period FROM hr_monthly_employees e LEFT JOIN ik_person_card_settings s ON s.employee_id=e.id WHERE e.main_company_id='mecit-hakan' AND e.code IN ('HKN-03','HKN-05') ORDER BY e.code;"
          run_sql migrations "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 3;"
          echo '===== live month ====='
          curl --fail --silent --show-error "https://api.kyerp.net/api/ik/advanced/month?mainCompanyId=mecit-hakan&year=2026&month=8" > /tmp/month.json
          jq -c '.data.employees[] | select(.code=="HKN-03" or .code=="HKN-05") | {code,fullName,salary,baseEmployeeId,extraPaymentAmount,legalDeductionType,garnishmentSource}' /tmp/month.json
          echo '===== live payroll ====='
          curl --fail --silent --show-error "https://api.kyerp.net/api/ik/advanced/payroll?mainCompanyId=mecit-hakan&year=2026&month=8" > /tmp/payroll.json
          jq -c '.data.lines[] | select(.code=="HKN-05") | {code,fullName,final}' /tmp/payroll.json
          jq -e '.data.employees[] | select(.code=="HKN-05") | .salary==48100 and (.baseEmployeeId|length)>0 and .extraPaymentAmount==2600' /tmp/month.json >/dev/null
          jq -e '.data.lines[] | select(.code=="HKN-05") | .final.salaryPay==45500 and .final.premiumAmount==2600' /tmp/payroll.json >/dev/null

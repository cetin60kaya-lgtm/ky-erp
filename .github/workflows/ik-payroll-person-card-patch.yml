name: IK payroll person-card patch

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-payroll-main-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0

      - name: Apply embedded IK patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/ik-payroll-person-card-patch.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          lines = src[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          needle = "rep(old_plan, new_plan, 'planFor')"
          replacement = '''pattern_plan = re.compile(r"  const planFor = useCallback\\(\\(employee\\) => \\{.*?\\n  \\}, \\[movements, payrollLines\\]\\);", re.S)
          text, n = pattern_plan.subn(lambda _m: new_plan, text, count=1)
          if n != 1:
              raise SystemExit(f"planFor regex: expected 1 match, found {n}")'''
          if needle not in code:
              raise SystemExit('planFor patch hook not found')
          code = code.replace(needle, replacement, 1)
          Path('/tmp/ik_patch.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/ik_patch.py

      - name: Validate frontend
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
          VITE_API_BASE_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run build

      - name: Commit patched IK file
        run: |
          git diff --check
          git config user.name "kyerp-automation"
          git config user.email "kyerp-automation@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "feat(ik): add per-person extra pay and garnishment controls"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

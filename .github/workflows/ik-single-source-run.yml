name: IK single source runner

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-single-source-run-trigger.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uretim-tek-merkez
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        run: python tools/ik_single_source_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "cetin kaya"
          git config user.email "cetin60kaya@gmail.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/IkAdvancedMonthly.jsx APP/cloud/ky-erp-api/src/ik-relational-cloud.ts
          git rm tools/ik_single_source_cleanup.py
          git commit -m "fix: finalize clean IK source ownership"
          git push origin HEAD:agent/uretim-tek-merkez
      - name: Install worker packages
        working-directory: APP/cloud/ky-erp-api
        run: npm ci
      - name: Check worker
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm run typecheck
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Build frontend
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
          VITE_API_BASE_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run build
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          database_id='b504b712-6927-499d-815d-0b954c8ee246'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          for account_id in $(jq -r '.result[]?.id' <<<"$accounts"); do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Deploy Worker
        working-directory: APP/cloud/ky-erp-api
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx wrangler pages deploy dist --project-name ky-erp-frontend --branch agent/uretim-tek-merkez
      - name: Verify live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.kyerp.net/api/health >/tmp/health.json
          cat /tmp/health.json
          curl --fail --silent --show-error https://app.kyerp.net/ >/tmp/app.html
          grep -qi '<div id="root"' /tmp/app.html

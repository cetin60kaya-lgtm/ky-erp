name: Daily Print Layout Final

on:
  push:
    branches: [codex/model-uretim-kontrol-merkezi-final]
    paths:
      - '.github/workflows/daily-roster-source-hotfix.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      PAGES_PROJECT: ky-erp-frontend
      PROD_BRANCH: codex/model-uretim-kontrol-merkezi-final
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/model-uretim-kontrol-merkezi-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: Apply final monochrome print layouts
        run: python .github/scripts/daily_print_layout_final_patch.py

      - name: Verify print contract
        shell: bash
        run: |
          set -euo pipefail
          page='APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx'
          grep -F 'index += 10' "$page"
          grep -F 'grid-template-rows:repeat(5,50mm)' "$page"
          grep -F 'TOPLAM ÖDEME' "$page"
          grep -F 'index += 35' "$page"
          grep -F 'work-cell' "$page"
          grep -F 'GÜNLÜK PERSONEL HAFTALIK KONTROL LİSTESİ' "$page"
          grep -F 'Seçili Kişileri Yazdır' "$page"
          grep -F 'Tümünü Yazdır' "$page"
          grep -F 'Haftalık Özet' "$page"

      - name: Frontend checks
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        env:
          VITE_API_URL: https://api.kyerp.net

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KY ERP Automation'
          git config user.email 'actions@kyerp.net'
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(daily): finalize weekly and payment print layouts'
            git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
          fi

      - name: Deploy production
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.118.0 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$PROD_BRANCH" --commit-hash "$(git rev-parse HEAD)" --commit-message "Daily print layouts final"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://kyerp.net/gunluk-operasyon/daily-payments >/tmp/payments.html && test -s /tmp/payments.html; then exit 0; fi
            sleep 2
          done
          exit 1

name: TEMP IK Final Live Smoke

on:
  push:
    branches:
      - codex/ik-period-dashboard-final-payroll-20260906
    paths:
      - ".github/workflows/ik-final-live-smoke-temp.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: API health and guards
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.kyerp.net/api/health > /tmp/health.json
          jq -e '.ok == true and .database == "d1"' /tmp/health.json >/dev/null

          for url in             "https://api.kyerp.net/api/auth/me"             "https://api.kyerp.net/api/ik/advanced/month?mainCompanyId=mecit-hakan&year=2026&month=8"             "https://api.kyerp.net/api/ik/advanced/payroll?mainCompanyId=mecit-hakan&year=2026&month=8"; do
            code="$(curl --silent --show-error --output /tmp/guard.json --write-out '%{http_code}' "$url")"
            test "$code" = "401"
            jq -e '.error.code == "UNAUTHORIZED"' /tmp/guard.json >/dev/null
          done

          code="$(curl --silent --show-error --output /tmp/final.json --write-out '%{http_code}'             -X POST -H 'Content-Type: application/json'             --data '{"mainCompanyId":"mecit-hakan","year":2026,"month":8,"employeeId":"smoke"}'             https://api.kyerp.net/api/ik/advanced/payroll/final-control)"
          test "$code" = "401"
          jq -e '.error.code == "UNAUTHORIZED"' /tmp/final.json >/dev/null
          echo "API_LIVE_OK"

      - name: Custom domain matches latest Pages and contains IK final UI
        shell: bash
        run: |
          set -euo pipefail
          APP="https://app.kyerp.net"
          PREVIEW="https://4dd22122.ky-erp-frontend.pages.dev"

          curl -LfsS "$APP/" > /tmp/app.html
          curl -LfsS "$PREVIEW/" > /tmp/preview.html

          app_scripts="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/app.html | sed -n 's/.*src="\([^"]*\)"/\1/p' | tr '\n' ' ')"
          preview_scripts="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/preview.html | sed -n 's/.*src="\([^"]*\)"/\1/p' | tr '\n' ' ')"
          test -n "$app_scripts"
          test "$app_scripts" = "$preview_scripts"

          : > /tmp/app.js
          : > /tmp/preview.js
          fetch_scripts() {
            base="$1"; html="$2"; out="$3"
            grep -oE '<script[^>]+src="[^"]+"' "$html" | sed -n 's/.*src="\([^"]*\)"/\1/p' | while IFS= read -r src; do
              case "$src" in
                http://*|https://*) url="$src" ;;
                /*) url="$base$src" ;;
                *) clean="$(printf '%s' "$src" | sed 's#^\./##')"; url="$base/$clean" ;;
              esac
              curl -LfsS "$url" >> "$out"
            done
          }
          fetch_scripts "$APP" /tmp/app.html /tmp/app.js
          fetch_scripts "$PREVIEW" /tmp/preview.html /tmp/preview.js

          app_hash="$(sha256sum /tmp/app.js | awk '{print $1}')"
          preview_hash="$(sha256sum /tmp/preview.js | awk '{print $1}')"
          test "$app_hash" = "$preview_hash"

          grep -oE 'assets/[A-Za-z0-9._-]+\.js' /tmp/app.js | sort -u > /tmp/chunks.txt || true
          cp /tmp/app.js /tmp/all.js
          while IFS= read -r chunk; do
            [ -n "$chunk" ] || continue
            curl -LfsS "$APP/$chunk" >> /tmp/all.js || true
          done < /tmp/chunks.txt

          for marker in             "İK İşlem Merkezi"             "Bilgileri Hazırla"             "Akıllı Kontrol Merkezi"             "Son Bordro Kontrolü"             "Kaydet + Fişi Aç"             "Bugün kart basan"; do
            grep -Fq "$marker" /tmp/all.js || { echo "Eksik canlı marker: $marker" >&2; exit 1; }
          done

          echo "CUSTOM_DOMAIN_LATEST_PAGES=YES"
          echo "ASSET_SHA256=$app_hash"

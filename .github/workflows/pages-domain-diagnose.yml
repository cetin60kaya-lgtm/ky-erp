name: KY ERP Pages Domain Diagnose

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/pages-domain-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve account and inspect Pages domains/DNS/live URLs
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          database_id="b504b712-6927-499d-815d-0b954c8ee246"
          accounts_json="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          account_id=""
          while read -r candidate; do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${candidate}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              account_id="$candidate"
              break
            fi
          done < <(jq -r '.result[]?.id' <<<"$accounts_json")
          test -n "$account_id"
          echo "ACCOUNT=$account_id"

          echo '--- PROJECT ---'
          curl --fail --silent --show-error -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ky-erp-frontend" \
            | jq '{success, result:{name:.result.name,subdomain:.result.subdomain,production_branch:.result.production_branch,domains:.result.domains,latest_deployment:{id:.result.latest_deployment.id,url:.result.latest_deployment.url,environment:.result.latest_deployment.environment,aliases:.result.latest_deployment.aliases,latest_stage:.result.latest_deployment.latest_stage}}}'

          echo '--- PRODUCTION DEPLOYMENTS ---'
          curl --fail --silent --show-error -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ky-erp-frontend/deployments?env=production&per_page=5" \
            | jq '{success,result:[.result[]?|{id,url,environment,aliases,created_on,latest_stage,source}]}'

          echo '--- PAGES DOMAINS ---'
          curl --fail --silent --show-error -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ky-erp-frontend/domains" \
            | jq '{success,result:[.result[]?|{name,status,verification_data,validation_data,zone_tag}]}'

          echo '--- PUBLIC DNS ---'
          for host in kyerp.net app.kyerp.net ky-erp-frontend.pages.dev; do
            echo "### $host"
            echo "A=$(dig +short A "$host" | paste -sd, -)"
            echo "AAAA=$(dig +short AAAA "$host" | paste -sd, -)"
            echo "CNAME=$(dig +short CNAME "$host" | paste -sd, -)"
          done

          echo '--- ZONE API ---'
          zones="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/zones?name=kyerp.net&account.id=${account_id}")"
          jq '{success,result:[.result[]?|{id,name,status,paused,type}]}' <<<"$zones"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zones")"
          if [ -n "$zone_id" ]; then
            dns_status="$(curl --silent --show-error -o /tmp/dns.json -w '%{http_code}' -H "$auth" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?per_page=100" || true)"
            echo "DNS_API_HTTP=$dns_status"
            if [ "$dns_status" = "200" ]; then
              jq '{success,result:[.result[]?|select(.name=="kyerp.net" or .name=="app.kyerp.net")|{id,type,name,content,proxied,ttl}]}' /tmp/dns.json
            else
              cat /tmp/dns.json || true
            fi
          fi

          echo '--- HTTP PROBES ---'
          urls=(
            'https://kyerp.net/'
            'https://app.kyerp.net/'
            'https://ky-erp-frontend.pages.dev/'
            'https://910947fe.ky-erp-frontend.pages.dev/'
          )
          prod_url="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ky-erp-frontend/deployments?env=production&per_page=1" | jq -r '.result[0].url // empty')"
          [ -z "$prod_url" ] || urls+=("${prod_url}/")
          for url in "${urls[@]}"; do
            echo "### $url"
            : > /tmp/body
            : > /tmp/headers
            curl -L --max-time 20 -sS -o /tmp/body -D /tmp/headers -w 'HTTP=%{http_code} FINAL=%{url_effective}\n' "$url" || true
            head -n 16 /tmp/headers || true
            echo 'BODY:'
            head -c 240 /tmp/body || true
            echo
          done

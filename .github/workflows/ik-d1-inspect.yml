name: IK D1 inspect

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-d1-inspect-trigger.txt

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uretim-tek-merkez
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve D1 account
        shell: bash
        run: |
          set -euo pipefail
          database_id='b504b712-6927-499d-815d-0b954c8ee246'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          for account_id in $(jq -r '.result[]?.id' <<<"$accounts"); do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Install Worker packages
        working-directory: APP/cloud/ky-erp-api
        run: npm ci
      - name: Inspect exact employee and payroll rows
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          run_sql () {
            local label="$1"
            local sql="$2"
            local file="/tmp/${label}.json"
            echo "--- ${label} ---"
            npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$sql" --json > "$file"
            jq -c '.[]?.results[]?' "$file"
          }

          run_sql monthly "SELECT id, main_company_id, code, full_name, salary, road_allowance, bank_payment_type, bank_amount, cash_amount, sgk_status, status FROM hr_monthly_employees WHERE code IN ('HKN-03','HKN-05') OR upper(full_name) LIKE 'CUMA%' OR upper(full_name) LIKE 'MURAT%' ORDER BY code, full_name;"
          run_sql personnel "SELECT id, main_company_slug, code, full_name, monthly_salary, monthly_road_fee, bank_base_amount, payment_type, sgk_status, is_active FROM hr_monthly_personnel WHERE code IN ('HKN-03','HKN-05') OR upper(full_name) LIKE 'CUMA%' OR upper(full_name) LIKE 'MURAT%' ORDER BY code, full_name;"
          run_sql cardsettings "SELECT s.* FROM ik_person_card_settings s JOIN hr_monthly_employees e ON e.id=s.employee_id WHERE e.code IN ('HKN-03','HKN-05') OR upper(e.full_name) LIKE 'CUMA%' OR upper(e.full_name) LIKE 'MURAT%' ORDER BY e.code;"
          run_sql payrollv2 "SELECT p.* FROM hr_payrolls_v2 p JOIN hr_monthly_employees e ON e.id=p.employee_id WHERE e.code IN ('HKN-03','HKN-05') OR upper(e.full_name) LIKE 'CUMA%' OR upper(e.full_name) LIKE 'MURAT%' ORDER BY p.year DESC, p.month DESC, e.code;"
          run_sql overrides "SELECT o.* FROM ik_payroll_overrides o JOIN hr_monthly_employees e ON e.id=o.employee_id WHERE e.code IN ('HKN-03','HKN-05') OR upper(e.full_name) LIKE 'CUMA%' OR upper(e.full_name) LIKE 'MURAT%' ORDER BY o.period_year DESC, o.period_month DESC, e.code;"

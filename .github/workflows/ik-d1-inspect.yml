name: IK D1 inspect

on:
  push:
    branches:
      - main
    paths:
      - tools/ik-d1-inspect-trigger.txt

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve D1 account
        shell: bash
        run: |
          set -euo pipefail
          database_id='b504b712-6927-499d-815d-0b954c8ee246'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          for account_id in $(jq -r '.result[]?.id' <<<"$accounts"); do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Install Worker packages
        working-directory: APP/cloud/ky-erp-api
        run: npm ci
      - name: Inspect IK schema and candidate stores
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          echo '--- TABLES / SCHEMAS ---'
          SQL="SELECT name, sql FROM sqlite_master WHERE type='table' AND (lower(name) LIKE '%ik%' OR lower(name) LIKE '%person%' OR lower(name) LIKE '%employee%' OR lower(name) LIKE '%payroll%' OR lower(name) LIKE '%bordro%' OR lower(name) LIKE '%json%') ORDER BY name;"
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$SQL" --json > /tmp/schema.json
          jq -c '.[]?.results[]?' /tmp/schema.json

          echo '--- JSON STORE SCOPES ---'
          SQL="SELECT scope, main_company_slug, count(*) AS adet FROM json_store GROUP BY scope, main_company_slug ORDER BY scope, main_company_slug;"
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$SQL" --json > /tmp/scopes.json
          jq -c '.[]?.results[]?' /tmp/scopes.json

          echo '--- JSON STORE CANDIDATES ---'
          SQL="SELECT id, scope, main_company_slug, file_name, substr(data,1,900) AS data_preview FROM json_store WHERE lower(scope) LIKE '%ik%' OR lower(scope) LIKE '%person%' OR lower(scope) LIKE '%payroll%' ORDER BY scope, updated_at DESC LIMIT 200;"
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$SQL" --json > /tmp/jsonrows.json
          jq -c '.[]?.results[]?' /tmp/jsonrows.json

          echo '--- CUMA/MURAT ANY JSON ---'
          SQL="SELECT id, scope, main_company_slug, file_name, substr(data,1,1400) AS data_preview FROM json_store WHERE upper(data) LIKE '%CUMA%' OR upper(data) LIKE '%MURAT M%' ORDER BY scope, updated_at DESC LIMIT 100;"
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "$SQL" --json > /tmp/names.json
          jq -c '.[]?.results[]?' /tmp/names.json

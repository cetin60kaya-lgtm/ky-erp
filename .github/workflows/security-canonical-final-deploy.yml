name: KY Security Canonical Final Deploy

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - APP/cloud/ky-erp-security-host/worker.js
      - APP/cloud/ky-erp-security-host/wrangler.jsonc
      - APP/app/ky-erp-frontend/src/security-pwa-install-enrollment-final.test.js
      - .github/workflows/security-canonical-final-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-security-canonical-host
  cancel-in-progress: false

jobs:
  deploy-security-host:
    name: Deploy and verify KY Security launch compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate security source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          node --check APP/cloud/ky-erp-security-host/worker.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/app.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/security-actions.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/security-control-center.js
          node --test APP/app/ky-erp-frontend/src/security-pwa-install-enrollment-final.test.js
          grep -q 'const SOURCE_PREFIX="/guvenlik"' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'const PRIMARY_PREFIX="/ky-guvenlik"' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'COMPAT_PREFIXES' APP/cloud/ky-erp-security-host/worker.js
          ! grep -q 'security-foreground-sync.js' APP/app/ky-erp-frontend/public/guvenlik/index.html
          ! grep -q 'MutationObserver' APP/app/ky-erp-frontend/public/guvenlik/security-control-center.js

      - name: Deploy security.kyerp.net Worker only
        working-directory: APP/cloud/ky-erp-security-host
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 deploy --config wrangler.jsonc

      - name: Verify installed-PWA launch compatibility
        shell: bash
        run: |
          set -euo pipefail
          probe="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          enrollment_id="TESTCANONICAL"
          enrollment_token="TESTTOKEN"
          legacy_url="https://security.kyerp.net/security/?enrollmentId=${enrollment_id}&enrollmentToken=${enrollment_token}&mode=link&probe=${probe}"

          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -sS --max-time 20 -H 'Accept: text/html' -D /tmp/security.headers -o /dev/null "$legacy_url" || true
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/security.headers)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/security.headers)"
            release="$(awk 'BEGIN{IGNORECASE=1} /^x-kyerp-security-app:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/security.headers)"
            echo "Attempt ${attempt}: status=${status:-none} release=${release:-none} location=${location:-none}"

            if [ "$status" = "308" ] \
              && [ "$release" = "fresh-v3-compat" ] \
              && printf '%s' "$location" | grep -Fq 'https://security.kyerp.net/ky-guvenlik/' \
              && printf '%s' "$location" | grep -Fq "enrollmentId=${enrollment_id}" \
              && printf '%s' "$location" | grep -Fq "enrollmentToken=${enrollment_token}" \
              && printf '%s' "$location" | grep -Fq 'mode=link' \
              && ! printf '%s' "$location" | grep -Fq 'probe='; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/ky-guvenlik/ -o /tmp/security-primary.html
          grep -q '<title>KY ERP Güvenlik</title>' /tmp/security-primary.html
          grep -q '/ky-guvenlik/app.js' /tmp/security-primary.html
          grep -q 'v3.0' /tmp/security-primary.html

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/guvenlik/ -o /tmp/security-compat.html
          grep -q '<title>KY ERP Güvenlik</title>' /tmp/security-compat.html
          grep -q '/guvenlik/app.js' /tmp/security-compat.html

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/ky-guvenlik/manifest.webmanifest -o /tmp/manifest-primary.json
          jq -e '.id == "/ky-guvenlik/" and .start_url == "/ky-guvenlik/" and .scope == "/ky-guvenlik/"' /tmp/manifest-primary.json >/dev/null

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/guvenlik/manifest.webmanifest -o /tmp/manifest-compat.json
          jq -e '.id == "/guvenlik/" and .start_url == "/guvenlik/" and .scope == "/guvenlik/"' /tmp/manifest-compat.json >/dev/null

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/ky-guvenlik/sw.js -o /tmp/sw-primary.js
          grep -q 'const APP_URL="/ky-guvenlik/"' /tmp/sw-primary.js

          legacy_asset_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Accept: application/javascript' https://security.kyerp.net/security/obsolete.js)"
          test "$legacy_asset_status" = "410"

          echo "KY Security installed-PWA launch compatibility verification passed."

name: KY Security Canonical Final Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - '.github/deploy/security-trigger'

permissions:
  contents: read

concurrency:
  group: kyerp-security-canonical-host
  cancel-in-progress: true

jobs:
  deploy-security-host:
    name: Deploy and verify KY Security launch compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: APP/cloud/ky-erp-api
        run: npm ci --ignore-scripts

      - name: Compile full canonical ERP for one KY ERP PRO PWA
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          KYERP_SECURITY_PRO_BUILD=1 npm run build
          test -f dist-security-pro/pro.html
          test -d dist-security-pro/assets

      - name: Validate security source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          (cd APP/cloud/ky-erp-api && npm run typecheck)
          (cd APP/cloud/ky-erp-api && node --experimental-strip-types --test src/auth-push-approval-contract.test.ts)
          node --check APP/cloud/ky-erp-security-host/worker.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/app.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/security-actions.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/sw.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/security-control-center.js
          node --check APP/app/ky-erp-frontend/public/guvenlik/security-workspace.js
          node --test APP/app/ky-erp-frontend/src/security-pwa-install-enrollment-final.test.js
          node --test APP/app/ky-erp-frontend/src/ky-mobile-install-version.contract.test.js
          grep -q 'const APP_PREFIX="/guvenlik"' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'const APP_URL="/guvenlik/"' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'LEGACY_PREFIXES' APP/cloud/ky-erp-security-host/worker.js
          ! grep -q 'PRIMARY_PREFIX\|COMPAT_PREFIXES' APP/cloud/ky-erp-security-host/worker.js
          ! grep -q 'security-foreground-sync.js' APP/app/ky-erp-frontend/public/guvenlik/index.html
          ! grep -q 'MutationObserver' APP/app/ky-erp-frontend/public/guvenlik/security-control-center.js
          grep -q 'id="bootPanel"' APP/app/ky-erp-frontend/public/guvenlik/index.html
          grep -q 'Yedek Kod + Admin Şifresiyle Bağla' APP/app/ky-erp-frontend/public/guvenlik/app.js
          grep -q 'matchNumber:String' APP/app/ky-erp-frontend/public/guvenlik/sw.js
          grep -q 'env.ASSETS' APP/cloud/ky-erp-security-host/worker.js
          grep -q '"binding": "ASSETS"' APP/cloud/ky-erp-security-host/wrangler.jsonc

      - name: Dry-run API Worker bundle
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: npx wrangler@4.118.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/kyerp-api-dry

      - name: Prepare isolated Security Worker assets (never include Pages _redirects)
        shell: bash
        run: |
          set -euo pipefail
          node APP/cloud/ky-erp-security-host/prepare-assets.mjs
          test -f APP/cloud/ky-erp-security-host/.security-assets/guvenlik/index.html
          test -f APP/cloud/ky-erp-security-host/.security-assets/guvenlik/pro/index.html
          test -d APP/cloud/ky-erp-security-host/.security-assets/guvenlik/pro/assets
          test ! -e APP/cloud/ky-erp-security-host/.security-assets/ky-sistem
          test -f APP/cloud/ky-erp-security-host/.security-assets/ky-firma/index.html
          test ! -e APP/cloud/ky-erp-security-host/.security-assets/owner-security
          test ! -e APP/cloud/ky-erp-security-host/.security-assets/_redirects

      - name: Dry-run security host bundle with embedded assets
        working-directory: APP/cloud/ky-erp-security-host
        shell: bash
        run: npx --yes wrangler@4.118.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/kyerp-security-dry

      - name: Deploy KY ERP API security rules
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.118.0 deploy --config wrangler.jsonc

      - name: Deploy security.kyerp.net Worker with bundled security assets
        working-directory: APP/cloud/ky-erp-security-host
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 deploy --config wrangler.jsonc

      - name: Diagnose public Security host routes (no credentials logged)
        shell: bash
        run: |
          set -u
          for path in /security/ /guvenlik/ /guvenlik/manifest.webmanifest /guvenlik/sw.js /guvenlik/app.js /ky-firma/ /ky-firma/manifest.webmanifest /ky-sistem/ /ky-sistem/sw.js; do
            result="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Accept: text/html' --max-time 20 "https://security.kyerp.net${path}" 2>&1 || true)"
            echo "Security host ${path}: ${result}"
          done
          title="$(curl -sS --max-time 20 https://security.kyerp.net/guvenlik/ 2>/dev/null | grep -oE '<title>[^<]*</title>' | head -1 || true)"
          echo "Canonical title: ${title:-missing}"
          for endpoint in /api/auth/push/security-enrollment/complete /api/auth/push/security-relink/by-subscription; do
            code="$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' "https://api.kyerp.net${endpoint}" | jq -r '.error.code // "missing"' 2>/dev/null || true)"
            echo "API guard ${endpoint}: ${code:-unreachable}"
          done

      - name: Verify canonical Security PWA
        shell: bash
        run: |
          set -euo pipefail
          legacy_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://security.kyerp.net/security/)"
          test "$legacy_status" = "410"

          primary_status="$(curl --silent --show-error --max-time 20 -o /tmp/security-primary.html -w '%{http_code}' https://security.kyerp.net/guvenlik/)"
          test "$primary_status" = "200"
          grep -q '<title>KY ERP PRO v4.2.0</title>' /tmp/security-primary.html
          grep -q '/guvenlik/app.js' /tmp/security-primary.html
          grep -q 'v4.2.0' /tmp/security-primary.html

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/guvenlik/manifest.webmanifest -o /tmp/manifest-primary.json
          jq -e '.id == "/guvenlik/" and .start_url == "/guvenlik/" and .scope == "/guvenlik/"' /tmp/manifest-primary.json >/dev/null

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/guvenlik/sw.js -o /tmp/sw-primary.js
          grep -q 'const APP_URL="/guvenlik/"' /tmp/sw-primary.js
          grep -q 'matchNumber:String' /tmp/sw-primary.js

          curl --fail --silent --show-error --max-time 20 https://security.kyerp.net/guvenlik/app.js -o /tmp/security-app.js
          grep -q 'Yedek Kod + Admin Şifresiyle Bağla' /tmp/security-app.js
          grep -q 'approve.disabled=true' /tmp/security-app.js
          grep -q 'createLocalUnlock' /tmp/security-app.js
          grep -q 'APP_DISPLAY_VERSION="v4.2.0"' /tmp/security-app.js
          grep -q 'id="bootPanel"' /tmp/security-primary.html
          # The full ERP application must open inside the existing /guvenlik/ PWA scope.
          pro_status="$(curl --silent --show-error --max-time 25 -o /tmp/ky-erp-pro.html -w '%{http_code}' https://security.kyerp.net/guvenlik/pro/)"
          test "$pro_status" = "200"
          grep -q 'KY ERP PRO v4.2.0' /tmp/ky-erp-pro.html
          grep -q '/guvenlik/pro/assets/' /tmp/ky-erp-pro.html
          pro_deep_status="$(curl --silent --show-error --max-time 25 -o /tmp/ky-erp-pro-deep.html -w '%{http_code}' https://security.kyerp.net/guvenlik/pro/ik/personel-kartlari)"
          test "$pro_deep_status" = "200"
          grep -q 'KY ERP PRO v4.2.0' /tmp/ky-erp-pro-deep.html


          enrollment_guard="$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' https://api.kyerp.net/api/auth/push/security-enrollment/complete)"
          printf '%s' "$enrollment_guard" | jq -e '.error.code == "SECURITY_ENROLLMENT_CODE_REQUIRED"' >/dev/null
          relink_guard="$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' https://api.kyerp.net/api/auth/push/security-relink/by-subscription)"
          printf '%s' "$relink_guard" | jq -e '.error.code == "SECURITY_ENROLLMENT_CODE_REQUIRED"' >/dev/null

          legacy_asset_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Accept: application/javascript' https://security.kyerp.net/security/obsolete.js)"
          test "$legacy_asset_status" = "410"

          # Verify separately installed KY Firma. The owner app remains /guvenlik/.
          for app in ky-firma; do
            app_url="https://security.kyerp.net/${app}/"
            status="$(curl --silent --show-error --location --max-redirs 0 --max-time 20 -o "/tmp/${app}.html" -w '%{http_code}' "$app_url")"
            echo "${app} page HTTP: ${status}"
            test "$status" = "200" || { echo "::error::${app} must respond HTTP 200 without redirects"; exit 1; }
            grep -q "/${app}/manifest.webmanifest" "/tmp/${app}.html" || { echo "::error::${app} page has incorrect manifest"; exit 1; }
            curl --fail --silent --show-error --max-time 20 "https://security.kyerp.net/${app}/manifest.webmanifest" -o "/tmp/${app}-manifest.json"
            jq -e --arg scope "/${app}/" '.id == $scope and .start_url == $scope and .scope == $scope' "/tmp/${app}-manifest.json" >/dev/null || { echo "::error::${app} manifest scope/id mismatch"; exit 1; }
            curl --fail --silent --show-error --max-time 20 "https://security.kyerp.net/${app}/sw.js" -o "/tmp/${app}-sw.js"
            grep -q "/${app}/" "/tmp/${app}-sw.js" || { echo "::error::${app} push worker scope mismatch"; exit 1; }
          done

          # Old owner app URL is a migration link, never a second active installation.
          old_owner_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Accept: text/html' https://security.kyerp.net/ky-sistem/)"
          echo "Old owner migration status: ${old_owner_status}"
          test "$old_owner_status" = "308" || { echo "::error::Old owner address must migrate to canonical /guvenlik/"; exit 1; }
          old_owner_sw="$(curl -sS --max-time 20 https://security.kyerp.net/ky-sistem/sw.js)"
          printf "%s" "$old_owner_sw" | grep -q 'registration.unregister' || { echo "::error::Old owner push SW must retire"; exit 1; }

          echo "KY Security single-owner PWA deployment verification passed."

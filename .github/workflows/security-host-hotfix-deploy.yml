name: KY Security Host Hotfix Deploy

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/security-host-hotfix-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-security-host-hotfix
  cancel-in-progress: false

jobs:
  deploy-security-host:
    name: Deploy security.kyerp.net host only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate hotfix source and Cloudflare auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          node --check APP/cloud/ky-erp-security-host/worker.js
          grep -q 'legacy-pwa-live' APP/cloud/ky-erp-security-host/worker.js
          grep -q 'Service-Worker-Allowed", "/ky-guvenlik/' APP/cloud/ky-erp-security-host/worker.js

      - name: Deploy security host Worker only
        working-directory: APP/cloud/ky-erp-security-host
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.118.0 deploy --config wrangler.jsonc

      - name: Verify live legacy WebAPK launch compatibility
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "https://security.kyerp.net/ky-guvenlik/sw.js?hotfix=${stamp}-${i}" -o /tmp/ky-security-sw.js \
              && grep -q 'self.addEventListener("push"' /tmp/ky-security-sw.js \
              && ! grep -q 'self.registration.unregister' /tmp/ky-security-sw.js; then
              curl -fsS --max-time 15 "https://security.kyerp.net/?hotfix=${stamp}-${i}" -o /tmp/ky-security-root.html
              grep -q 'KY ERP Güvenlik' /tmp/ky-security-root.html
              echo "KY Security host hotfix is live."
              exit 0
            fi
            sleep 5
          done
          echo "Live compatibility verification failed." >&2
          exit 1

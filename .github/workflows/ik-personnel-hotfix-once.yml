name: IK Personel Son Kontrol Hotfix

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/ik-personnel-hotfix-once.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    name: Puantaj donem disi ve denetim rota hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guvenli kaynak duzeltmelerini uygula
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExactlyOnce(path, oldText, newText, label) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error(`${label}: hedef metin bulunamadi`);
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`${label}: hedef metin birden fazla bulundu`);
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          const backend = 'APP/cloud/ky-erp-api/src/ik-personnel-control.ts';
          replaceExactlyOnce(
            backend,
            `  const inBase = minutesOf(EXPECTED_IN)!;\n  const outBase = minutesOf(EXPECTED_OUT)!;\n  const days = dates.map((date) => {`,
            `  const inBase = minutesOf(EXPECTED_IN)!;\n  const outBase = minutesOf(EXPECTED_OUT)!;\n  const todayTr = new Intl.DateTimeFormat("en-CA", {\n    timeZone: "Europe/Istanbul",\n    year: "numeric",\n    month: "2-digit",\n    day: "2-digit",\n  }).format(new Date());\n  const days = dates.map((date) => {`,
            'attendance-today',
          );

          replaceExactlyOnce(
            backend,
            `    const wd = weekday(date);\n    let status = text(override?.status);\n    if (!status || status === "AUTO") {\n      if (leaves.has(date)) status = upper(leaves.get(date)).includes("YILLIK") ? "YILLIK_IZIN" : "IZIN";\n      else if (holidays.has(date)) status = "RESMI_TATIL";`,
            `    const wd = weekday(date);\n    const outsideEmployment = Boolean(\n      (person.startDate && date < person.startDate) ||\n      (person.exitDate && date > person.exitDate),\n    );\n    const futureDay = date > todayTr;\n    let status = text(override?.status);\n    if (!status || status === "AUTO") {\n      if (leaves.has(date)) status = upper(leaves.get(date)).includes("YILLIK") ? "YILLIK_IZIN" : "IZIN";\n      else if (outsideEmployment || futureDay) status = "DONEM_DISI";\n      else if (holidays.has(date)) status = "RESMI_TATIL";`,
            'attendance-period-guard',
          );

          const page = 'APP/app/ky-erp-frontend/src/pages/modules/ik/IkPersonnelCenterPage.jsx';
          replaceExactlyOnce(
            page,
            `    DEVAMSIZ: "Devamsız",\n`,
            `    DEVAMSIZ: "Devamsız",\n    DONEM_DISI: "Dönem Dışı",\n`,
            'frontend-status-label',
          );

          const registry = 'APP/app/ky-erp-frontend/src/app/moduleRegistry.js';
          replaceExactlyOnce(
            registry,
            `          ["gunluk-odeme-fisleri", "Günlük Ödeme Fişleri", "odemeler"],\n        ],\n      },\n    ],\n  },\n  {\n    key: "uretim",`,
            `          ["gunluk-odeme-fisleri", "Günlük Ödeme Fişleri", "odemeler"],\n        ],\n      },\n    ],\n    hiddenTabs: [\n      ["denetim-raporu", "Denetim Raporları", "raporlar"],\n    ],\n  },\n  {\n    key: "uretim",`,
            'audit-hidden-route',
          );
          NODE

          git diff --check
          git diff -- APP/cloud/ky-erp-api/src/ik-personnel-control.ts APP/app/ky-erp-frontend/src/pages/modules/ik/IkPersonnelCenterPage.jsx APP/app/ky-erp-frontend/src/app/moduleRegistry.js

      - name: Worker paketleri ve typecheck
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Frontend paketleri lint ve build
        working-directory: APP/app/ky-erp-frontend
        env:
          VITE_API_URL: https://api.kyerp.net
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Hotfix commitini production dalina yaz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KY ERP Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/ik-personnel-control.ts \
                  APP/app/ky-erp-frontend/src/pages/modules/ik/IkPersonnelCenterPage.jsx \
                  APP/app/ky-erp-frontend/src/app/moduleRegistry.js
          git diff --cached --quiet && { echo "Hotfix icin degisiklik yok."; exit 1; }
          git commit -m "fix(ik): puantaj donem disi gunleri ve denetim rotasi"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

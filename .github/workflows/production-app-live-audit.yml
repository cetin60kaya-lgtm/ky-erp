name: KY ERP Uygulama Canlı Son Denetim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyerp-production-readonly-audit
  cancel-in-progress: true

jobs:
  audit:
    name: kyerp.net read-only canlı kabul
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Canonical alan adlarını ve API sağlığını doğrula
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local name="$1"
            local url="$2"
            local output="$3"
            local code
            code="$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' --max-time 20 "$url" || true)"
            echo "$name HTTP $code"
            test "$code" = "200"
            test -s "$output"
          }

          check_200 "root" "https://kyerp.net/" /tmp/root.html
          check_200 "login" "https://kyerp.net/giris" /tmp/login.html
          check_200 "mobile-login" "https://kyerp.net/mobile/login" /tmp/mobile-login.html
          check_200 "security" "https://security.kyerp.net/guvenlik/" /tmp/security.html

          api_code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 20 https://api.kyerp.net/api/health || true)"
          test "$api_code" = "200"
          jq -e '.ok == true and .service == "ky-erp-api" and .database == "d1"' /tmp/health.json >/dev/null

          companies_code="$(curl --silent --show-error --output /tmp/companies.json --write-out '%{http_code}' --max-time 20 https://api.kyerp.net/api/employee-portal/companies || true)"
          test "$companies_code" = "200"
          jq -e '.ok == true and (.data | any(.slug == "kyerp-test"))' /tmp/companies.json >/dev/null

          grep -q '<title>KY ERP</title>' /tmp/root.html
          grep -q '<title>KY ERP Güvenlik</title>' /tmp/security.html
          grep -q '/guvenlik/app.js' /tmp/security.html

      - name: Eski KY Güvenlik yollarının kapalı kaldığını doğrula
        shell: bash
        run: |
          set -euo pipefail
          for legacy in security ky-guvenlik ky-guvenlik-recover; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "https://security.kyerp.net/${legacy}/" || true)"
            echo "$legacy HTTP $status"
            test "$status" = "410"
          done

      - name: Gerçek Chrome ile public uygulama ve auth sınırını doğrula
        working-directory: APP/app/ky-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-browser-acceptance.mjs

      - name: Denetim kanıtını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyerp-production-readonly-audit-${{ github.run_id }}
          path: APP/app/ky-erp-frontend/live-acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7

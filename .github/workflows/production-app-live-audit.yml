name: KY ERP Uygulama Canlı Son Denetim

on:
  workflow_run:
    workflows:
      - "KY ERP Canlı Yayın"
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: kyerp.net, app.kyerp.net, Boyahane, Desen ve bundle son denetimi
    runs-on: ubuntu-latest
    steps:
      - name: Production sonucunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          echo "Production workflow sonucu: ${{ github.event.workflow_run.conclusion }}"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Ana alan adı yönlendirmesiz kökte açılıyor mu doğrula
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/kyerp-root.html --write-out '%{http_code}' https://kyerp.net/ || true)"
            if [ "$status" = "200" ] && [ -s /tmp/kyerp-root.html ]; then
              ready=1
              break
            fi
            echo "kyerp.net henüz doğrudan 200 değil: HTTP ${status:-0}"
            sleep 2
          done
          test "$ready" -eq 1
          echo "kyerp.net doğrudan 200 ve yönlendirmesiz açılıyor."

      - name: Gerçek uygulama alan adlarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://app.kyerp.net/" \
            "https://app.kyerp.net/desen/desen-modeller" \
            "https://app.kyerp.net/boyahane/uretim-gecmisi"; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --location --fail --silent --show-error "$url" > /tmp/kyerp-app.html; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
            test -s /tmp/kyerp-app.html
          done
          curl --fail --silent --show-error https://api.kyerp.net/api/health \
            | tee /tmp/kyerp-health.json \
            | jq -e '.ok == true' >/dev/null

      - name: Canlı JS paketinde yeni güvenli, giriş ve Boyahane kodunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            "https://app.kyerp.net/" > /tmp/kyerp-home.html
          script="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/kyerp-home.html | head -1 | sed -n 's/.*src="\([^"]*\)"/\1/p')"
          test -n "$script"
          case "$script" in
            http://*|https://*) script_url="$script" ;;
            /*) script_url="https://app.kyerp.net${script}" ;;
            *) script_url="https://app.kyerp.net/${script#./}" ;;
          esac
          curl --location --fail --silent --show-error "$script_url" > /tmp/kyerp-live.js
          grep -q "kyerp_auth_token" /tmp/kyerp-live.js
          grep -q "kyerpSecureOriginal" /tmp/kyerp-live.js
          grep -q "KY ERP | Kurumsal Giriş" /tmp/kyerp-live.js
          grep -q "Akıllı Renk & Pantone Merkezi" /tmp/kyerp-live.js
          grep -q "Tüm Kayıtlı Renkleri Tara" /tmp/kyerp-live.js
          grep -q "KY ERP AI ile Yorumla" /tmp/kyerp-live.js
          echo "Canlı bundle doğrulandı: $script_url"

      - name: Başarılı sonucu PR kaydına yaz
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/17/comments" \
            -f body="## KY ERP ana alan adı ve uygulama son denetim\n\n- Production run: ${{ github.event.workflow_run.id }}\n- Commit: ${{ github.event.workflow_run.head_sha }}\n- kyerp.net kök ve yönlendirmesiz: ✅\n- app.kyerp.net: ✅\n- Temiz kurumsal giriş bundle: ✅\n- Desen rotası: ✅\n- Boyahane İmalat Boyaları rotası: ✅\n- Authenticated asset bridge canlı bundle: ✅\n- Akıllı Renk & Pantone Merkezi canlı bundle: ✅\n- KY ERP AI renk entegrasyonu frontend: ✅\n- API health: ✅\n- Sonuç: **success**"

      - name: Başarısız sonucu PR kaydına yaz
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/17/comments" \
            -f body="## KY ERP ana alan adı ve uygulama son denetim\n\n- Production run: ${{ github.event.workflow_run.id }}\n- Commit: ${{ github.event.workflow_run.head_sha }}\n- Production sonucu: ${{ github.event.workflow_run.conclusion }}\n- Sonuç: **failure**\n- Kontrol: kyerp.net kök yönlendirme / app.kyerp.net / giriş bundle / Desen / Boyahane / authenticated asset bridge / AI renk merkezi"

name: KY ERP API Sözleşme Denetimi

on:
  # GitHub Actions is disabled for automatic production/PR execution.
  # Cloudflare Git Integration is the automatic deploy path; keep this workflow manual-only as fallback.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend ve Worker rotalarını karşılaştır
        id: audit
        continue-on-error: true
        run: node SCRIPTS/audit-api-contracts.mjs

      - name: Denetim raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-audit
          path: test-results/api-contract-audit.json
          if-no-files-found: error

      - name: Kritik eksikler varsa başarısız say
        if: steps.audit.outcome == 'failure'
        run: |
          echo "İşNet, İK, Yönetim veya Asistan için eksik Worker rotaları var."
          exit 1

name: PDKS Desktop CI

on:
  push:
    branches:
      - pdks-desktop
    paths:
      - "APP/desktop/kyerp-pdks-current/**"
      - ".github/workflows/pdks-desktop-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: APP/desktop/kyerp-pdks-current
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore KYERP.PDKS.sln

      - name: Build solution
        run: dotnet build KYERP.PDKS.sln -c Release --no-restore -warnaserror

      - name: Build live UI audit
        run: dotnet build tools/LiveUiWorkflowAudit/LiveUiWorkflowAudit.csproj -c Release --no-restore -warnaserror

      - name: Build UI audit
        run: dotnet build tools/UiAudit/UiAudit.csproj -c Release --no-restore -warnaserror

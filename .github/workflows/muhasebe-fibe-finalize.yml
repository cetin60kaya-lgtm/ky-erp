name: Muhasebe FIBE Finalize

on:
  push:
    branches:
      - codex/muhasebe-fibe-cari-final
    paths:
      - docs/muhasebe-fibe-finalize-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Branch checkout
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-fibe-cari-final
          fetch-depth: 0

      - name: FIBE'yi firma kartina gom ve ayri FIBE sekmesini kaldir
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('APP/app/ky-erp-frontend/src/pages/modules/muhasebe/CompaniesCurrentWorkspace.jsx')
          s = p.read_text(encoding='utf-8-sig')
          imp = 'import CompanyFibeSection from "./CompanyFibeSection";\n'
          anchor = 'import { loadModuleData, moduleLoadMessage } from "../../../utils/resilientDataLoader";\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('CompaniesCurrentWorkspace import anchor bulunamadi')
              s = s.replace(anchor, anchor + imp, 1)

          marker = '''              <section className="ccw-section">\n                <header><h3>Firma Alias / Eşleşme</h3><span>{aliases.length} kayıt</span></header>'''
          inserted = '''              <CompanyFibeSection\n                activeMainCompany={activeMainCompany}\n                company={selected}\n                onChanged={async () => {\n                  await loadFirms();\n                  await loadMovements(selected);\n                }}\n              />\n\n''' + marker
          if '<CompanyFibeSection' not in s:
              if marker not in s:
                  raise SystemExit('Firma Alias marker bulunamadi')
              s = s.replace(marker, inserted, 1)
          p.write_text(s, encoding='utf-8')

          q = Path('APP/app/ky-erp-frontend/src/pages/modules/muhasebe/QuickAccountingBar.jsx')
          t = q.read_text(encoding='utf-8-sig')
          button = '''        <button type="button" className={mode === "FIBE" ? "active" : ""} onClick={() => setMode("FIBE")}><CircleDollarSign size={16} /> Firma FİBE</button>\n'''
          if button in t:
              t = t.replace(button, '', 1)
          q.write_text(t, encoding='utf-8')
          PY

      - name: Firma karti baglanti kontrolu
        run: |
          grep -q 'CompanyFibeSection' APP/app/ky-erp-frontend/src/pages/modules/muhasebe/CompaniesCurrentWorkspace.jsx
          ! grep -q '> Firma FİBE</button>' APP/app/ky-erp-frontend/src/pages/modules/muhasebe/QuickAccountingBar.jsx
          grep -q 'fibeOpeningAccrual' APP/cloud/ky-erp-api/src/accounting-company-profile.ts
          grep -q 'registerAccountingFibeRoutes' APP/cloud/ky-erp-api/src/accounting-company-profile.ts
          grep -q 'registerAccountingQuickControlRoutes' APP/cloud/ky-erp-api/src/accounting-fibe.ts
          grep -q 'registerAccountingCheckCariRoutes' APP/cloud/ky-erp-api/src/accounting-quick-control.ts

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            APP/cloud/ky-erp-api/package-lock.json
            APP/app/ky-erp-frontend/package-lock.json

      - name: Worker typecheck ve dry-run build
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Izole muhasebe D1 smoke verisini kur
        working-directory: APP/cloud/ky-erp-api
        run: |
          rm -rf .local-accounting-final
          for sql in local-accounting-quick-smoke.sql migrations/0040_accounting_fibe_company_tracking.sql local-accounting-quick-smoke-seed.sql; do
            npx wrangler d1 execute ky-erp-production-local \
              --local \
              --config wrangler.production-local.jsonc \
              --persist-to .local-accounting-final \
              --file "$sql"
          done

      - name: Izole Worker baslat
        working-directory: APP/cloud/ky-erp-api
        run: |
          nohup npx wrangler dev \
            --local \
            --config wrangler.production-local.jsonc \
            --persist-to .local-accounting-final \
            --port 8792 > /tmp/kyerp-accounting-final.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8792/api/health > /tmp/accounting-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kyerp-accounting-final.log
          exit 1

      - name: Cari cek FIBE smoke
        run: |
          set -euo pipefail
          curl --fail --silent \
            'http://127.0.0.1:8792/api/muhasebe/hizli-cari/hafta?mainCompanySlug=mecit-hakan&from=2026-09-01&to=2026-09-07' \
            | jq -e '.ok == true and .data.summary.normalReceivable == 12000'

          curl --fail --silent \
            'http://127.0.0.1:8792/api/muhasebe/fibe/company-isnet-customer?mainCompanySlug=mecit-hakan' \
            | jq -e '.ok == true and .data.summary.automaticAccrual == 200 and .data.summary.remainingBalance == 200'

          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","transactionType":"COLLECTION","amount":2000,"date":"2026-09-03","paymentMethod":"CASH","recordType":"GAYRI_RESMI","description":"Smoke elden tahsilat"}' \
            'http://127.0.0.1:8792/api/muhasebe/hizli-cari/hareket' \
            | jq -e '.ok == true and .data.balanceAfter == 10000'

          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","checkDirection":"RECEIVED","amount":1500,"workType":"OFFICIAL","date":"2026-09-03"}' \
            'http://127.0.0.1:8792/api/muhasebe/hizli-cari/cek/smoke-check-received/kapat' \
            | jq -e '.ok == true and .data.balanceAfter == 8500 and .data.idempotent == false'

          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"mainCompanySlug":"mecit-hakan","companyId":"company-isnet-customer","checkDirection":"RECEIVED","amount":1500,"workType":"OFFICIAL","date":"2026-09-03"}' \
            'http://127.0.0.1:8792/api/muhasebe/hizli-cari/cek/smoke-check-received/kapat' \
            | jq -e '.ok == true and .data.idempotent == true'

          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"mainCompanySlug":"mecit-hakan","movementType":"PAYMENT","date":"2026-09-03","amount":50,"paymentMethod":"CASH","description":"Smoke FIBE odeme"}' \
            'http://127.0.0.1:8792/api/muhasebe/fibe/company-isnet-customer/hareketler' \
            | jq -e '.ok == true and .data.summary.totalPaid == 50 and .data.summary.remainingBalance == 150'

          curl --fail --silent \
            'http://127.0.0.1:8792/api/muhasebe/hizli-cari/hafta?mainCompanySlug=mecit-hakan&from=2026-09-01&to=2026-09-07' \
            | jq -e '.ok == true and .data.summary.normalReceivable == 8500 and .data.summary.cashOutgoing == 50'

      - name: Frontend lint ve build
        working-directory: APP/app/ky-erp-frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Diff guard
        run: |
          git diff --check
          if git diff --name-only | grep -E '(^|/)(DATA|STORAGE)(/|$)|(^|/)\.env($|\.)|\.(db|sqlite|sqlite3)$'; then
            echo 'Yasakli veri dosyasi degisikligi bulundu.' >&2
            exit 1
          fi

      - name: Final patchi kaydet ve tek seferlik akisi temizle
        run: |
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/muhasebe/CompaniesCurrentWorkspace.jsx \
                  APP/app/ky-erp-frontend/src/pages/modules/muhasebe/QuickAccountingBar.jsx
          git rm -f .github/workflows/muhasebe-fibe-finalize.yml docs/muhasebe-fibe-finalize-trigger.txt
          git commit -m "feat(accounting): finalize company FIBE and quick accounting UX"
          git push origin HEAD:codex/muhasebe-fibe-cari-final

      - name: Hata logu
        if: failure()
        run: cat /tmp/kyerp-accounting-final.log 2>/dev/null || true

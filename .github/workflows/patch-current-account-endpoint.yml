name: Muhasebe Cari İşlem Worker Tamamlama

on:
  pull_request:
    paths:
      - ".github/workflows/patch-current-account-endpoint.yml"
      - "APP/cloud/ky-erp-api/src/index.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Çalışma dalını al
        uses: actions/checkout@v4
        with:
          ref: codex/muhasebe-tam-yeniden-tasarim
          fetch-depth: 0

      - name: Cari işlem endpointini ekle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("APP/cloud/ky-erp-api/src/index.ts")
          text = path.read_text(encoding="utf-8")
          marker = 'app.get("/api/muhasebe/cari-hareketler", (c) =>\n'
          if marker not in text:
              raise SystemExit("Cari hareket GET işaretçisi bulunamadı.")
          if 'app.post("/api/muhasebe/cari-hareketler"' in text:
              print("Cari işlem POST endpointi zaten mevcut; değişiklik gerekmiyor.")
              raise SystemExit(0)

          get_start = text.index(marker)
          get_end_marker = '\n\napp.get("/api/muhasebe/belge-import", async (c) => {'
          get_end = text.index(get_end_marker, get_start)
          post_block = r'''

app.post("/api/muhasebe/cari-hareketler", async (c) => {
  const body = await requestBody(c);
  const slug = slugOf(c, body);
  const companyId = databaseText(body.companyId || body.firmId).trim();
  const transactionType = normalizeText(body.transactionType || body.movementType);
  const recordType = normalizeText(body.recordType || "RESMI");
  const amount = databaseNumber(body.amount);
  const movementDate = databaseText(body.date || body.movementDate).slice(0, 10);
  const supportedTypes = new Set(["DEBIT", "CREDIT", "PAYMENT", "COLLECTION"]);

  if (!companyId) {
    return c.json(jsonError("COMPANY_REQUIRED", "Firma seçimi zorunludur."), 400);
  }
  if (!supportedTypes.has(transactionType)) {
    return c.json(
      jsonError(
        "INVALID_TRANSACTION_TYPE",
        "İşlem türü DEBIT, CREDIT, PAYMENT veya COLLECTION olmalıdır.",
      ),
      400,
    );
  }
  if (!movementDate || amount <= 0) {
    return c.json(
      jsonError("INVALID_TRANSACTION", "Tarih ve sıfırdan büyük tutar zorunludur."),
      400,
    );
  }
  if (!["RESMI", "GAYRI RESMI", "GAYRI_RESMI"].includes(recordType)) {
    return c.json(
      jsonError("INVALID_RECORD_TYPE", "Kayıt türü RESMI veya GAYRI_RESMI olmalıdır."),
      400,
    );
  }

  const company = await rowByIdScoped(c, "companies", companyId, slug);
  if (!company) {
    return c.json(jsonError("COMPANY_NOT_FOUND", "Firma kaydı bulunamadı."), 404);
  }

  const requestedId = databaseText(body.id).trim();
  if (requestedId) {
    const existing = await rowByIdScoped(
      c,
      "current_account_movements",
      requestedId,
      slug,
    );
    if (existing) {
      return c.json({
        ok: true,
        success: true,
        data: existing,
        idempotent: true,
      });
    }
  }

  const effect =
    transactionType === "DEBIT" || transactionType === "PAYMENT"
      ? amount
      : -amount;
  const balanceBefore = databaseNumber(company.current_balance);
  const balanceAfter = balanceBefore + effect;
  const movementId = requestedId || crypto.randomUUID();
  const movementType = {
    DEBIT: "BORC",
    CREDIT: "ALACAK",
    PAYMENT: "ODEME",
    COLLECTION: "TAHSILAT",
  }[transactionType];
  const normalizedRecordType = recordType === "RESMI" ? "RESMI" : "GAYRI_RESMI";
  const now = new Date().toISOString();

  await insertDynamic(c, "current_account_movements", {
    id: movementId,
    main_company_slug: slug,
    company_id: companyId,
    movement_date: movementDate,
    movement_type: movementType,
    source_type: "MANUAL_CURRENT_ACCOUNT",
    document_no: body.documentNo || movementId,
    description: body.description || movementType,
    debit:
      transactionType === "DEBIT" || transactionType === "PAYMENT"
        ? amount
        : 0,
    credit:
      transactionType === "CREDIT" || transactionType === "COLLECTION"
        ? amount
        : 0,
    amount,
    effect,
    balance_before: balanceBefore,
    balance_after: balanceAfter,
    record_type: normalizedRecordType,
    raw: {
      transactionType,
      recordType: normalizedRecordType,
      actor: body.actor || "USER",
    },
    created_at: now,
    updated_at: now,
  });

  await updateDynamic(
    c,
    "companies",
    companyId,
    {
      current_balance: balanceAfter,
      updated_at: now,
    },
    slug,
  );

  const saved = await rowByIdScoped(
    c,
    "current_account_movements",
    movementId,
    slug,
  );
  return c.json(
    {
      ok: true,
      success: true,
      data: {
        ...(saved || {}),
        balanceBefore,
        balanceAfter,
      },
    },
    201,
  );
});
'''
          text = text[:get_end] + post_block + text[get_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Worker kontrolü
        working-directory: APP/cloud/ky-erp-api
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Değişikliği kaydet
        run: |
          if git diff --quiet -- APP/cloud/ky-erp-api/src/index.ts; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi
          git config user.name "KY ERP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add APP/cloud/ky-erp-api/src/index.ts
          git diff --cached --check
          git commit -m "feat(muhasebe): hızlı cari işlem endpointini tamamla"
          git push origin HEAD:codex/muhasebe-tam-yeniden-tasarim

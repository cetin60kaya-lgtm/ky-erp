name: KY ERP Pages Live Diagnostic

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/pages-live-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Canonical Pages production deploy tamamlanana kadar bekle
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          database_id="b504b712-6927-499d-815d-0b954c8ee246"
          accounts_json="$(curl --fail --silent --show-error -H "$auth" https://api.cloudflare.com/client/v4/accounts)"
          account_id=""
          while IFS= read -r candidate; do
            dbs="$(curl --fail --silent --show-error -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${candidate}/d1/database?per_page=100")"
            if jq -e --arg id "$database_id" 'any(.result[]?; ((.uuid // .id // "") == $id))' <<<"$dbs" >/dev/null; then
              account_id="$candidate"
              break
            fi
          done < <(jq -r '.result[]?.id' <<<"$accounts_json")
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

          base="https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ky-erp-frontend"
          found=0
          for attempt in $(seq 1 180); do
            deployments="$(curl --fail --silent --show-error -H "$auth" "$base/deployments?per_page=25")"
            deployment="$(jq -c --arg sha "$GITHUB_SHA" '.result[]? | select(.deployment_trigger.metadata.commit_hash == $sha and .environment == "production")' <<<"$deployments" | head -n1)"
            if [ -n "$deployment" ]; then
              id="$(jq -r '.id' <<<"$deployment")"
              stage="$(jq -r '.latest_stage.name // ""' <<<"$deployment")"
              status="$(jq -r '.latest_stage.status // ""' <<<"$deployment")"
              echo "Pages production ${id}: ${stage}/${status} (deneme ${attempt})"
              if [ "$stage" = "deploy" ] && [ "$status" = "success" ]; then
                found=1
                echo "PAGES_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
                break
              fi
              if [ "$status" = "failure" ]; then
                jq '.' <<<"$deployment"
                exit 1
              fi
            else
              echo "GITHUB_SHA production deployment henüz görünmedi (deneme ${attempt})"
            fi
            sleep 4
          done
          test "$found" -eq 1 || {
            echo "Canonical production deployment süresinde tamamlanmadı." >&2
            exit 1
          }

      - name: Production alias ve canlı dual MFA içeriğini doğrula
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ky-erp-frontend"
          project="$(curl --fail --silent --show-error -H "$auth" "$base")"
          canonical_id="$(jq -r '.result.canonical_deployment.id // ""' <<<"$project")"
          test "$canonical_id" = "$PAGES_DEPLOYMENT_ID"
          jq -e '.result.canonical_deployment.aliases | index("https://kyerp.net") != null' <<<"$project" >/dev/null
          jq -e '.result.canonical_deployment.aliases | index("https://app.kyerp.net") != null' <<<"$project" >/dev/null

          for host in kyerp.net app.kyerp.net ky-erp-frontend.pages.dev; do
            stamp="${GITHUB_SHA}-$(date +%s)"
            safe_host="${host//./_}"
            html_file="/tmp/${safe_host}.html"
            js_file="/tmp/${safe_host}.js"
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
              "https://${host}/?verify=${stamp}" -o "$html_file"
            script="$(grep -m1 -oE 'src="/assets/index-[^"]+\.js"' "$html_file" | cut -d'"' -f2)"
            test -n "$script"
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
              "https://${host}${script}?verify=${stamp}" -o "$js_file"
            grep -Fq 'iki ayrı Authenticator güvenlik düzeniyle oturum açın' "$js_file"
            grep -Fq 'Google Authenticator' "$js_file"
            grep -Fq 'Microsoft Authenticator' "$js_file"
            grep -Fq 'KYERP-' "$js_file"
            echo "${host}: DUAL_MFA_CANLI=EVET script=${script}"
          done

          curl --fail --silent https://api.kyerp.net/api/health | jq -e '.ok == true' >/dev/null
          echo "API_HEALTH=OK"

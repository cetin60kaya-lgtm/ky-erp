name: KY ERP D1 Accounting Schema Diagnostic

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/d1-accounting-schema-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only live D1 schema inspection
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami
          echo '=== accounting_documents columns ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "PRAGMA table_info(accounting_documents);" --json
          echo '=== accounting_documents indexes ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "PRAGMA index_list(accounting_documents);" --json
          echo '=== accounting_documents row count ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM accounting_documents;" --json
          echo '=== new file hub tables ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT name,type FROM sqlite_master WHERE name LIKE 'file_hub_%' ORDER BY type,name;" --json

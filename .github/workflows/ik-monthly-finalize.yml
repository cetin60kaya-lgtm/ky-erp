name: İK Aylık Bordro Son Düzenleme

on:
  push:
    branches: [tasarim-final-v1]
    paths: [.github/workflows/ik-monthly-finalize.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tasarim-final-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/app/ky-erp-frontend/package-lock.json

      - name: İK aylık bordro ekranını geliştir
        shell: pwsh
        run: |
          $path = 'APP/app/ky-erp-frontend/src/pages/modules/ik/MonthlyOperationsWorkspace.jsx'
          $c = Get-Content $path -Raw

          $c = $c.Replace('  updateAylikIzin,`n  updateAylikMesai,', '  updateAylikIzin,`n  updateAylikMesai,`n  updateAylikPersonel,')
          $c = $c.Replace('const ADDITION_TYPES = new Set(["Mesai", "Prim", "Ek ödeme"]);', 'const ADDITION_TYPES = new Set(["Mesai", "Hafta içi mesai", "Hafta sonu / resmi tatil", "Prim", "Ek ödeme"]);')
          $c = $c.Replace('const DEDUCTION_TYPES = new Set(["Avans", "Kesinti"]);', 'const DEDUCTION_TYPES = new Set(["Avans", "Kesinti"]);`nconst OVERTIME_MULTIPLIERS = { "Mesai": 1.5, "Hafta içi mesai": 1.5, "Hafta sonu / resmi tatil": 2 };')

          $marker = 'function personName(person) {'
          $helper = @'
function overtimeAmount(salary, hours, baseHours, type) {
  const divisor = [225, 300].includes(num(baseHours)) ? num(baseHours) : 225;
  const multiplier = OVERTIME_MULTIPLIERS[type] || 1;
  return Number(((num(salary) / divisor) * num(hours) * multiplier).toFixed(2));
}

function hasSgk(person) {
  return String(person?.sgkStatus || person?.sgk || "VAR").toLocaleUpperCase("tr-TR") !== "YOK";
}

'@
          if (-not $c.Contains('function overtimeAmount')) { $c = $c.Replace($marker, $helper + $marker) }

          $c = $c.Replace('    status: row.status || "Onaylı",', '    status: row.status || "Onaylı",`n    baseHours: num(row.baseHours || row.monthlyHourBase || 225),`n    multiplier: num(row.multiplier || OVERTIME_MULTIPLIERS[row.type || row.adjustmentType] || 1),')
          $c = $c.Replace('    status: form.status || "Onaylı",', '    status: form.status || "Onaylı",`n    baseHours: num(form.baseHours || 225),`n    multiplier: num(form.multiplier || OVERTIME_MULTIPLIERS[form.type] || 1),')

          $c = $c.Replace('const [adjustmentForm, setAdjustmentForm] = useState({ personId: "", date: TODAY, type: "Mesai", hours: 0, amount: 0, note: "", status: "Onaylı" });', 'const [adjustmentForm, setAdjustmentForm] = useState({ personId: "", date: TODAY, type: "Hafta içi mesai", hours: 0, amount: 0, baseHours: 225, multiplier: 1.5, note: "", status: "Onaylı" });`n  const [payrollForm, setPayrollForm] = useState({ salary: 0, roadAllowance: 0, bankAmount: 0, paymentChannel: "Banka + Elden" });')
          $c = $c.Replace('    setLeaveForm((current) => ({ ...current, personId: selectedId }));', '    setLeaveForm((current) => ({ ...current, personId: selectedId }));`n    const person = people.find((row) => row.id === selectedId);`n    if (person) setPayrollForm({ salary: num(person.salary), roadAllowance: num(person.roadAllowance), bankAmount: num(person.bankAmount), paymentChannel: person.paymentChannel || (hasSgk(person) ? "Banka + Elden" : "Elden") });')
          $c = $c.Replace('  }, [selectedId]);', '  }, [selectedId, people]);')

          $c = $c.Replace('  const base = num(selected?.salary) + num(selected?.roadAllowance);', '  const baseSalary = num(payrollForm.salary || selected?.salary);`n  const roadAllowance = num(payrollForm.roadAllowance || selected?.roadAllowance);`n  const base = baseSalary + roadAllowance;')
          $c = $c.Replace('  const bank = selected?.sgkStatus === "YOK" || String(selected?.paymentChannel || "").toLocaleLowerCase("tr-TR") === "elden" ? 0 : Math.min(net, num(selected?.bankAmount) || net);', '  const bank = !hasSgk(selected) || String(payrollForm.paymentChannel || "").toLocaleLowerCase("tr-TR") === "elden" ? 0 : Math.min(net, num(payrollForm.bankAmount) || net);')
          $c = $c.Replace('setAdjustmentForm({ personId: selectedId, date: TODAY, type: "Mesai", hours: 0, amount: 0, note: "", status: "Onaylı" });', 'setAdjustmentForm({ personId: selectedId, date: TODAY, type: "Hafta içi mesai", hours: 0, amount: 0, baseHours: 225, multiplier: 1.5, note: "", status: "Onaylı" });')
          $c = $c.Replace('if (!adjustmentForm.personId || num(adjustmentForm.amount) <= 0)', 'const calculatedAmount = OVERTIME_MULTIPLIERS[adjustmentForm.type] ? overtimeAmount(baseSalary, adjustmentForm.hours, adjustmentForm.baseHours, adjustmentForm.type) : num(adjustmentForm.amount);`n    const finalForm = { ...adjustmentForm, amount: num(adjustmentForm.amount) > 0 ? num(adjustmentForm.amount) : calculatedAmount, multiplier: OVERTIME_MULTIPLIERS[adjustmentForm.type] || 1 };`n    if (!finalForm.personId || num(finalForm.amount) <= 0)')
          $c = $c.Replace('adjustmentPayload(adjustmentForm, activeCompany)', 'adjustmentPayload(finalForm, activeCompany)')
          $c = $c.Replace('{ ...adjustmentForm, id: editingAdjustmentId || crypto.randomUUID() }', '{ ...finalForm, id: editingAdjustmentId || crypto.randomUUID() }')

          $saveMarker = '  const removeLeave = async (id) => {'
          $saveBlock = @'
  const savePayroll = async () => {
    if (!selected) return;
    setBusy(true); setError(""); setNotice("");
    try {
      const payload = {
        salary: num(payrollForm.salary),
        roadAllowance: num(payrollForm.roadAllowance),
        bankAmount: hasSgk(selected) ? num(payrollForm.bankAmount) : 0,
        paymentChannel: hasSgk(selected) ? payrollForm.paymentChannel : "Elden",
        sgkStatus: hasSgk(selected) ? "VAR" : "YOK",
      };
      const saved = await updateAylikPersonel(selected.id, payload);
      setPeople((current) => current.map((row) => row.id === selected.id ? { ...row, ...payload, ...(saved || {}) } : row));
      setNotice("Bordro temel bilgileri güncellendi.");
    } catch (saveError) { setError(saveError?.message || "Bordro bilgileri güncellenemedi."); }
    finally { setBusy(false); }
  };

'@
          if (-not $c.Contains('const savePayroll')) { $c = $c.Replace($saveMarker, $saveBlock + $saveMarker) }

          $oldType = '<Field label="İşlem türü"><select value={adjustmentForm.type} onChange={(e) => setAdjustmentForm({...adjustmentForm, type:e.target.value})}><option>Mesai</option><option>Prim</option><option>Ek ödeme</option><option>Avans</option><option>Kesinti</option></select></Field>'
          $newType = '<Field label="İşlem türü"><select value={adjustmentForm.type} onChange={(e) => { const type=e.target.value; setAdjustmentForm({...adjustmentForm, type, multiplier: OVERTIME_MULTIPLIERS[type] || 1, amount: OVERTIME_MULTIPLIERS[type] ? 0 : adjustmentForm.amount}); }}><option>Hafta içi mesai</option><option>Hafta sonu / resmi tatil</option><option>Prim</option><option>Ek ödeme</option><option>Avans</option><option>Kesinti</option></select></Field>`n                {OVERTIME_MULTIPLIERS[adjustmentForm.type] ? <><Field label="Saat tabanı"><select value={adjustmentForm.baseHours} onChange={(e) => setAdjustmentForm({...adjustmentForm, baseHours:Number(e.target.value), amount:0})}><option value="225">225 saat</option><option value="300">300 saat</option></select></Field><Field label="Çarpan"><input value={`x${OVERTIME_MULTIPLIERS[adjustmentForm.type]}`} disabled/></Field></> : null}'
          $c = $c.Replace($oldType, $newType)
          $c = $c.Replace('<Field label="Tutar"><input type="number" value={adjustmentForm.amount} onChange={(e) => setAdjustmentForm({...adjustmentForm, amount:e.target.value})}/></Field>', '<Field label="Tutar"><input type="number" value={adjustmentForm.amount || (OVERTIME_MULTIPLIERS[adjustmentForm.type] ? overtimeAmount(baseSalary, adjustmentForm.hours, adjustmentForm.baseHours, adjustmentForm.type) : 0)} onChange={(e) => setAdjustmentForm({...adjustmentForm, amount:e.target.value})}/></Field>')

          $oldPayroll = '{screen === "payroll" ? <section className="ikop-card payroll"><h2><ReceiptText size={19}/>Aylık bordro özeti</h2><div className="ikop-payroll-grid"><div><span>Maaş</span><strong>{money(selected.salary)}</strong></div><div><span>Yol</span><strong>{money(selected.roadAllowance)}</strong></div><div><span>Mesai / prim</span><strong>{money(additions)}</strong></div><div><span>Avans / kesinti</span><strong>-{money(deductions)}</strong></div><div className="net"><span>Net ödeme</span><strong>{money(net)}</strong></div><div><span>Banka</span><strong>{money(bank)}</strong></div><div><span>Elden</span><strong>{money(cash)}</strong></div></div><div className="ikop-payroll-note">Hakediş = Maaş + Yol + Mesai/Prim − Avans/Kesinti. SGK’sız personelde banka tutarı sıfır kabul edilir.</div></section> : null}'
          $newPayroll = '{screen === "payroll" ? <><section className="ikop-card"><h2><ReceiptText size={19}/>Bordro temel bilgileri</h2><div className="ikop-form"><Field label="Maaş"><input type="number" value={payrollForm.salary} onChange={(e)=>setPayrollForm({...payrollForm,salary:e.target.value})}/></Field><Field label="Yol"><input type="number" value={payrollForm.roadAllowance} onChange={(e)=>setPayrollForm({...payrollForm,roadAllowance:e.target.value})}/></Field><Field label="Ödeme şekli"><select value={hasSgk(selected) ? payrollForm.paymentChannel : "Elden"} disabled={!hasSgk(selected)} onChange={(e)=>setPayrollForm({...payrollForm,paymentChannel:e.target.value})}><option>Banka + Elden</option><option>Banka</option><option>Elden</option></select></Field><Field label="Banka tutarı"><input type="number" disabled={!hasSgk(selected) || payrollForm.paymentChannel === "Elden"} value={hasSgk(selected) ? payrollForm.bankAmount : 0} onChange={(e)=>setPayrollForm({...payrollForm,bankAmount:e.target.value})}/></Field></div><div className="ikop-actions"><button className="primary" onClick={savePayroll} disabled={busy}><Save size={16}/>Bordroyu Güncelle</button></div></section><section className="ikop-card payroll"><h2><ReceiptText size={19}/>Aylık bordro özeti</h2><div className="ikop-payroll-grid"><div><span>Maaş</span><strong>{money(baseSalary)}</strong></div><div><span>Yol</span><strong>{money(roadAllowance)}</strong></div><div><span>Mesai / prim</span><strong>{money(additions)}</strong></div><div><span>Avans / kesinti</span><strong>-{money(deductions)}</strong></div><div><span>İzin kaydı</span><strong>{selectedLeaves.reduce((sum,row)=>sum+num(row.days),0)} gün</strong></div><div className="net"><span>Net ödeme</span><strong>{money(net)}</strong></div><div><span>Banka</span><strong>{money(bank)}</strong></div><div><span>Elden</span><strong>{money(cash)}</strong></div></div><div className="ikop-payroll-note">Hafta içi mesai: Maaş / 225 veya 300 × saat × 1,5. Hafta sonu ve resmî tatil: ×2. SGK yoksa ödeme tamamen elden yapılır. Bordro kapanmadan maaş, yol, mesai, izin, avans, kesinti, banka ve elden tutarları düzenlenebilir.</div></section></> : null}'
          $c = $c.Replace($oldPayroll, $newPayroll)

          Set-Content -Path $path -Value $c -Encoding utf8
          if (-not $c.Contains('Bordroyu Güncelle') -or -not $c.Contains('300 saat')) { throw 'İK aylık yaması uygulanamadı.' }

      - name: Frontend bağımlılıklarını kur
        working-directory: APP/app/ky-erp-frontend
        run: npm ci

      - name: Frontend build
        working-directory: APP/app/ky-erp-frontend
        run: npm run build

      - name: İK aylık lint
        working-directory: APP/app/ky-erp-frontend
        run: npx eslint src/pages/modules/ik/MonthlyOperationsWorkspace.jsx --max-warnings=0

      - name: Doğrulanmış değişiklikleri commit et
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ik-monthly-finalize.yml
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/MonthlyOperationsWorkspace.jsx
          git commit -m "İK aylık bordro ve mesai akışını tamamla"
          git push origin HEAD:tasarim-final-v1

name: KYERP Daily Payment Filter Isolation TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-payment-filter-isolation-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyerp-daily-payment-filter-isolation
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply clean source change
        run: |
          set -euo pipefail
          python3 .github/scripts/daily_payment_filter_isolation_temp.py
          git diff --check
          grep -q 'paymentPoolRange' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'paymentHistoryRange' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'gop-payment-history-records' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          ! grep -q 'getDailyPaymentHistory({ mainCompanyId: companyId, startDate: range.start' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate frontend
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit final source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add \
            APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx \
            APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          git commit -m "fix(daily): isolate payment filters and clarify history"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

      - name: Deploy frontend
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git rev-parse HEAD)"

      - name: Production smoke
        run: |
          set -euo pipefail
          for path in /gunluk-operasyon/daily-entry /gunluk-operasyon/daily-payments /gunluk-operasyon/daily-dashboard /gunluk-operasyon/daily-weekly; do
            ok=0
            for i in {1..12}; do
              code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "https://kyerp.net${path}" || true)"
              if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1
          done

      - name: Remove temporary helpers
        if: success()
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/daily-payment-filter-isolation-temp.yml \
            .github/scripts/daily_payment_filter_isolation_temp.py
          git commit -m "chore: remove daily payment filter deployment helpers"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

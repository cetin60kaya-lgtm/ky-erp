name: KY ERP Owner Mail Live Proof

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - ".github/workflows/owner-mail-live-proof.yml"
      - "APP/cloud/ky-erp-api/scripts/owner-mail-live-proof.mjs"

permissions:
  contents: read

concurrency:
  group: kyerp-owner-mail-live-proof
  cancel-in-progress: false

jobs:
  proof:
    name: Worker binding mail delivery proof
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: APP/cloud/ky-erp-api/package-lock.json

      - name: Production Cloudflare erisimini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN eksik" >&2; exit 1; }

      - name: Worker paketlerini kur
        working-directory: APP/cloud/ky-erp-api
        run: npm ci

      - name: Gercek owner mail teslimini kanitla ve Worker'i temizle
        working-directory: APP/cloud/ky-erp-api
        run: node scripts/owner-mail-live-proof.mjs

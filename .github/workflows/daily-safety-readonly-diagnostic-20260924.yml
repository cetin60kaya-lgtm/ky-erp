name: KY ERP Daily Safety Live Tail 20260924

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/daily-safety-readonly-diagnostic-20260924.yml

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canli Worker logunu 90 saniye dinle
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set +e
          echo "TAIL_READY $(date -u +%FT%TZ)"
          timeout --signal=INT 90s npx wrangler tail ky-erp-api --format json
          rc=$?
          echo "TAIL_FINISHED rc=$rc $(date -u +%FT%TZ)"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
            exit "$rc"
          fi
          exit 0

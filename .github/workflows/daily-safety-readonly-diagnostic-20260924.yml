name: KY ERP Daily Save Readonly Verify 20260924

on:
  push:
    branches:
      - diagnostic/daily-save-verify-20260924-final
    paths:
      - .github/workflows/daily-safety-readonly-diagnostic-20260924.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 24 Eylul gunluk kaydi salt-okuma dogrula
        working-directory: APP/cloud/ky-erp-api
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ATTENDANCE_2026_09_24 ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT e.full_name,e.qualification,a.id AS attendance_id,a.work_date,a.day_shift,a.night_shift,a.day_wage,a.night_wage,a.total_amount,a.payment_status,a.created_at,a.updated_at FROM hr_daily_attendance a JOIN hr_daily_employees e ON e.id=a.employee_id WHERE e.main_company_id='mecit-hakan' AND a.work_date='2026-09-24' ORDER BY e.qualification,e.full_name;"
          echo '=== DAY_COUNT_2026_09_24 ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS day_selected_count FROM hr_daily_attendance a JOIN hr_daily_employees e ON e.id=a.employee_id WHERE e.main_company_id='mecit-hakan' AND a.work_date='2026-09-24' AND a.day_shift=1;"
          echo '=== LATEST_AUDIT_2026_09_24 ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT action,employee_id,attendance_id,work_date,shift,actor_label,request_id,created_at,after_json FROM hr_daily_operation_audit WHERE main_company_id='mecit-hakan' AND work_date='2026-09-24' ORDER BY created_at DESC LIMIT 30;"
          echo '=== LATEST_REVISIONS_2026_09_24 ==='
          npx wrangler d1 execute ky-erp-db --remote --config wrangler.jsonc --command "SELECT r.employee_id,e.full_name,r.attendance_id,r.revision,r.day_shift,r.night_shift,r.change_type,r.actor_label,r.request_id,r.created_at FROM hr_daily_attendance_revision r LEFT JOIN hr_daily_employees e ON e.id=r.employee_id WHERE r.main_company_id='mecit-hakan' AND r.work_date='2026-09-24' ORDER BY r.created_at DESC LIMIT 30;"

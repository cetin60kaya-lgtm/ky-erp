name: KYERP Quick Width Roles TEMP

on:
  push:
    branches:
      - codex/model-uretim-kontrol-merkezi-final
    paths:
      - .github/workflows/quick-width-roles-temp.yml

permissions:
  contents: write

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab49b099fee10183fa65951e5077d14a
      VITE_API_URL: https://api.kyerp.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/model-uretim-kontrol-merkezi-final
          fetch-depth: 0
          persist-credentials: true
      - name: Apply compact quick cards and role controls
        run: |
          set -euo pipefail
          python3 .github/scripts/quick_width_roles_temp.py
          git diff --check
          grep -q 'QUICK_CARD_WIDTH_KEY' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'quick-check-mark' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'Vasıf Ekle' APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx
          grep -q 'QUICK-ENTRY-WIDTH-AND-ROLE-CONTROL-2026-09-30' APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend validate
        working-directory: APP/app/ky-erp-frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit final source
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git add APP/app/ky-erp-frontend/src/pages/modules/ik/DailyHrWorkspace.jsx APP/app/ky-erp-frontend/src/pages/modules/ik/daily-hr-workspace-final.css
          git commit -m "fix(daily): compact quick cards and control personnel roles"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final
      - name: Deploy Pages
        working-directory: APP/app/ky-erp-frontend
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name ky-erp-frontend --branch codex/model-uretim-kontrol-merkezi-final --commit-hash "$(git -C ../../.. rev-parse HEAD)"
      - name: Production smoke
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' 'https://kyerp.net/gunluk-operasyon/daily-entry' || true)"
            if [ "$code" = "200" ] && grep -q 'KY ERP' /tmp/page.html; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
      - name: Remove deployment helpers
        if: success()
        run: |
          set -euo pipefail
          git config user.name "kyerp-production-bot"
          git config user.email "kyerp-production-bot@users.noreply.github.com"
          git pull --ff-only origin codex/model-uretim-kontrol-merkezi-final
          git rm -f .github/workflows/quick-width-roles-temp.yml .github/scripts/quick_width_roles_temp.py
          git commit -m "chore: remove quick width role deployment helpers"
          git push origin HEAD:codex/model-uretim-kontrol-merkezi-final

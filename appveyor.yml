version: 'kyerp-pdks-{build}'

image: Visual Studio 2022
skip_tags: true
clone_depth: 1

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-ExecutionPolicy Bypass -Scope Process -Force
      Write-Host 'KYERP PDKS - canonical CI'
      Write-Host 'Branch:' $env:APPVEYOR_REPO_BRANCH
      Write-Host 'Commit:' $env:APPVEYOR_REPO_COMMIT
      dotnet --version
      node --version

      $pdks = Join-Path $env:APPVEYOR_BUILD_FOLDER 'APP\desktop\kyerp-pdks-current'
      Push-Location $pdks
      .\BUILD.ps1
      Pop-Location

      $api = Join-Path $env:APPVEYOR_BUILD_FOLDER 'APP\cloud\ky-erp-api'
      Push-Location $api
      npm ci
      npm run typecheck
      npm test
      npm run build
      Pop-Location

test: off
deploy: off

artifacts:
  - path: APP\desktop\kyerp-pdks-current\artifacts\Personel\**
    name: KYERP-PDKS-Personel
  - path: APP\desktop\kyerp-pdks-current\artifacts\Bridge\**
    name: KYERP-PDKS-Bridge

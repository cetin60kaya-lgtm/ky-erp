version: '1.9.0.{build}'

image: Visual Studio 2022

skip_tags: true
clone_depth: 1

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-ExecutionPolicy Bypass -Scope Process -Force
      Write-Host '============================================================'
      Write-Host 'KY PDKS Pro 1.9.0 - SAF PAKETLEME'
      Write-Host '============================================================'

      $src = 'C:\projects\KYERP-PDKS-FINAL'
      if (Test-Path $src) { Remove-Item $src -Recurse -Force }
      git clone --depth 1 --single-branch --branch codex/pdks-desktop-1.8.1-device-final-20260907 https://github.com/cetin60kaya-lgtm/ky-erp.git $src
      if ($LASTEXITCODE -ne 0) { throw 'Final PDKS branch clone basarisiz.' }
      Set-Location $src
      Write-Host 'Kaynak HEAD:' (git rev-parse HEAD)

      if (-not (Get-Command node.exe -ErrorAction SilentlyContinue)) { choco install nodejs-lts -y --no-progress }
      if (-not (Get-Command dotnet.exe -ErrorAction SilentlyContinue)) { choco install dotnet-8.0-sdk -y --no-progress }
      $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
      if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 bulunamadi.' }

      $root = Join-Path $src 'APP\desktop\ky-pdks'
      $frontend = Join-Path $src 'APP\app\ky-erp-frontend'
      $dist = Join-Path $root 'dist-pdks'
      $desktopOut = Join-Path $dist 'pdks-desktop'
      $agentOut = Join-Path $dist 'agent'
      $setupOut = Join-Path $dist 'setup'
      $webviewOut = Join-Path $dist 'webview2'
      Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
      foreach ($d in @($desktopOut,$agentOut,$setupOut,$webviewOut)) { New-Item $d -ItemType Directory -Force | Out-Null }

      Write-Host '1/4 Frontend production build'
      Push-Location $frontend
      npm ci
      if ($LASTEXITCODE -ne 0) { throw 'Frontend npm ci basarisiz.' }
      npm run build
      if ($LASTEXITCODE -ne 0) { throw 'Frontend production build basarisiz.' }
      Pop-Location
      if (-not (Test-Path (Join-Path $frontend 'dist\index.html'))) { throw 'Frontend dist/index.html olusmadi.' }

      Write-Host '2/4 PDKS Desktop + Agent publish'
      $desktopProject = Join-Path $root 'src\KyPdks.Desktop\KyPdks.Desktop.csproj'
      $agentProject = Join-Path $root 'src\KyPdks.Agent\KyPdks.Agent.csproj'
      dotnet publish $desktopProject -c Release -r win-x64 --self-contained true -p:ProductMode=PDKS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $desktopOut
      if ($LASTEXITCODE -ne 0) { throw 'KY PDKS Pro publish basarisiz.' }
      dotnet publish $agentProject -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $agentOut
      if ($LASTEXITCODE -ne 0) { throw 'PDKS Agent publish basarisiz.' }
      $web = Join-Path $desktopOut 'web'
      New-Item $web -ItemType Directory -Force | Out-Null
      Copy-Item (Join-Path $frontend 'dist\*') $web -Recurse -Force
      if (-not (Test-Path (Join-Path $desktopOut 'KY PDKS Pro.exe'))) { throw 'KY PDKS Pro.exe olusmadi.' }
      if (-not (Test-Path (Join-Path $agentOut 'KYERP.PDKS.Agent.exe'))) { throw 'KYERP.PDKS.Agent.exe olusmadi.' }

      Write-Host '3/4 WebView2 + Inno Setup'
      $wv = Join-Path $webviewOut 'MicrosoftEdgeWebview2Setup.exe'
      Start-FileDownload 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -FileName $wv
      if (-not (Test-Path $wv)) { throw 'WebView2 bootstrapper indirilemedi.' }
      $env:KY_PDKS_DIST = $dist
      $env:KY_PDKS_SETUP_OUT = $setupOut
      & $iscc (Join-Path $root 'installer\KY-PDKS.iss')
      if ($LASTEXITCODE -ne 0) { throw 'Inno Setup derlemesi basarisiz.' }

      Write-Host '4/4 Setup dogrulama + artifact'
      $setup = Join-Path $setupOut 'KY-PDKS-Pro-Setup-1.9.0.exe'
      if (-not (Test-Path $setup)) { throw 'Final Setup olusmadi.' }
      if ((Get-Item $setup).Length -lt 5MB) { throw 'Final Setup beklenenden kucuk.' }
      $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
      $shaFile = "$setup.sha256.txt"
      "$hash  KY-PDKS-Pro-Setup-1.9.0.exe" | Set-Content $shaFile -Encoding ascii
      $info = [ordered]@{
        version='1.9.0'; product='KY PDKS Pro'; scope='PDKS_STANDALONE_CANONICAL_UI';
        setup='KY-PDKS-Pro-Setup-1.9.0.exe'; sha256=$hash; exe='KY PDKS Pro.exe';
        includesPdksAgent=$true; includesCanonicalFrontend=$true; includesWebView2Bootstrapper=$true;
        sourceBranch='codex/pdks-desktop-1.8.1-device-final-20260907'; sourceCommit=(git rev-parse HEAD); builtAt=(Get-Date).ToString('o')
      }
      $infoPath = Join-Path $setupOut 'build-info-pdks.json'
      $info | ConvertTo-Json -Depth 5 | Set-Content $infoPath -Encoding utf8
      Push-AppveyorArtifact $setup -FileName 'KY-PDKS-Pro-Setup-1.9.0.exe'
      Push-AppveyorArtifact $shaFile -FileName 'KY-PDKS-Pro-Setup-1.9.0.exe.sha256.txt'
      Push-AppveyorArtifact $infoPath -FileName 'build-info-pdks.json'
      Write-Host 'SETUP READY:' $setup
      Write-Host 'SHA256:' $hash

test: off

deploy: off

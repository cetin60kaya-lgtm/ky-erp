version: 'kyerp-pdks-{build}'

image: Visual Studio 2022
skip_tags: true
clone_depth: 1

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-ExecutionPolicy Bypass -Scope Process -Force
      Write-Host 'KYERP PDKS - canonical CI + installer'
      Write-Host 'Branch:' $env:APPVEYOR_REPO_BRANCH
      Write-Host 'Commit:' $env:APPVEYOR_REPO_COMMIT
      dotnet --version
      node --version

      $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
      if (-not (Test-Path $iscc)) {
        choco install innosetup -y --no-progress
      }
      if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 kurulamadı.' }

      $pdks = Join-Path $env:APPVEYOR_BUILD_FOLDER 'APP\desktop\kyerp-pdks-current'
      Push-Location $pdks
      .\BUILD_SETUP.ps1
      Pop-Location

      $setup = Join-Path $pdks 'artifacts\Setup\KYERP-PDKS-Setup-2.0.0.exe'
      $sha = "$setup.sha256.txt"
      if (-not (Test-Path $setup)) { throw 'KYERP PDKS setup artifact oluşmadı.' }
      Push-AppveyorArtifact $setup -FileName 'KYERP-PDKS-Setup-2.0.0.exe'
      Push-AppveyorArtifact $sha -FileName 'KYERP-PDKS-Setup-2.0.0.exe.sha256.txt'

      Write-Host 'Desktop build/setup tamam. Worker doğrulanıyor...'
      $api = Join-Path $env:APPVEYOR_BUILD_FOLDER 'APP\cloud\ky-erp-api'
      Push-Location $api
      npm ci
      npm run typecheck
      npm test
      npm run build
      Pop-Location

test: off
deploy: off

artifacts:
  - path: APP\desktop\kyerp-pdks-current\artifacts\Personel\**
    name: KYERP-PDKS-Personel
  - path: APP\desktop\kyerp-pdks-current\artifacts\Bridge\**
    name: KYERP-PDKS-Bridge
  - path: APP\desktop\kyerp-pdks-current\artifacts\Setup\KYERP-PDKS-Setup-2.0.0.exe
    name: KYERP-PDKS-Setup

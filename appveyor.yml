version: '1.9.0.{build}'

image: Visual Studio 2022

skip_tags: true
clone_depth: 1

init:
  - ps: git config --global core.autocrlf false

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-ExecutionPolicy Bypass -Scope Process -Force
      Write-Host '============================================================'
      Write-Host 'KY PDKS Pro 1.9.0 - AppVeyor temiz Windows build'
      Write-Host '============================================================'

      $src = 'C:\projects\KYERP-PDKS-FINAL'
      if (Test-Path $src) { Remove-Item $src -Recurse -Force }
      git clone --depth 1 --single-branch --branch codex/pdks-desktop-1.8.1-device-final-20260907 https://github.com/cetin60kaya-lgtm/ky-erp.git $src
      if ($LASTEXITCODE -ne 0) { throw 'Final PDKS branch temiz clone başarısız.' }
      Set-Location $src
      Write-Host 'PDKS source HEAD:' (git rev-parse HEAD)

      if (-not (Get-Command node.exe -ErrorAction SilentlyContinue)) { choco install nodejs-lts -y --no-progress }
      if (-not (Get-Command npm.cmd -ErrorAction SilentlyContinue)) { throw 'npm bulunamadı.' }
      if (-not (Get-Command dotnet.exe -ErrorAction SilentlyContinue)) { choco install dotnet-8.0-sdk -y --no-progress }
      Write-Host 'Node:' (node --version)
      Write-Host 'npm :' (npm --version)
      Write-Host '.NET:' (dotnet --version)

      $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
      if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 bulunamadı.' }

      .\APP\desktop\ky-pdks\BUILD_PDKS_PRO_SETUP.ps1

      $out = Join-Path $src 'APP\desktop\ky-pdks\dist-pdks\setup'
      $setup = Join-Path $out 'KY-PDKS-Pro-Setup-1.9.0.exe'
      $sha = "$setup.sha256.txt"
      $info = Join-Path $out 'build-info-pdks.json'
      if (-not (Test-Path $setup)) { throw 'KY-PDKS-Pro-Setup-1.9.0.exe oluşmadı.' }
      if ((Get-Item $setup).Length -lt 5MB) { throw 'Setup beklenenden küçük.' }
      if (-not (Test-Path $sha)) { throw 'SHA256 dosyası eksik.' }
      if (-not (Test-Path $info)) { throw 'build-info-pdks.json eksik.' }

      $artifactDir = Join-Path $env:APPVEYOR_BUILD_FOLDER 'pdks-artifacts'
      New-Item $artifactDir -ItemType Directory -Force | Out-Null
      Copy-Item $setup $artifactDir -Force
      Copy-Item $sha $artifactDir -Force
      Copy-Item $info $artifactDir -Force
      Push-AppveyorArtifact (Join-Path $artifactDir 'KY-PDKS-Pro-Setup-1.9.0.exe') -FileName 'KY-PDKS-Pro-Setup-1.9.0.exe'
      Push-AppveyorArtifact (Join-Path $artifactDir 'KY-PDKS-Pro-Setup-1.9.0.exe.sha256.txt') -FileName 'KY-PDKS-Pro-Setup-1.9.0.exe.sha256.txt'
      Push-AppveyorArtifact (Join-Path $artifactDir 'build-info-pdks.json') -FileName 'build-info-pdks.json'

test: off

deploy: off

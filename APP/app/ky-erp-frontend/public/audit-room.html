<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KY ERP Denetçi Odası</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid #dce5f1;border-radius:18px;box-shadow:0 8px 24px rgba(31,53,88,.06)}.hero{padding:22px;margin-bottom:16px}.hero small{font-weight:800;letter-spacing:.12em;color:#58708f}.hero h1{margin:6px 0}.hero p{color:#6d7b90;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.metric{padding:12px;background:#f8fafc;border-radius:12px}.metric span{display:block;font-size:12px;color:#728096}.metric b{font-size:18px}.card{padding:16px;margin-top:14px}.row{display:grid;grid-template-columns:120px 1fr 130px 120px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf1f5}.row small{color:#78869a}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;background:#edf1f5;font-size:11px;font-weight:800}.ok{background:#e7f6ed;color:#267344}.warn{background:#fff4d8;color:#986a00}.bad{background:#ffe7e7;color:#a32626}a.btn{display:inline-block;text-decoration:none;border:1px solid #cfd9e7;border-radius:9px;padding:7px 10px;color:#173a67;font-weight:700}.error{padding:18px;background:#fff0f0;border:1px solid #f0cccc;border-radius:12px;color:#9f2e2e}@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.row>*{min-width:0}}</style></head>
<body><main><div id="app"><div class="hero"><h1>Denetçi Odası yükleniyor…</h1></div></div></main>
<script>
const api="https://api.kyerp.net/api/compliance-public/audit/";
const token=new URLSearchParams(location.search).get("token")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const d=v=>v?new Date(String(v).slice(0,10)+"T00:00:00").toLocaleDateString("tr-TR"):"-";
function remain(v){if(!v)return"Süresiz";const n=Math.ceil((new Date(String(v).slice(0,10)+"T00:00:00")-new Date(new Date().toISOString().slice(0,10)+"T00:00:00"))/86400000);return n<0?Math.abs(n)+" gün geçti":n===0?"Bugün":n+" gün";}
(async()=>{const root=document.getElementById("app");try{if(!token)throw new Error("Denetçi bağlantısı bulunamadı.");const res=await fetch(api+encodeURIComponent(token),{cache:"no-store"}),j=await res.json();if(!res.ok||!j.ok)throw new Error(j?.error?.message||"Bağlantı açılamadı.");const x=j.data,a=x.audit,docs=x.documents||[],findings=x.findings||[];root.innerHTML=`
<section class="hero"><small>KY ERP / SALT OKUNUR DENETÇİ ODASI</small><h1>${esc(a.name)}</h1><p>${esc(a.profileName||"Denetim")} · ${esc(a.auditorName||"Denetçi atanmadı")} · erişim sonu ${d(x.share.expiresAt)}</p><div class="grid"><div class="metric"><span>Denetim durumu</span><b>${esc(a.status||"-")}</b></div><div class="metric"><span>Planlanan tarih</span><b>${d(a.plannedDate)}</b></div><div class="metric"><span>Paylaşılan evrak</span><b>${docs.length}</b></div><div class="metric"><span>Bulgu</span><b>${findings.length}</b></div></div></section>
<section class="card"><h2>Paylaşılan Evraklar</h2>${docs.map(r=>`<div class="row"><span class="badge ${r.expires_at&&remain(r.expires_at).includes("geçti")?"bad":r.expires_at?"warn":"ok"}">${esc(remain(r.expires_at))}</span><div><b>${esc(r.title)}</b><br><small>${esc(r.category||"-")} · ${esc(r.issuer||"Kurum yok")} · ${esc(r.file_name||"Dosya yok")}</small><br><small>Belge: ${d(r.issue_date)} · Başlangıç: ${d(r.valid_from)} · Bitiş: ${d(r.expires_at)}</small></div><span>${esc(r.document_no||"-")}</span>${r.file_name?`<a class="btn" target="_blank" rel="noopener" href="${api}${encodeURIComponent(token)}/files/${encodeURIComponent(r.id)}">${x.share.allowDownload?"İndir":"Görüntüle"}</a>`:"<span>-</span>"}</div>`).join("")||"<p>Paylaşılan evrak yok.</p>"}</section>
<section class="card"><h2>CAPA / Bulgular</h2>${findings.map(r=>`<div class="row"><span class="badge">${esc(r.severity||"-")}</span><div><b>${esc(r.title)}</b><br><small>${esc(r.status||"-")}</small></div><span>${d(r.due_date)}</span><span></span></div>`).join("")||"<p>Açık bulgu yok.</p>"}</section>`; }catch(e){root.innerHTML=`<div class="error"><b>Denetçi Odası açılamadı.</b><br>${esc(e.message)}</div>`;}})();
</script></body></html>

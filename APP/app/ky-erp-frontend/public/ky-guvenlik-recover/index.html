<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KY ERP Güvenlik · Kurtarma</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef5ff;color:#17324d;margin:0;display:grid;min-height:100vh;place-items:center}.card{width:min(88vw,440px);background:#fff;border:1px solid #d7e2ee;border-radius:24px;padding:28px;box-shadow:0 18px 60px #23476b18;text-align:center}.mark{width:82px;height:82px;border-radius:24px;background:#12345d;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:28px}.spin{width:28px;height:28px;border:3px solid #d6e2ef;border-top-color:#1d6f5c;border-radius:50%;margin:20px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{line-height:1.5;color:#60758b}strong{display:block;font-size:20px;margin-bottom:8px}</style>
</head>
<body><main class="card"><div class="mark">KY</div><strong id="title">KY ERP Güvenlik yenileniyor</strong><p id="status">Eski uygulama önbelleği güvenli şekilde temizleniyor. Cihaz kaydın korunacak.</p><div class="spin" id="spin"></div></main>
<script>
(async()=>{
  const status=document.querySelector('#status');
  const title=document.querySelector('#title');
  const legacy=['kyerp-security-static','kyerp-security-static-v2','kyerp-security-static-v3'];
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      let reg=regs.find((item)=>{try{return new URL(item.scope).pathname.startsWith('/ky-guvenlik/')}catch{return false}});
      if(!reg){reg=await navigator.serviceWorker.register('/ky-guvenlik/sw.js',{scope:'/ky-guvenlik/',updateViaCache:'none'});}
      status.textContent='Güvenlik uygulaması güncelleniyor…';
      await reg.update().catch(()=>{});
      const worker=reg.installing||reg.waiting;
      if(worker&&worker.state!=='activated'){
        await Promise.race([new Promise((resolve)=>{const done=()=>{if(worker.state==='activated'||worker.state==='redundant')resolve()};worker.addEventListener('statechange',done);done()}),new Promise((resolve)=>setTimeout(resolve,4000))]);
      }
    }
    const keys=await caches.keys();
    await Promise.all(keys.filter((key)=>legacy.includes(key)||key.startsWith('kyerp-security-shell-')||key.startsWith('kyerp-ky-guvenlik-shell-')).map((key)=>caches.delete(key)));
    title.textContent='KY ERP Güvenlik hazır';
    status.textContent='Güncelleme tamamlandı. Güvenlik uygulaması yeniden açılıyor…';
    setTimeout(()=>location.replace('/ky-guvenlik/?recovered=1'),400);
  }catch{
    title.textContent='KY ERP Güvenlik hazır';
    status.textContent='Güvenli yenileme tamamlandı. Uygulama yeniden açılıyor…';
    setTimeout(()=>location.replace('/ky-guvenlik/?recovered=1'),700);
  }
})();
</script></body></html>

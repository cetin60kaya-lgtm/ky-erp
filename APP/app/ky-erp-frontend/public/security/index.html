<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>KY ERP Güvenlik</title>
  <script>
    (()=>{
      try{
        const target=new URL("/ky-guvenlik/",location.origin);
        const source=new URL(location.href);
        for(const key of ["enrollmentId","enrollmentToken","mode","install","platform","chrome"]){
          const value=source.searchParams.get(key);
          if(value)target.searchParams.set(key,value);
        }
        location.replace(target.href);
      }catch{location.replace("/ky-guvenlik/")}
    })();
  </script>
</head>
<body><p>KY ERP Güvenlik açılıyor…</p></body>
</html>
